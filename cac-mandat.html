<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Fiche mission CAC · Missions et conformité · Express Juridique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/ej-app.css?v=20" />
    <link rel="stylesheet" href="assets/ej-missions.css?v=24" />
    <style>
      /* ---- En-tête entité (repris de lab-dossier.html) ---- */
      .soc-head {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 22px 24px 22px 64px;
        margin-bottom: 24px;
      }
      .soc-motif {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 40px;
        overflow: hidden;
        border-radius: calc(var(--ej-radius-lg) - 1px) 0 0 calc(var(--ej-radius-lg) - 1px);
      }
      .soc-motif i {
        position: absolute;
        left: 0;
        height: 8px;
        border-radius: 0 var(--ej-radius-full) var(--ej-radius-full) 0;
      }
      .soc-motif .m1 {
        top: 24px;
        width: 40px;
        background: var(--ej-logo-mint);
      }
      .soc-motif .m2 {
        top: 38px;
        width: 24px;
        background: var(--ej-action-600);
      }
      .soc-name {
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
        font-weight: 700;
        color: var(--ej-primary-900);
      }
      .soc-form {
        font-size: 14px;
        font-style: italic;
        color: var(--ej-neutral-500);
        margin-top: 2px;
      }
      .soc-greffe {
        font-size: 14px;
        color: var(--ej-neutral-600);
        margin-top: 2px;
      }
      .soc-greffe strong {
        font-weight: 700;
        color: var(--ej-primary-900);
      }
      .soc-ids {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        text-align: right;
        font-size: 13px;
        color: var(--ej-neutral-600);
      }
      .soc-ids .type {
        font-weight: 600;
        color: var(--ej-primary-900);
      }

      /* ---- Fiche mission CAC : styles locaux (à mutualiser si besoin) ---- */
      .d-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .d-alerts {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 16px;
      }
      .d-alerts:empty {
        display: none;
      }
      .d-alerts .alert a {
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      #retour {
        margin-bottom: 16px;
      }
      #retour:empty {
        display: none;
      }
      .actions-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 14px 20px;
        margin-bottom: 8px;
      }
      .actions-bar .info-tip {
        margin-left: auto;
      }
      #absent {
        margin-top: 8px;
      }
      .d-card {
        scroll-margin-top: 72px;
      }
      .d-card .block-head {
        padding-bottom: 14px;
        border-bottom: 1px solid var(--ej-neutral-100);
        align-items: center;
      }
      .d-card .block-head h2 {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .d-card .block-head h2 .ms {
        font-size: 20px;
        color: var(--ej-action-600);
      }
      .d-body {
        padding: 20px 22px 22px;
      }
      .kv-item dd {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .kv-item dd span.v {
        word-break: break-word;
      }
      .val-sub {
        display: block;
        margin-top: 2px;
        font-size: 12.5px;
        font-weight: 400;
        color: var(--ej-neutral-500);
      }
      .val-sub.warn {
        color: var(--ej-warning-600);
        font-weight: 500;
      }
      .sous-titre {
        margin: 22px 0 8px;
        padding-top: 18px;
        border-top: 1px solid var(--ej-neutral-100);
        font-family: var(--ej-font-display);
        font-size: 14px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .sous-titre:first-child {
        margin-top: 0;
        padding-top: 0;
        border-top: none;
      }
      .rtable {
        width: 100%;
        border-collapse: collapse;
      }
      .rtable th {
        background: var(--ej-neutral-50);
        padding: 10px 16px;
        text-align: left;
        font-family: var(--ej-font-display);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ej-neutral-500);
        border-bottom: 1px solid var(--ej-hairline);
        white-space: nowrap;
      }
      .rtable td {
        padding: 12px 16px;
        font-size: 14px;
        border-bottom: 1px solid var(--ej-neutral-100);
        vertical-align: middle;
      }
      .rtable tr:last-child td {
        border-bottom: none;
      }
      .rtable .sub {
        display: block;
        font-size: 12.5px;
        color: var(--ej-neutral-500);
        margin-top: 1px;
      }
      .rtable .nom {
        font-weight: 600;
        color: var(--ej-primary-900);
        font-family: var(--ej-font-display);
      }
      .oui-non {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13.5px;
        font-weight: 500;
      }
      .oui-non .ms {
        font-size: 16px;
      }
      .oui-non.ok {
        color: var(--ej-success-600);
      }
      .oui-non.warn {
        color: var(--ej-warning-600);
      }
      .oui-non.muted {
        color: var(--ej-neutral-500);
      }
      .vide {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 22px;
        border: 1px dashed var(--ej-neutral-300);
        border-radius: var(--ej-radius-lg);
        background: var(--ej-neutral-50);
      }
      .vide strong {
        font-family: var(--ej-font-display);
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .vide p {
        font-size: 14px;
        color: var(--ej-neutral-600);
      }

      /* Frise des exercices du mandat */
      .frise {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }
      .frise li {
        flex: 1 1 118px;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid var(--ej-neutral-200);
        border-radius: var(--ej-radius-lg);
        background: var(--ej-white);
      }
      .frise .an {
        display: block;
        font-family: var(--ej-font-display);
        font-size: 15px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .frise .clos {
        display: block;
        font-size: 12px;
        color: var(--ej-neutral-500);
      }
      .frise .etat {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--ej-neutral-600);
      }
      .frise .dern {
        display: block;
        margin-top: 2px;
        font-size: 11.5px;
        color: var(--ej-neutral-600);
      }
      .frise li.passe {
        background: var(--ej-neutral-50);
      }
      .frise li.passe .an {
        color: var(--ej-neutral-600);
      }
      .frise li.cours {
        border-color: var(--ej-action-600);
        background: var(--ej-action-50);
      }
      .frise li.cours .etat {
        color: var(--ej-action-700);
      }
      .frise li.venir {
        border-style: dashed;
        border-color: var(--ej-neutral-300);
      }

      /* Encadré de fin de mandat */
      .fin-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px 16px;
        margin-top: 18px;
        padding: 14px 16px;
        border: 1px solid var(--ej-info-600);
        border-radius: var(--ej-radius-lg);
        background: var(--ej-info-100);
      }
      .fin-box .t {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--ej-font-display);
        font-size: 14.5px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .fin-box .t .ms {
        font-size: 18px;
        color: var(--ej-info-600);
      }

      /* Aperçu de la lettre de mission (repris de lettre-mission.html) */
      .lm-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px 16px;
        border: 1px solid var(--ej-neutral-200);
        border-radius: var(--ej-radius-lg);
        background: var(--ej-neutral-50);
      }
      .lm-head .t {
        font-size: 14.5px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .lm-head .m {
        font-size: 12.5px;
        color: var(--ej-neutral-500);
      }
      .lm-kv {
        margin-top: 16px;
      }
      .lm-det {
        margin-top: 14px;
      }
      .lm-det summary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        list-style: none;
        padding: 8px 14px;
        border: 1px solid var(--ej-neutral-300);
        border-radius: var(--ej-radius-full);
        font-size: 13.5px;
        font-weight: 500;
        color: var(--ej-primary-900);
      }
      .lm-det summary::-webkit-details-marker {
        display: none;
      }
      .lm-det summary:hover {
        background: var(--ej-neutral-50);
      }
      .lm-det summary .ms {
        font-size: 16px;
        color: var(--ej-action-600);
      }
      .lm-det .chev-d {
        transition: transform var(--ej-transition-fast);
      }
      .lm-det[open] .chev-d {
        transform: rotate(180deg);
      }
      .lm-desk {
        margin-top: 14px;
        padding: 18px;
        border-radius: var(--ej-radius-lg);
        background: var(--ej-neutral-100);
      }
      .lm-sheet {
        max-width: 640px;
        margin: 0 auto;
        padding: 28px 26px 26px;
        background: var(--ej-white);
        border: 1px solid var(--ej-neutral-200);
        border-radius: var(--ej-radius-sm);
        box-shadow: var(--ej-shadow-md);
        font-size: 11.5px;
        line-height: 1.6;
        color: var(--ej-neutral-800);
      }
      .lm-sheet p {
        margin-top: 8px;
      }
      .lm-sh-top {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--ej-primary-900);
      }
      .lm-sh-cab {
        font-family: var(--ej-font-display);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ej-primary-900);
      }
      .lm-sh-mut {
        color: var(--ej-neutral-500);
      }
      .lm-sh-meta {
        text-align: right;
        color: var(--ej-neutral-600);
        font-variant-numeric: tabular-nums;
      }
      .lm-sh-dest {
        margin: 16px 0 0 auto;
        width: 62%;
        min-width: 180px;
      }
      .lm-sh-dest strong {
        font-weight: 600;
        color: var(--ej-neutral-900);
      }
      .lm-sh-title {
        margin-top: 20px;
        font-family: var(--ej-font-display);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--ej-primary-900);
      }
      .lm-sheet h4 {
        margin-top: 14px;
        font-family: var(--ej-font-display);
        font-size: 11.5px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .lm-sheet ul {
        margin: 4px 0 0 16px;
      }
      .lm-sheet li + li {
        margin-top: 2px;
      }
      .lm-sh-table {
        width: 100%;
        margin-top: 6px;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      .lm-sh-table td {
        padding: 4px 0;
        border-bottom: 1px solid var(--ej-neutral-100);
        vertical-align: top;
      }
      .lm-sh-table td:last-child {
        text-align: right;
        white-space: nowrap;
        padding-left: 12px;
      }
      .lm-sh-sign {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 18px;
      }
      .lm-sh-sign > div {
        padding-top: 8px;
        border-top: 1px solid var(--ej-neutral-300);
        color: var(--ej-neutral-600);
      }
      .lm-sh-sign strong {
        display: block;
        font-weight: 600;
        color: var(--ej-neutral-900);
      }

      /* Check-list d'acceptation */
      .accept {
        display: flex;
        flex-direction: column;
      }
      .accept .it {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 12px 0;
        border-bottom: 1px solid var(--ej-neutral-100);
      }
      .accept .it:first-child {
        padding-top: 0;
      }
      .accept .it .etat {
        width: 24px;
        height: 24px;
        font-size: 22px;
      }
      .accept .it .etat.ok {
        color: var(--ej-success-600);
      }
      .accept .it .etat.att {
        color: var(--ej-neutral-400);
      }
      .accept .lib {
        font-size: 14.5px;
        font-weight: 500;
        color: var(--ej-neutral-900);
      }
      .accept .det {
        font-size: 12.5px;
        color: var(--ej-neutral-500);
      }
      .accept .det.warn {
        color: var(--ej-warning-600);
      }
      .accept-bas {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px 16px;
        margin-top: 16px;
      }
      .accept-bas .bilan {
        font-size: 13.5px;
        font-weight: 500;
        color: var(--ej-neutral-700);
      }

      /* Journal */
      .journal {
        list-style: none;
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .journal::before {
        content: "";
        position: absolute;
        left: 15px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: var(--ej-neutral-200);
      }
      .journal li {
        position: relative;
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }
      .j-ico {
        position: relative;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--ej-white);
        border: 1px solid var(--ej-hairline);
        color: var(--ej-action-600);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .j-ico .ms {
        font-size: 16px;
      }
      .j-ico.warn {
        color: var(--ej-warning-600);
      }
      .j-date {
        font-size: 12.5px;
        font-style: italic;
        color: var(--ej-action-600);
      }
      .j-txt {
        font-size: 14px;
        color: var(--ej-neutral-900);
      }
      .j-who {
        font-size: 12.5px;
        color: var(--ej-neutral-500);
      }

      /* Impression de la fiche (Exporter la fiche) : contenu seul, sans l'habillage de l'application */
      @media print {
        .ej-header,
        #ej-header,
        .sidebar,
        #ej-sidebar,
        .ej-footer,
        #ej-footer,
        .help-bubble,
        .back-link,
        .tabs,
        .actions-bar,
        .info-tip,
        .lm-det,
        #retour {
          display: none !important;
        }
        body {
          background: none;
        }
        .app {
          display: block;
        }
        .page {
          max-width: none;
          padding: 0;
        }
        .card {
          box-shadow: none;
          break-inside: avoid;
        }
        .d-body {
          padding: 12px 0 0;
        }
        .alert {
          break-inside: avoid;
        }
        a {
          text-decoration: none;
        }
      }

      @media (max-width: 760px) {
        .soc-head {
          flex-direction: column;
          align-items: flex-start;
          padding: 20px 16px 18px 44px;
          gap: 14px;
        }
        .soc-motif {
          width: 24px;
        }
        .soc-motif .m1 {
          width: 24px;
        }
        .soc-motif .m2 {
          width: 14px;
        }
        .soc-name {
          font-size: 21px;
        }
        .soc-ids {
          align-items: flex-start;
          text-align: left;
        }
        .actions-bar {
          flex-direction: column;
          align-items: stretch;
        }
        .actions-bar .btn {
          width: 100%;
          justify-content: center;
          white-space: normal;
          text-align: center;
        }
        .actions-bar .hint {
          margin-left: 0;
        }
        .d-body {
          padding: 16px 16px 18px;
        }
        .d-card .block-head {
          padding: 16px 16px 12px;
          flex-wrap: wrap;
          align-items: flex-start;
        }
        .d-card .block-head .btn {
          width: 100%;
          justify-content: center;
        }
        .rtable,
        .rtable tbody,
        .rtable tr,
        .rtable td {
          display: block;
          width: 100%;
        }
        .rtable thead {
          display: none;
        }
        .rtable tr {
          padding: 12px 0;
          border-bottom: 1px solid var(--ej-neutral-200);
        }
        .rtable tr:last-child {
          border-bottom: none;
        }
        .rtable td {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 12px;
          padding: 4px 0;
          border: none;
          text-align: right;
        }
        .rtable td::before {
          content: attr(data-label);
          flex-shrink: 0;
          padding-top: 2px;
          font-family: var(--ej-font-display);
          font-size: 10.5px;
          font-weight: 600;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: var(--ej-neutral-500);
          text-align: left;
        }
        .rtable td.cell-main {
          display: block;
          text-align: left;
          padding-bottom: 6px;
        }
        .rtable td.cell-main::before {
          display: none;
        }
        .lm-desk {
          padding: 12px;
        }
        .lm-sheet {
          padding: 20px 16px 18px;
        }
        .lm-sh-meta {
          text-align: left;
        }
        .lm-sh-dest {
          width: 100%;
        }
        .lm-sh-sign {
          grid-template-columns: 1fr;
        }
        .accept-bas .btn {
          width: 100%;
          justify-content: center;
        }
      }

      @media (max-width: 760px) {
        .tabs {
          overflow-x: auto;
          scrollbar-width: none;
          -webkit-overflow-scrolling: touch;
        }
        .tabs::-webkit-scrollbar {
          display: none;
        }
        .tab {
          flex-shrink: 0;
          white-space: nowrap;
          margin-bottom: 0;
        }
      }
      body.m-resp .fin-box .btn { white-space: normal; max-width: 100%; }
    </style>
  </head>
  <body class="m-resp" data-active="cac">
    <div id="ej-header"></div>
    <div class="app">
      <div id="ej-sidebar"></div>
      <div class="main">
        <div class="page">
          <a class="back-link" href="cac.html"><span class="ms">chevron_left</span>Missions CAC</a>

          <div class="card d-card" id="absent" hidden>
            <div class="d-body">
              <div class="vide">
                <strong>Mission introuvable</strong>
                <p>Aucune mission CAC ne correspond à l'identifiant « <span id="absent-id"></span> ».</p>
                <a class="btn btn-secondary btn-sm" href="cac.html"><span class="ms">chevron_left</span>Retour aux missions CAC</a>
              </div>
            </div>
          </div>

          <div id="contenu">
            <div class="card soc-head" id="head"></div>
            <div class="tabs" id="tabs"></div>
            <div class="d-alerts" id="alerts"></div>
            <div id="retour" aria-live="polite"></div>

            <div class="card actions-bar" id="actions"></div>

            <div class="d-stack" id="sections"></div>
          </div>

        </div>
        <div id="ej-footer"></div>
      </div>
    </div>

    <script src="assets/ej-missions-data.js?v=28"></script>
    <script src="assets/ej-lab.js?v=7"></script>
    <script>
      /* Rendu au DOMContentLoaded : ej-shell.js (chargé après) pose data-profil sur le body avant cet événement */
      document.addEventListener("DOMContentLoaded", function () {
        var E = window.EJM,
          esc = E.esc,
          profil = document.body.dataset.profil || "ec";

        /* ---------- Mission affichée (sans paramètre : vertalis ; id inconnu : état « introuvable ») ---------- */
        var id = new URLSearchParams(location.search).get("id");
        var m = id === null ? E.findMandat("vertalis") : E.findMandat(id);
        document.querySelectorAll('a[href="#"]').forEach(function (a) {
          a.addEventListener("click", function (e) { e.preventDefault(); });
        });
        if (!m) {
          document.title = "Mission introuvable · Missions CAC · Express Juridique";
          document.getElementById("contenu").hidden = true;
          var abs = document.getElementById("absent");
          abs.hidden = false;
          document.getElementById("absent-id").textContent = id;
          return;
        }
        document.title = m.nom + " · Mission CAC · Express Juridique";
        var L = m.lab;

        /* ---------- Enrichissement local (fictif, cohérent avec EJM) ----------
           [siège, capital, représentant légal (nom), qualité] */
        var FORMES = {
          SA: "société anonyme",

        sheet += titre("Durée");
        sheet += "<p>" + (contr
          ? "La mission porte sur l'exercice clos le " + m.ex.clos + ". Elle prend fin avec la remise du rapport d'audit contractuel."
          : "La mission porte sur " + NB[nbExo] + " exercices, de l'exercice " + m.premier + " à l'exercice " + m.dernier + ", à compter de la nomination du " + m.nomination + ".") + "</p>";
        sheet += titre("Rapports");
        sheet += "<p>Pour chaque exercice, les rapports sont remis avant l'assemblée générale qui approuve les comptes.</p>";
        sheet += titre(lmSignee ? "Équipe à la signature" : "Équipe");
        sheet += "<p>Signataire : " + esc(signataire.nom) + ", " + esc(signataire.role.toLowerCase()) + ". " +
          (H.equipe.length
            ? "Équipe : " + H.equipe.map(function (k) { return esc(E.equipe[k].nom) + ", " + esc(E.equipe[k].role.toLowerCase()); }).join(" ; ") + "."
            : "Aucun auditeur supplémentaire affecté à ce stade.") + "</p>";
        sheet += titre("Honoraires");
        sheet += '<table class="lm-sh-table"><tr><td>Honoraires ' + (contr ? "de la mission" : "annuels") + ' HT<small>Exercice ' + m.premier + '</small></td><td>' + esc(E.euros(H.hon)) + "</td></tr></table>";
        sheet += titre("Obligations réciproques");
        sheet += "<ul><li>Le cabinet exécute sa mission selon les normes d'exercice professionnel, dans le respect du secret professionnel et de son indépendance.</li>" +
          "<li>L'entité met à disposition, dans les délais convenus, les documents, informations et accès nécessaires à la mission.</li>" +
          "<li>L'entité informe le cabinet des événements significatifs survenus pendant la période.</li></ul>";
        sheet += '<div class="lm-sh-sign"><div><strong>Pour le cabinet</strong>' + esc(signataire.nom) + "<br>" + (lmSignee ? "Signée le " + m.lm.date : "Signature à venir") + "</div>" +
          "<div><strong>Pour l'entité</strong>" + esc(F[2]) + "<br>" + (lmSignee ? "Signée le " + m.lm.date : "En attente de signature") + "</div></div>";

        /* Valeurs signées et valeurs en vigueur (avenants) */
        var corpsLM = '<div class="lm-head"><div><div class="t">' + esc(titreLM) +
          (contr ? "" : " " + tip("duree-lettre", "La lettre porte sur la durée du mandat, soit les exercices " + m.premier + " à " + m.dernier + ". Une lettre signée n'est pas modifiée : l'équipe et les honoraires en vigueur sont ceux des avenants.", "Durée couverte par la lettre")) +
          '</div><div class="m">' + lmMeta + '</div></div>' +
          '<span class="badge ' + LM_BADGE[m.lm.statut] + '">' + LM_LIB[m.lm.statut] + "</span></div>";
        var kvL = "";
        if (lmSignee && avenants.length) {
          var ev = avenants.filter(function (a) { return a.h; });
          var dernierH = ev.length ? ev[ev.length - 1] : null;
          var evE = avenants.filter(function (a) { return a.eq; });
          var dernierE = evE.length ? evE[evE.length - 1] : null;
          kvL += kv("Honoraires à la signature", esc(E.euros(H.hon)) + " HT" + parAn, '<span class="val-sub">Exercice ' + m.premier + "</span>");
          kvL += kv("Équipe à la signature", esc(nomsEquipe(H.equipe)));
          kvL += kv("Honoraires en vigueur", esc(E.euros(m.honoraires)) + " HT" + parAn,
            '<span class="val-sub">Exercice ' + anExo + (dernierH ? ", avenant du " + dernierH.d : "") + "</span>");
          kvL += kv("Équipe en vigueur", esc(nomsEquipe(m.equipe)), dernierE ? '<span class="val-sub">Avenant du ' + dernierE.d + "</span>" : "");
        } else {
          kvL += kv("Honoraires " + (contr ? "de la mission" : "annuels"), esc(E.euros(m.honoraires)) + " HT" + parAn);
        }
        corpsLM += '<dl class="kv lm-kv">' + kvL + "</dl>";
        if (avenants.length) {
          corpsLM += '<h3 class="sous-titre">Avenants</h3><div class="table-scroll"><table class="rtable"><thead><tr><th>Date</th><th>Avenant</th><th>Effet</th></tr></thead><tbody>' +
            avenants.map(function (a) {
              return "<tr>" +
                '<td class="cell-main" data-label="Date"><span class="nom">' + a.d + "</span></td>" +
                '<td data-label="Avenant">' + (a.h ? "Honoraires" : "Équipe") + "</td>" +
                '<td data-label="Effet">' + (a.h ? "Honoraires portés de " + esc(E.euros(a.h[0])) + " à " + esc(E.euros(a.h[1])) + " HT" + parAn : esc(a.eq)) + "</td></tr>";
            }).join("") + "</tbody></table></div>";
        }
        corpsLM += '<details class="lm-det"><summary><span class="ms">file-text</span>' + (lmSignee ? "Aperçu de la lettre signée" : "Aperçu de la lettre") + '<span class="ms chev-d">chevron-down</span></summary>' +
          '<div class="lm-desk"><div class="lm-sheet">' + sheet + "</div></div></details>";
        out.push(carte("file-pen-line", "Lettre de mission CAC", "", btnRelance, corpsLM, "lettre"));

        /* 5. Indépendance et acceptation */
        var indBadge = indep.statut === "a_jour" ? '<span class="badge badge-success">' + E.INDEP.a_jour + "</span>"
          : '<span class="badge badge-action">' + E.INDEP[indep.statut] + "</span>";
        var tabInd = '<div class="table-scroll"><table class="rtable"><thead><tr><th>Membre</th><th>Rôle</th><th>Déclaration annuelle</th><th>Date</th></tr></thead><tbody>' +
          equipe.map(function (k) {
            var p = E.equipe[k];
            return "<tr>" +
              '<td class="cell-main" data-label="Membre"><span class="nom">' + esc(p.nom) + "</span></td>" +
              '<td data-label="Rôle">' + esc(p.role) + "</td>" +
              '<td data-label="Déclaration">' + indBadge + "</td>" +
              '<td data-label="Date">' + (indep.date ? indep.date : '<span class="muted">Aucune</span>') + "</td></tr>";
          }).join("") + "</tbody></table></div>";
        var autres = dansPortefeuilleEC
          ? '<span class="oui-non warn"><span class="ms">triangle-alert</span>Entité cliente du cabinet : incompatibilité à examiner</span>'
          : '<span class="oui-non muted"><span class="ms">circle-dashed</span>Aucun service enregistré</span>';
        var corpsInd =
          '<h3 class="sous-titre">Déclaration annuelle de l\'équipe</h3>' + tabInd +
          '<h3 class="sous-titre">Services autres que la certification ' +
          tip("services", profil === "cac"
            ? "Aucune mission comptable ou juridique du cabinet pour cette entité. Les autres services éventuels sont à consigner par le signataire."
            : dansPortefeuilleEC ? "L'entité figure dans le portefeuille d'expertise comptable du cabinet (rapprochement par SIREN)." : "Aucune mission comptable ou juridique du cabinet pour cette entité (rapprochement par SIREN). Les autres services éventuels sont à consigner par le signataire.",
            "Services autres que la certification") + "</h3>" +
          '<div>' + autres + "</div>";
        if (enAcceptation) {
          var items = [
            { ok: L.statut === "a_jour", lib: "Identification LAB",
              det: L.statut === "a_jour" ? "Dossier à jour." : "Pièces, bénéficiaires effectifs et évaluation du risque : à compléter dans", lien: ["lab-dossier.html?id=" + encodeURIComponent(m.id), "l'onglet Vigilance LAB"] },
            { ok: indep.statut === "a_jour", lib: "Indépendance de l'équipe",
              det: indep.statut === "a_jour" ? "Déclaration à jour." : "Déclaration de l'équipe à faire avant d'accepter." },
            { ok: equipe.length > 0, lib: "Équipe affectée",
              det: "Signataire : " + signataire.nom +
                (m.equipe.length ? ", avec " + nomsMembres(m.equipe) : ", sans auditeur supplémentaire à ce stade") + "." },
          ];
          var nOk = items.filter(function (i) { return i.ok; }).length;
          corpsInd =
            '<h3 class="sous-titre" id="acceptation">Check-list d\'acceptation ' +
            tip("lettre-accept", m.lm.statut === "a_etablir" ? "Lettre de mission : à établir après l'acceptation." : "Lettre de mission : " + LM_LIB[m.lm.statut].toLowerCase() + (m.lm.ref ? " (réf. " + m.lm.ref + ")" : "") + ".", "Lettre de mission") +
            '</h3><div class="accept">' +
            items.map(function (i) {
              return '<div class="it"><span class="ms etat ' + (i.ok ? "ok" : "att") + '">' + (i.ok ? "circle-check" : "circle-dashed") + "</span>" +
                '<div><div class="lib">' + esc(i.lib) + '</div><div class="det' + (i.ok ? "" : " warn") + '">' + esc(i.det) + (!i.ok && i.lien ? ' <a href="' + i.lien[0] + '">' + esc(i.lien[1]) + "</a>." : "") + "</div></div></div>";
            }).join("") + "</div>" +
            '<div class="accept-bas"><span class="bilan">' + nOk + " élément" + (nOk > 1 ? "s" : "") + " réuni" + (nOk > 1 ? "s" : "") + " sur " + items.length + '</span>' +
            '<button class="btn btn-primary btn-sm" type="button" disabled title="Disponible quand les ' + NB[items.length] + ' éléments sont réunis"><span class="ms">badge-check</span>Accepter la mission</button></div>' +
            corpsInd;
        }
        out.push(carte("shield-check", "Indépendance et acceptation", enAcceptation ? "À réunir avant d'accepter la mission" : "Déclaration annuelle et services autres que la certification", "", corpsInd, "independance"));

        /* 7. Historique */
        var J = [];
        function ajoute(d, i, t, w, warn) {
          if (dt(d) <= TODAY) J.push({ d: d, n: J.length, i: i, t: t, w: w, warn: !!warn });
        }
        /* Événements juridiques du mandat ; le détail du dossier LAB (pièces, criblage) est dans l'onglet Vigilance LAB */
        if (m.nomination) ajoute(m.nomination, "stamp", "Nomination comme commissaire aux comptes " + de(m.nom) + ".", esc(signataire.nom));
        if (m.lm.date) ajoute(m.lm.date, lmSignee ? "file-pen-line" : "send", lmSignee ? "Lettre de mission signée (réf. " + m.lm.ref + ")." : "Lettre de mission envoyée pour signature (réf. " + m.lm.ref + ").", esc(signataire.nom));
        if (indep.date) ajoute(indep.date, "shield-check", "Déclaration d'indépendance de l'équipe" + (indep.statut === "a_renouveler" ? " (à renouveler)." : "."), esc(equipe.map(function (k) { return E.equipe[k].nom; }).join(", ")), indep.statut === "a_renouveler");
        avenants.forEach(function (a) {
          ajoute(a.d, a.h ? "file-pen-line" : "users", a.h ? "Avenant d'honoraires : " + E.euros(a.h[0]) + " portés à " + E.euros(a.h[1]) + " HT." : "Avenant d'équipe : " + a.eq + ".", esc(signataire.nom));
        });
        if (L.ouverture) ajoute(L.ouverture, "folder-open", "Dossier de vigilance LAB ouvert.", esc(E.equipe[E.responsableLab("cac")].nom));
        if (L.derniereRevue) ajoute(L.derniereRevue, "shield-check", "Revue LAB validée (risque " + (L.risque ? E.RISQUE[L.risque].replace("Risque ", "") : "non évalué") + ").", esc(E.equipe[E.responsableLab("cac")].nom));
        rapportsEmis.forEach(function (x) {
          ajoute(x[2], "file-check", "Rapports de l'exercice " + x[4] + " émis.", esc(signataire.nom));
        });
        J.sort(function (a, b) { return dt(b.d) - dt(a.d) || b.n - a.n; });
        out.push(carte("history", "Historique", "Journal daté du mandat.", "",
          '<ul class="journal" id="journal">' + J.map(function (j) {
            return '<li><span class="j-ico' + (j.warn ? " warn" : "") + '"><span class="ms">' + j.i + "</span></span>" +
              '<div><div class="j-date">' + j.d + '</div><div class="j-txt">' + esc(j.t) + '</div><div class="j-who">' + j.w + "</div></div></li>";
          }).join("") + "</ul>", "historique"));

        document.getElementById("sections").innerHTML = out.join("");

        /* ---------- Interactions ---------- */
        var bX = document.getElementById("exporter");
        if (bX) bX.addEventListener("click", function () { window.print(); });
        var retour = document.getElementById("retour");
        var bR = document.getElementById("relance");
        if (bR)
          bR.addEventListener("click", function () {
            retour.innerHTML = '<div class="alert alert-success"><span class="ms">circle-check</span><div>Relance de signature envoyée à ' + esc(F[2]) + " pour la lettre " + esc(m.lm.ref) + ".</div></div>";
            bR.disabled = true;
            bR.innerHTML = '<span class="ms">circle-check</span>Relance envoyée';
          });
      });
    </script>
    <script src="assets/ej-shell.js?v=27"></script>
  </body>
</html>
