<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Cockpit · Express Juridique</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/ej-app.css?v=19" />
    <link rel="stylesheet" href="assets/ej-missions.css?v=19" />
    <style>
      /* Cockpit en canevas de tableaux (préfixe cv-). Aucune nouvelle couleur : tokens de ej-app.css. */
      .page.cv-page {
        max-width: 1280px;
        padding-top: 22px;
        padding-bottom: 72px; /* la bulle d'aide ne recouvre jamais le dernier widget */
      }
      body.cv-lock {
        overflow: hidden;
      }
      /* La bulle d'aide fixe recouvrait des widgets : sur le cockpit, l'aide passe par « Demander à l'IA » */
      body[data-active="cockpit"] .help-bubble {
        display: none;
      }
      body.cv-ai-open .main {
        transition: padding-right var(--ej-transition-normal);
      }

      /* ---------- En-tête ---------- */
      .cv-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        min-height: 44px;
      }
      .cv-h1 {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        margin: 0;
        font-size: inherit;
      }
      .cv-titlebtn {
        display: inline-flex;
        align-items: flex-start;
        text-align: left;
        gap: 6px;
        max-width: 100%;
        padding: 4px 8px;
        margin-left: -8px;
        border-radius: var(--ej-radius-md);
        font-family: var(--ej-font-display);
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: var(--ej-primary-900);
        transition: background var(--ej-transition-fast);
      }
      .cv-titlebtn:hover {
        background: var(--ej-neutral-100);
      }
      .cv-titlebtn > span:first-child {
        white-space: normal;
        overflow-wrap: anywhere;
        line-height: 1.2;
        padding-top: 2px;
      }
      .cv-titlebtn .ms {
        font-size: 20px;
        margin-top: 4px;
        color: var(--ej-neutral-400);
      }
      .cv-title-input {
        font-family: var(--ej-font-display);
        font-size: 22px;
        font-weight: 600;
        color: var(--ej-primary-900);
        height: 40px;
        max-width: 360px;
      }
      .cv-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      /* ---------- Filtres globaux ---------- */
      .cv-filters {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 -4px 20px;
        padding: 4px;
        flex-wrap: wrap;
      }
      .cv-filters .qf-pill {
        white-space: nowrap;
        flex-shrink: 0;
        height: 30px;
        padding: 0 12px;
        font-size: 12px;
        background: var(--ej-white);
      }
      .cv-filters .qf-pill .ms {
        font-size: 14px;
        color: var(--ej-neutral-400);
      }
      .cv-filters .qf-pill .cv-k {
        font-weight: 500;
        color: var(--ej-neutral-500);
      }
      .cv-filters .qf-pill.active .cv-k {
        color: var(--ej-neutral-600);
      }
      .cv-clear {
        font-size: 12px;
        font-weight: 600;
        color: var(--ej-action-600);
        padding: 4px 6px;
        border-radius: var(--ej-radius-sm);
      }
      .cv-clear:hover {
        text-decoration: underline;
      }
      .cv-flash {
        animation: cv-flash 1.6s ease;
      }
      @keyframes cv-flash {
        0%,
        60% {
          box-shadow: 0 0 0 3px var(--ej-action-200);
        }
        100% {
          box-shadow: none;
        }
      }

      /* ---------- Menus déroulants ---------- */
      .cv-dd {
        position: relative;
      }
      .cv-menu {
        position: absolute;
        left: 0;
        top: calc(100% + 6px);
        z-index: 85;
        min-width: 220px;
        max-height: 70vh;
        overflow-y: auto;
        padding: 6px;
        background: var(--ej-white);
        border: 1px solid var(--ej-neutral-200);
        border-radius: var(--ej-radius-lg);
        box-shadow: var(--ej-shadow-lg);
      }
      .cv-menu.right {
        left: auto;
        right: 0;
      }
      .cv-menu[hidden] {
        display: none;
      }
      .cv-mi {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border-radius: var(--ej-radius-md);
        font-size: 13.5px;
        text-align: left;
        color: var(--ej-neutral-700);
      }
      .cv-mi:hover,
      .cv-mi:focus-visible {
        background: var(--ej-neutral-50);
        color: var(--ej-neutral-900);
      }
      .cv-mi .ms {
        font-size: 16px;
        color: var(--ej-neutral-400);
      }
      .cv-mi .cv-check {
        margin-left: auto;
        color: var(--ej-action-600);
      }
      .cv-mi[aria-checked="false"] .cv-check,
      .cv-mi:not([aria-checked]) .cv-check {
        visibility: hidden;
      }
      .cv-mi.current {
        color: var(--ej-action-700);
        font-weight: 600;
      }
      .cv-mi.danger {
        color: var(--ej-error-600);
      }
      .cv-mi.danger .ms {
        color: var(--ej-error-600);
      }
      .cv-mh {
        padding: 10px 10px 4px;
        font-family: var(--ej-font-display);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ej-neutral-400);
      }
      .cv-msep {
        height: 1px;
        margin: 6px 4px;
        background: var(--ej-neutral-200);
      }

      /* ---------- Canevas ---------- */
      .cv-grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 16px;
      }
      .cv-w {
        grid-column: span 6;
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 16px 18px 18px;
        position: relative;
      }
      .cv-w.cv-S {
        grid-column: span 3;
      }
      .cv-w.cv-L {
        grid-column: span 12;
      }
      .cv-w-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }
      .cv-w-titles {
        min-width: 0;
      }
      .cv-w-title {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.35;
        color: var(--ej-primary-900);
        overflow-wrap: anywhere;
      }
      .cv-w-sub {
        margin-top: 1px;
        font-size: 12px;
        color: var(--ej-neutral-500);
      }
      .cv-note {
        margin-top: 8px;
        font-size: 11.5px;
        line-height: 1.4;
        color: var(--ej-neutral-500);
      }
      /* Intertitre du canevas */
      .cv-sec {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 10px 0 -4px;
      }
      .cv-sec-t {
        font-family: var(--ej-font-display);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ej-neutral-600);
        white-space: nowrap;
      }
      .cv-sec::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--ej-neutral-200);
      }
      .cv-sec .cv-edit {
        margin: 0;
        padding: 0;
        border: 0;
        order: 2;
      }
      .cv-i {
        flex-shrink: 0;
        width: 26px;
        height: 26px;
        margin: -3px -6px 0 0;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--ej-neutral-400);
        transition: background var(--ej-transition-fast), color var(--ej-transition-fast);
      }
      .cv-i:hover,
      .cv-i[aria-expanded="true"] {
        background: var(--ej-neutral-100);
        color: var(--ej-action-600);
      }
      .cv-i .ms {
        font-size: 16px;
      }
      .cv-na {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        align-self: flex-start;
        margin: -6px 0 10px;
        padding: 2px 8px;
        border: 1px dashed var(--ej-neutral-300);
        border-radius: var(--ej-radius-full);
        font-size: 11.5px;
        color: var(--ej-neutral-500);
      }
      .cv-na .ms {
        font-size: 12px;
      }
      .cv-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .cv-chart {
        min-width: 0;
      }
      .cv-fail {
        font-size: 13px;
        color: var(--ej-neutral-500);
      }

      /* Chiffre clé */
      .cv-kpi {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        margin: -4px -6px 0;
        padding: 4px 6px;
        border-radius: var(--ej-radius-md);
        text-align: left;
      }
      .cv-kpi:hover {
        background: var(--ej-primary-50);
      }
      .cv-kpi-val {
        font-family: var(--ej-font-display);
        font-size: 32px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: var(--ej-primary-900);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .cv-kpi-delta {
        font-size: 12.5px;
        color: var(--ej-neutral-500);
      }
      .cv-kpi-delta.up {
        color: var(--ej-success-600);
      }
      .cv-kpi-delta.down {
        color: var(--ej-neutral-600);
      }
      .cv-kpi-note {
        display: block;
        margin-top: 2px;
        font-size: 11.5px;
        color: var(--ej-neutral-500);
      }
      .cv-alert .cv-w-title::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        margin: 0 7px 1px 0;
        border-radius: 50%;
        background: var(--ej-attention-500);
      }
      .cv-spark {
        margin-top: auto;
        padding-top: 10px;
      }
      .cv-meter {
        margin-top: auto;
        padding-top: 14px;
      }

      /* Liste compacte et tableau */
      .cv-list {
        list-style: none;
        margin: 0 -18px;
      }
      .cv-li {
        display: grid;
        grid-template-columns: 84px minmax(0, 1fr) auto;
        align-items: center;
        gap: 4px 14px;
        padding: 9px 18px;
        border-top: 1px solid var(--ej-neutral-100);
        font-size: 13px;
      }
      .cv-list.nodate .cv-li {
        grid-template-columns: minmax(0, 1fr) auto;
      }
      .cv-li-date {
        font-variant-numeric: tabular-nums;
        color: var(--ej-neutral-600);
      }
      .cv-li-main {
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .cv-li-t {
        flex-shrink: 0;
        max-width: 46%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--ej-font-display);
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .cv-li-l {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ej-neutral-600);
      }
      .cv-li .btn {
        height: 30px;
        padding: 0 12px;
        font-size: 12px;
      }
      .cv-li.urgent .cv-li-t::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        margin: 0 7px 1px 0;
        border-radius: 50%;
        background: var(--ej-attention-500);
      }
      .cv-foot {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin: 0 -18px -18px;
        padding: 10px 18px 12px;
        border-top: 1px solid var(--ej-neutral-100);
      }
      .cv-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ej-action-600);
        border-radius: var(--ej-radius-sm);
      }
      .cv-link:hover {
        text-decoration: underline;
      }
      .cv-link .ms {
        font-size: 15px;
      }
      .cv-tablewrap {
        max-height: 300px;
        overflow: auto;
        margin: 0 -18px -18px;
        border-top: 1px solid var(--ej-neutral-100);
      }
      .cv-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .cv-table th,
      .cv-table td {
        padding: 8px 18px;
        text-align: right;
        border-bottom: 1px solid var(--ej-neutral-100);
        white-space: nowrap;
      }
      .cv-table th:first-child,
      .cv-table td:first-child {
        text-align: left;
      }
      .cv-table th {
        position: sticky;
        top: 0;
        background: var(--ej-neutral-50);
        font-family: var(--ej-font-display);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ej-neutral-500);
      }
      .cv-table td {
        font-variant-numeric: tabular-nums;
      }
      .cv-table td button {
        font-variant-numeric: tabular-nums;
        color: var(--ej-action-700);
        font-weight: 600;
        padding: 0 4px;
        border-radius: var(--ej-radius-sm);
      }
      .cv-table td button:hover {
        text-decoration: underline;
      }
      .cv-gauge {
        max-width: 280px;
        width: 100%;
        margin: 0 auto;
      }
      .cv-gauge-link {
        align-self: center;
        margin-top: 8px;
      }

      /* ---------- Mode Modifier ---------- */
      .cv-editing .cv-w {
        border-style: dashed;
        border-color: var(--ej-primary-300);
      }
      .cv-editing .cv-w[draggable="true"] {
        cursor: grab;
      }
      .cv-w.is-drag {
        opacity: 0.45;
      }
      .cv-w.is-over {
        box-shadow: 0 0 0 3px var(--ej-action-300);
      }
      .cv-edit {
        display: flex;
        align-items: center;
        gap: 2px;
        margin: -8px -10px 10px;
        padding: 0 4px 8px;
        border-bottom: 1px dashed var(--ej-neutral-200);
      }
      .cv-grip {
        display: inline-flex;
        color: var(--ej-neutral-400);
        margin-right: auto;
      }
      .cv-grip .ms {
        font-size: 18px;
      }
      .cv-tb {
        width: 28px;
        height: 28px;
        border-radius: var(--ej-radius-sm);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--ej-font-display);
        font-size: 11.5px;
        font-weight: 600;
        color: var(--ej-neutral-500);
      }
      .cv-tb:hover {
        background: var(--ej-neutral-100);
        color: var(--ej-neutral-900);
      }
      .cv-tb[aria-pressed="true"] {
        background: var(--ej-action-100);
        color: var(--ej-action-700);
      }
      .cv-tb[disabled] {
        opacity: 0.35;
        cursor: default;
        background: none;
      }
      .cv-tb .ms {
        font-size: 16px;
      }
      .cv-tsep {
        width: 1px;
        height: 18px;
        margin: 0 4px;
        background: var(--ej-neutral-200);
      }
      .cv-addtile {
        grid-column: span 12;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 72px;
        border: 1px dashed var(--ej-primary-300);
        border-radius: var(--ej-radius-lg);
        font-family: var(--ej-font-display);
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ej-action-600);
        background: transparent;
      }
      .cv-addtile:hover {
        background: var(--ej-action-50);
      }
      .cv-new {
        animation: cv-new 2.6s ease;
      }
      @keyframes cv-new {
        0%,
        70% {
          box-shadow: 0 0 0 3px var(--ej-logo-mint), var(--ej-shadow-md);
          border-color: var(--ej-accent-600);
        }
        100% {
          box-shadow: var(--ej-shadow-xs);
        }
      }

      /* ---------- Nouveau tableau ---------- */
      .cv-start {
        padding: 48px 0 24px;
        text-align: center;
      }
      .cv-start h2 {
        font-size: 18px;
        font-weight: 600;
        color: var(--ej-primary-900);
        margin-bottom: 20px;
      }
      .cv-start-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        max-width: 860px;
        margin: 0 auto;
      }
      .cv-start-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        padding: 20px;
        text-align: left;
      }
      .cv-start-card:hover {
        border-color: var(--ej-action-400);
        box-shadow: var(--ej-shadow-md);
      }
      .cv-start-card > .ms {
        font-size: 22px;
        color: var(--ej-action-600);
        margin-bottom: 6px;
      }
      .cv-start-card strong {
        font-family: var(--ej-font-display);
        font-size: 15px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .cv-start-card span:last-child {
        font-size: 13px;
        color: var(--ej-neutral-500);
      }
      .cv-models {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 20px;
      }

      /* ---------- Couches : tiroir, panneau IA, popover, catalogue ---------- */
      .cv-scrim {
        position: fixed;
        inset: 0;
        z-index: 89;
        background: color-mix(in srgb, var(--ej-neutral-900) 28%, transparent);
      }
      .cv-scrim[hidden],
      .cv-drawer[hidden],
      .cv-ai[hidden],
      .cv-pop[hidden],
      .cv-modal[hidden] {
        display: none;
      }
      .cv-drawer,
      .cv-ai {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 90;
        width: min(480px, 100vw);
        display: flex;
        flex-direction: column;
        background: var(--ej-white);
        border-left: 1px solid var(--ej-hairline);
        box-shadow: var(--ej-shadow-xl);
      }
      .cv-ai {
        z-index: 75;
        top: 56px;
        width: min(480px, 100vw);
        box-shadow: var(--ej-shadow-lg);
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto minmax(0, 1fr) auto auto auto;
        grid-template-areas: "head" "steps" "body" "jour" "form" "foot";
      }
      .cv-pane-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 20px 14px;
        border-bottom: 1px solid var(--ej-neutral-100);
      }
      .cv-pane-head h2 {
        font-size: 17px;
        font-weight: 600;
        line-height: 1.3;
        color: var(--ej-primary-900);
      }
      .cv-pane-head .overline {
        margin-bottom: 4px;
      }
      .cv-pane-body {
        flex: 1;
        overflow-y: auto;
        padding: 6px 20px 20px;
      }
      .cv-dr-count {
        margin-top: 4px;
        font-size: 13px;
        color: var(--ej-neutral-500);
      }
      .cv-dr-list {
        list-style: none;
      }
      .cv-dr-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--ej-neutral-100);
      }
      .cv-dr-main {
        flex: 1;
        min-width: 0;
      }
      .cv-dr-t {
        font-family: var(--ej-font-display);
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .cv-forme {
        margin-left: 6px;
        font-family: var(--ej-font-body);
        font-size: 11.5px;
        font-weight: 500;
        color: var(--ej-neutral-500);
      }
      .cv-dr-m {
        margin-top: 2px;
        font-size: 12.5px;
        color: var(--ej-neutral-600);
      }
      .cv-dr-b {
        margin-top: 6px;
      }
      .cv-dr-b .badge {
        height: 22px;
        font-size: 11px;
      }
      .cv-dr-row .btn {
        flex-shrink: 0;
      }
      .cv-pane-foot {
        padding: 12px 20px;
        border-top: 1px solid var(--ej-neutral-100);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 12px;
        color: var(--ej-neutral-500);
      }

      .cv-pop {
        position: absolute;
        z-index: 95;
        width: 320px;
        max-width: calc(100vw - 24px);
        padding: 16px;
        background: var(--ej-white);
        border: 1px solid var(--ej-neutral-200);
        border-radius: var(--ej-radius-lg);
        box-shadow: var(--ej-shadow-lg);
        font-size: 13px;
        line-height: 1.5;
        color: var(--ej-neutral-700);
      }
      .cv-pop h3 {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ej-primary-900);
        margin-bottom: 10px;
        padding-right: 24px;
      }
      .cv-pop dl {
        display: grid;
        gap: 8px;
      }
      .cv-pop dt {
        font-family: var(--ej-font-display);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ej-neutral-400);
      }
      .cv-pop dd {
        margin-top: 1px;
      }
      .cv-pop .cv-pop-x {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 28px;
        height: 28px;
      }
      .cv-pop .btn {
        margin-top: 14px;
      }

      .cv-modal {
        position: fixed;
        inset: 0;
        z-index: 92;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: color-mix(in srgb, var(--ej-neutral-900) 28%, transparent);
      }
      .cv-modal-box {
        width: min(980px, 100%);
        height: min(680px, 100%);
        display: flex;
        flex-direction: column;
        background: var(--ej-white);
        border-radius: var(--ej-radius-xl);
        box-shadow: var(--ej-shadow-xl);
        overflow: hidden;
      }
      .cv-cat {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
      }
      .cv-cat-list {
        border-right: 1px solid var(--ej-neutral-100);
        overflow-y: auto;
        padding: 14px 12px 20px;
      }
      .cv-cat-list .search {
        height: 38px;
        max-width: none;
        margin: 0 4px 8px;
      }
      .cv-cat-g {
        padding: 14px 8px 4px;
        font-family: var(--ej-font-display);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ej-neutral-400);
      }
      .cv-cat-it {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border-radius: var(--ej-radius-md);
        text-align: left;
        font-size: 13.5px;
        color: var(--ej-neutral-800);
      }
      .cv-cat-it .ms {
        font-size: 16px;
        color: var(--ej-neutral-400);
      }
      .cv-cat-it:hover {
        background: var(--ej-neutral-50);
      }
      .cv-cat-it[aria-selected="true"] {
        background: var(--ej-action-100);
        color: var(--ej-primary-900);
        font-weight: 600;
      }
      .cv-cat-it[aria-selected="true"] .ms {
        color: var(--ej-action-600);
      }
      .cv-cat-it .cv-on {
        margin-left: auto;
        font-size: 11px;
        font-weight: 500;
        color: var(--ej-neutral-400);
      }
      .cv-cat-prev {
        overflow-y: auto;
        padding: 24px 28px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .cv-cat-prev h3 {
        font-size: 18px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .cv-cat-card {
        padding: 16px 18px 18px;
      }
      .cv-cat-rule {
        font-size: 13px;
        color: var(--ej-neutral-600);
        line-height: 1.55;
      }
      .cv-cat-src {
        font-size: 12px;
        color: var(--ej-neutral-500);
      }
      .cv-cat-add {
        margin-top: auto;
        padding-top: 4px;
      }

      /* ---------- Panneau IA ---------- */
      .cv-steps {
        display: flex;
        align-items: center;
        list-style: none;
        padding: 10px 20px;
        border-bottom: 1px solid var(--ej-neutral-100);
        font-size: 12px;
        color: var(--ej-neutral-500);
      }
      .cv-steps li {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: default;
      }
      .cv-steps li + li::before {
        content: "";
        width: 18px;
        height: 1px;
        margin: 0 8px;
        background: var(--ej-neutral-300);
      }
      .cv-step-n {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ej-neutral-300);
        font-family: var(--ej-font-display);
        font-size: 10.5px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .cv-step-n .ms {
        font-size: 12px;
      }
      .cv-steps li.on {
        color: var(--ej-primary-900);
        font-weight: 600;
      }
      .cv-steps li.on .cv-step-n {
        border-color: var(--ej-primary-900);
        background: var(--ej-primary-900);
        color: var(--ej-white);
      }
      .cv-steps li.done {
        color: var(--ej-neutral-700);
      }
      .cv-steps li.done .cv-step-n {
        border-color: var(--ej-action-600);
        color: var(--ej-action-700);
      }
      .cv-ai-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .cv-sugg {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .cv-sugg-b {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid var(--ej-hairline);
        border-radius: var(--ej-radius-lg);
        text-align: left;
        font-size: 13px;
        color: var(--ej-neutral-800);
        background: var(--ej-white);
      }
      .cv-sugg-b:hover {
        border-color: var(--ej-action-400);
        background: var(--ej-action-50);
      }
      .cv-sugg-b .ms {
        font-size: 15px;
        color: var(--ej-action-600);
      }
      .cv-msg-u {
        align-self: flex-end;
        max-width: 88%;
        padding: 9px 13px;
        border-radius: 14px 14px 4px 14px;
        background: var(--ej-primary-900);
        color: var(--ej-white);
        font-size: 13.5px;
        overflow-wrap: anywhere;
      }
      .cv-msg-a {
        padding: 14px;
        border: 1px solid var(--ej-hairline);
        border-radius: var(--ej-radius-lg);
        background: var(--ej-white);
        box-shadow: var(--ej-shadow-xs);
        font-size: 13.5px;
        color: var(--ej-neutral-800);
      }
      .cv-msg-a h3 {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--ej-primary-900);
        margin-bottom: 8px;
      }
      .cv-msg-a h3 .ms {
        font-size: 15px;
        color: var(--ej-action-600);
      }
      .cv-plan {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .cv-plan li {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .cv-plan li > .ms {
        font-size: 15px;
        margin-top: 2px;
        color: var(--ej-accent-600);
      }
      .cv-plan .cv-pl-t {
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .cv-plan .cv-pl-m {
        font-size: 12px;
        color: var(--ej-neutral-500);
      }
      .cv-plan li.na > .ms {
        color: var(--ej-neutral-400);
      }
      .cv-msg-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      .cv-masked {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        margin-top: 10px;
        font-size: 11.5px;
        color: var(--ej-neutral-500);
        overflow-wrap: anywhere;
      }
      .cv-masked .ms {
        font-size: 13px;
        margin-top: 1px;
      }
      .cv-mask {
        background: var(--ej-neutral-100);
        color: var(--ej-neutral-700);
        border-radius: 4px;
        padding: 0 3px;
      }
      .cv-ans {
        font-family: var(--ej-font-display);
        font-size: 30px;
        font-weight: 600;
        line-height: 1.1;
        color: var(--ej-primary-900);
        font-variant-numeric: tabular-nums;
      }
      .cv-ans-t {
        margin-top: 4px;
        font-weight: 500;
      }
      .cv-ans-r {
        margin-top: 8px;
        font-size: 12.5px;
        color: var(--ej-neutral-600);
      }
      .cv-done {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ej-success-600);
      }
      .cv-thinking {
        font-size: 13px;
        color: var(--ej-neutral-500);
      }
      .cv-ai-form {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 12px 20px;
        border-top: 1px solid var(--ej-neutral-100);
      }
      .cv-ai-form textarea {
        flex: 1;
        min-height: 44px;
        max-height: 120px;
        resize: none;
        font-size: 14px;
      }
      .cv-ai-form .btn {
        width: 42px;
        padding: 0;
      }
      .cv-journal {
        padding: 0 20px 6px;
        font-size: 12.5px;
      }
      .cv-journal summary {
        cursor: pointer;
        padding: 8px 0;
        font-weight: 600;
        color: var(--ej-neutral-600);
        border-radius: var(--ej-radius-sm);
      }
      .cv-journal ol {
        list-style: none;
        max-height: 140px;
        overflow-y: auto;
      }
      .cv-journal li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        border-top: 1px solid var(--ej-neutral-100);
        color: var(--ej-neutral-700);
      }
      .cv-journal li.undone {
        color: var(--ej-neutral-400);
        text-decoration: line-through;
      }
      .cv-journal time {
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
        color: var(--ej-neutral-400);
      }
      .cv-journal li span {
        flex: 1;
        min-width: 0;
      }
      .cv-ai-foot {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        padding: 8px 20px 12px;
        font-size: 11.5px;
        color: var(--ej-neutral-500);
      }
      .cv-ai-foot .ms {
        font-size: 13px;
        margin-top: 1px;
        color: var(--ej-accent-600);
      }

      /* ---------- Assistant : en-tête, conversations, usages, fenêtre agrandie ---------- */
      .cv-ai-head {
        grid-area: head;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 10px 10px 14px;
        border-bottom: 1px solid var(--ej-neutral-100);
      }
      .cv-ai-head h2 {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .cv-ai-head h2 .ms {
        font-size: 17px;
        color: var(--ej-action-600);
      }
      .cv-ai-tools {
        display: flex;
        gap: 2px;
      }
      .cv-ai-head .icon-btn {
        width: 34px;
        height: 34px;
      }
      .cv-ai-head .icon-btn .ms {
        font-size: 17px;
      }
      .cv-ai-sidebtn[aria-expanded="true"] {
        background: var(--ej-neutral-100);
      }
      .cv-ai .cv-steps {
        grid-area: steps;
      }
      .cv-ai .cv-steps[hidden] {
        display: none;
      }
      .cv-ai .cv-ai-body {
        grid-area: body;
        position: relative;
        min-height: 0;
      }
      .cv-ai .cv-journal {
        grid-area: jour;
        border-top: 1px solid var(--ej-neutral-100);
      }
      .cv-ai .cv-ai-form {
        grid-area: form;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        padding: 10px 16px 6px;
      }
      .cv-ai .cv-ai-foot {
        grid-area: foot;
        padding: 2px 16px 10px;
      }
      .cv-ai-side {
        grid-area: side;
        display: none;
        flex-direction: column;
        min-height: 0;
        background: var(--ej-neutral-50);
        border-right: 1px solid var(--ej-neutral-100);
      }
      .cv-ai.show-side .cv-ai-side {
        display: flex;
        grid-row: 2 / -1;
        grid-column: 1 / -1;
        z-index: 3;
        border-right: 0;
      }
      .cv-side-h {
        padding: 14px 16px 8px;
        font-family: var(--ej-font-display);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ej-neutral-500);
      }
      .cv-newconv {
        margin: 0 12px 10px;
        justify-content: flex-start;
      }
      .cv-convs {
        list-style: none;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 8px 12px;
      }
      .cv-conv {
        display: block;
        width: 100%;
        text-align: left;
        padding: 8px 10px;
        border-radius: var(--ej-radius-md);
      }
      .cv-conv:hover {
        background: var(--ej-neutral-100);
      }
      .cv-conv[aria-current="true"] {
        background: var(--ej-white);
        box-shadow: var(--ej-shadow-xs);
      }
      .cv-conv-t {
        display: block;
        font-size: 13px;
        color: var(--ej-neutral-800);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cv-conv-d {
        display: block;
        margin-top: 1px;
        font-size: 11.5px;
        color: var(--ej-neutral-500);
      }
      .cv-modes {
        display: inline-flex;
        align-self: flex-start;
        gap: 2px;
        padding: 2px;
        border-radius: var(--ej-radius-full);
        background: var(--ej-neutral-100);
        max-width: 100%;
      }
      .cv-modes button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 12px;
        border-radius: var(--ej-radius-full);
        font-size: 12.5px;
        font-weight: 500;
        white-space: nowrap;
        color: var(--ej-neutral-600);
      }
      .cv-modes button .ms {
        font-size: 14px;
      }
      .cv-modes button:hover {
        color: var(--ej-primary-900);
      }
      .cv-modes button[aria-pressed="true"] {
        background: var(--ej-white);
        color: var(--ej-primary-900);
        box-shadow: var(--ej-shadow-xs);
      }
      .cv-ai-in {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 6px 6px 6px 12px;
        border: 1px solid var(--ej-neutral-200);
        border-radius: var(--ej-radius-lg);
        background: var(--ej-white);
        transition: border-color var(--ej-transition-fast);
      }
      .cv-ai-in:focus-within {
        border-color: var(--ej-action-400);
        box-shadow: 0 0 0 3px var(--ej-action-100);
      }
      .cv-ai .cv-ai-in textarea {
        flex: 1;
        min-height: 0;
        max-height: none;
        padding: 6px 0;
        border: 0;
        outline: 0;
        resize: none;
        background: transparent;
        font: inherit;
        font-size: 14px;
        line-height: 1.45;
        color: var(--ej-neutral-900);
        overflow-y: hidden;
      }
      .cv-ai .cv-ai-in .btn {
        width: 36px;
        height: 36px;
        padding: 0;
        flex-shrink: 0;
      }
      .cv-ai-scrim {
        position: fixed;
        inset: 0;
        z-index: 92;
        background: color-mix(in srgb, var(--ej-neutral-900) 32%, transparent);
      }
      .cv-ai-scrim[hidden] {
        display: none;
      }
      body.cv-ai-xl .cv-scrim {
        z-index: 94;
      }
      body.cv-ai-xl .cv-drawer {
        z-index: 95;
      }
      .cv-ai.is-xl {
        top: 50%;
        left: 50%;
        right: auto;
        bottom: auto;
        z-index: 93;
        width: min(1120px, 92vw);
        height: 86vh;
        transform: translate(-50%, -50%);
        border: 1px solid var(--ej-hairline);
        border-radius: var(--ej-radius-xl);
        box-shadow: var(--ej-shadow-xl);
        overflow: hidden;
        grid-template-columns: 264px minmax(0, 1fr);
        grid-template-rows: auto auto minmax(0, 1fr) auto auto;
        grid-template-areas: "head head" "side steps" "side body" "side form" "jour foot";
      }
      .cv-ai.is-xl .cv-ai-side {
        display: flex;
      }
      .cv-ai.is-xl .cv-ai-sidebtn {
        display: none;
      }
      .cv-ai.is-xl .cv-ai-head {
        padding-left: 20px;
      }
      .cv-ai.is-xl .cv-journal {
        background: var(--ej-neutral-50);
        border-right: 1px solid var(--ej-neutral-100);
        padding: 0 16px 8px;
      }
      .cv-ai.is-xl .cv-ai-body {
        padding: 22px max(32px, calc((100% - 820px) / 2));
        gap: 14px;
      }
      .cv-ai.is-xl .cv-ai-form,
      .cv-ai.is-xl .cv-ai-foot,
      .cv-ai.is-xl .cv-steps {
        padding-left: max(32px, calc((100% - 820px) / 2));
        padding-right: max(32px, calc((100% - 820px) / 2));
      }
      .cv-ai.is-xl .cv-msg-u {
        max-width: 70%;
      }
      .cv-ai.is-xl .cv-empty {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      /* ---------- Fil : suggestions, bascule d'usage ---------- */
      .cv-empty {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .cv-sg-h {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ej-neutral-600);
      }
      .cv-sg-h .ms {
        font-size: 15px;
        color: var(--ej-action-600);
      }
      .cv-sw {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        color: var(--ej-neutral-600);
      }
      .cv-sw .ms {
        font-size: 14px;
        color: var(--ej-action-600);
      }

      .cv-msg-a > .cv-sent:first-child {
        margin: 0 0 10px;
      }
      /* Résultats en cartes (moins de 600 px) */
      .cv-rcards,
      .cv-rsort {
        display: none;
      }
      .cv-rcards {
        list-style: none;
        margin-top: 10px;
        gap: 8px;
      }
      .cv-rcard {
        padding: 10px 12px;
        border: 1px solid var(--ej-neutral-100);
        border-radius: var(--ej-radius-md);
        font-size: 13px;
      }
      .cv-rcard > a {
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .cv-rcard dl {
        margin-top: 6px;
        display: grid;
        gap: 4px;
      }
      .cv-rcard dl > div {
        display: grid;
        grid-template-columns: minmax(96px, 38%) minmax(0, 1fr);
        gap: 8px;
      }
      .cv-rcard dt {
        color: var(--ej-neutral-500);
        font-size: 12px;
      }
      .cv-rcard dd {
        color: var(--ej-neutral-800);
        overflow-wrap: anywhere;
      }
      .cv-rsort {
        margin-top: 10px;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--ej-neutral-600);
      }
      .cv-rsort select {
        width: auto;
        min-width: 170px;
        min-height: 36px;
        padding: 4px 32px 4px 10px;
        font-size: 13px;
      }
      @media (max-width: 599px) {
        .cv-dpj .cv-rt-wrap {
          display: none;
        }
        .cv-dpj .cv-rcards {
          display: grid;
        }
        .cv-dpj .cv-rsort {
          display: flex;
        }
      }

      /* ---------- Réponse du DPJ ---------- */
      .cv-dpj .cv-sent {
        margin: 0 0 10px;
      }
      .cv-dpj > p {
        margin-bottom: 4px;
      }
      .cv-q {
        margin-bottom: 4px;
      }
      .cv-q-h {
        margin-bottom: 6px;
        font-family: var(--ej-font-display);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ej-neutral-500);
      }
      .cv-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .cv-chip {
        display: inline-flex;
        align-items: center;
        max-width: 100%;
        border: 1px solid var(--ej-action-200);
        border-radius: var(--ej-radius-full);
        background: var(--ej-action-50);
        font-size: 12.5px;
        color: var(--ej-primary-900);
      }
      .cv-chip.is-on {
        border-color: var(--ej-action-500);
        box-shadow: 0 0 0 2px var(--ej-action-100);
      }
      .cv-chip.is-all {
        border-color: var(--ej-neutral-200);
        background: var(--ej-neutral-50);
      }
      .cv-chip.is-neg {
        border-style: dashed;
        border-color: var(--ej-neutral-400);
        background: var(--ej-white);
      }
      .cv-chip.is-neg .cv-chip-k {
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .cv-chip-b {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px;
        min-width: 0;
        padding: 4px 4px 4px 10px;
        border-radius: var(--ej-radius-full);
        text-align: left;
      }
      .cv-chip.is-all .cv-chip-b {
        padding-right: 10px;
      }
      .cv-chip-k {
        color: var(--ej-neutral-600);
      }
      .cv-chip-o {
        color: var(--ej-neutral-500);
      }
      .cv-chip-v {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .cv-chip-x {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        margin-right: 2px;
        display: inline-flex;

        .cv-li {

        .cv-li-date {
          grid-column: 1 / -1;
          font-size: 12px;
        }
        .cv-li-main {

          align-items: stretch;

        .cv-start-grid {

        .cv-cat-add {
          position: sticky;

          border-top: 1px solid var(--ej-neutral-100);
        }
        .cv-cat-add .btn {
          width: 100%;

        .cv-modal {
          padding: 0;

        .cv-modal-box {

        .cv-ai {

        /* ---------- Construire, journal, annulation ----------

            return;
          }
          if ((x = t.closest("[data-cat]"))) return selectCat(x.getAttribute("data-cat"), true);
          if ((x = t.closest("[data-addind]"))) return addFromCatalogue(x.getAttribute("data-addind"));
          if ((x = t.closest("[data-sugg]"))) return ask(x.getAttribute("data-sugg"), { mode: x.getAttribute("data-sugg-mode") || null });
          if ((x = t.closest("[data-aiact]"))) {
            var aa = x.getAttribute("data-aiact");
            if (aa === "xl") return setXL(!XL);
            if (aa === "new") return newConversation();
            if (aa === "side") return toggleSide();
            return;
          }
          if ((x = t.closest("[data-conv]"))) return switchConv(x.getAttribute("data-conv"));
          if ((x = t.closest("#cv-ai [data-mode]"))) {
            setMode(x.getAttribute("data-mode"));
            saveConvs();
            $("cv-ai-input").focus();
            return;
          }
          if (t === $("cv-ai-scrim")) return closeAI();
          if ((x = t.closest("[data-reask]"))) {
            var sw = findMsg(x.getAttribute("data-reask"));
            if (!sw || sw.done) return;
            sw.done = true;
            updMsg(sw);
            return ask(sw.raw, { mode: sw.to === "dpj" ? "compose" : "dpj" });
          }
          if ((x = t.closest("[data-chip]"))) {
            var ck = x.getAttribute("data-chip").split("|");
            var cm = findMsg(ck[0]);
            if (!cm) return;
            editing = editing && editing.mid === ck[0] && editing.i === +ck[1] ? null : { mid: ck[0], i: +ck[1] };
            updMsg(cm);
            var ed = $("cv-ai-body").querySelector('[data-ed="' + ck[0] + "|" + ck[1] + '"] [data-ed-v]');
            if (ed && !ed.closest("[hidden]")) ed.focus();
            else if (ed) $("cv-ai-body").querySelector('[data-ed="' + ck[0] + "|" + ck[1] + '"] [data-ed-op]').focus();
            else focusChip(cm, +ck[1]);
            return;
          }
          if ((x = t.closest("[data-chip-x]"))) {
            var xk = x.getAttribute("data-chip-x").split("|");
            return removeChip(findMsg(xk[0]), +xk[1]);
          }
          if ((x = t.closest("[data-ed-ok]"))) return applyEd(x.closest("[data-ed]"));
          if ((x = t.closest("[data-ed-del]"))) {
            var dk = x.closest("[data-ed]").getAttribute("data-ed").split("|");
            return removeChip(findMsg(dk[0]), +dk[1]);
          }
          if ((x = t.closest("[data-ed-cancel]"))) {
            var ek = x.closest("[data-ed]").getAttribute("data-ed").split("|");
            var em = findMsg(ek[0]);
            editing = null;
            if (em) {
              updMsg(em);
              focusChip(em, +ek[1]);
            }
            return;
          }
          if ((x = t.closest("[data-sort]"))) {
            var sk = x.getAttribute("data-sort").split("|");
            var sm = findMsg(sk[0]);
            if (!sm) return;
            var sf = DX.FIELD[sk[1]];
            var cs = sm.q.sort || {};
            sm.q.sort = { field: sk[1], dir: cs.field === sk[1] ? (cs.dir === "asc" ? "desc" : "asc") : sf && (sf.type === "nombre" || sf.type === "pourcentage") ? "desc" : "asc" };
            updMsg(sm);
            var sb2 = $("cv-ai-body").querySelector('[data-sort="' + sk[0] + "|" + sk[1] + '"]');
            if (sb2) sb2.focus();
            return;
          }
          if ((x = t.closest("[data-more]"))) {
            var mm2 = findMsg(x.getAttribute("data-more"));
            if (!mm2) return;
            mm2.all = !mm2.all;
            updMsg(mm2);
            var mb = $("cv-ai-body").querySelector('[data-more="' + mm2.id + '"]');
            if (mb) mb.focus();
            return;
          }
          if ((x = t.closest("[data-csv]"))) return exportCsv(findMsg(x.getAttribute("data-csv")));
          if ((x = t.closest("[data-dpin]"))) {
            var pk = x.getAttribute("data-dpin").split("|");
            return dpjPin(findMsg(pk[0]), pk[1]);
          }
          if ((x = t.closest("[data-refine]"))) {
            setMode("dpj");
            $("cv-ai-input").value = "Parmi elles, ";
            autosize();
            $("cv-ai-input").focus();
            return;
          }
          if ((x = t.closest("[data-reform]"))) {
            var rm = findMsg(x.getAttribute("data-reform"));
            setMode("dpj");
            $("cv-ai-input").value = rm ? rm.raw : "";
            autosize();
            $("cv-ai-input").focus();
            return;
          }
          if ((x = t.closest("[data-nounk]"))) {
            var um = findMsg(x.getAttribute("data-nounk"));
            if (!um || um.unk.some(function (u) { return u.neg; })) return;
            um.stripped = um.unk.map(function (u) { return u.text.indexOf("«") !== -1 ? u.text : "« " + u.text + " »"; });
            um.unk = [];
            updMsg(um);
            return;
          }
          if ((x = t.closest("[data-excl]"))) {
            var xk2 = x.getAttribute("data-excl").split("|");
            var xm = findMsg(xk2[0]);
            if (xm) listExcl(xm, xk2[1]);
            return;
          }
          if ((x = t.closest("[data-build]"))) return build(x.getAttribute("data-build"));
          if ((x = t.closest("[data-drop]"))) {
            var pl = PLANS[x.getAttribute("data-drop")];
            if (pl) pl.done = true;
            var bx = x.parentNode;
            bx.innerHTML = '<span class="small muted">Plan abandonné.</span>';
            convMapH(function (h) { return h.replace(new RegExp('<div class="cv-msg-actions" data-plan-box="' + x.getAttribute("data-drop") + '">[\\s\\S]*?</div>'), '<div class="cv-msg-actions"><span class="small muted">Plan abandonné.</span></div>'); });
            setSteps(null);
            $("cv-ai-input").focus();
            return;
          }
          if ((x = t.closest("[data-pin]"))) return pin(x.getAttribute("data-pin"), x);
          if ((x = t.closest("[data-qlist]"))) {
            var q = PLANS[x.getAttribute("data-qlist")];
            if (q) openDrawer(q.title, q.title, q.rows(), IND[q.I]);
            return;
          }
          if ((x = t.closest("[data-unfiltered]"))) {
            var qq = PLANS[x.getAttribute("data-unfiltered")];
            if (!qq || qq.done) return;
            qq.done = true;
            x.disabled = true;
            answerCompute(qq.raw, qq.t, IND[qq.I], qq.mo, qq.f, qq.na);
            return;
          }
          if ((x = t.closest("[data-need]"))) {
            logJ("Demande hors catalogue transmise à EJ : " + x.getAttribute("data-need"), null);
            x.disabled = true;
            x.innerHTML = ms("check") + "Besoin transmis";
            return;
          }
          if ((x = t.closest("[data-undo]"))) return undoJ(+x.getAttribute("data-undo"));
          if (t.closest("[data-toast-undo]")) {
            var tt2 = $("cv-toast");
            var fn = tt2._undo;
            tt2.hidden = true;
            if (fn) fn();
            return;
          }
        }
        function onKey(e) {
          if (e.key === "Escape") {
            if (!$("cv-cat").hidden) return closeCatalogue();
            if (!$("cv-pop").hidden) return closePop(true);
            if (document.querySelector(".cv-menu:not([hidden])")) return closeDds(null, true);
            if (!$("cv-drawer").hidden) return closeDrawer();
            if (editing && !$("cv-ai").hidden) {
              var em2 = findMsg(editing.mid);
              var ei = editing.i;
              editing = null;
              if (em2) {
                updMsg(em2);
                focusChip(em2, ei);
              }
              return;
            }
            if (!$("cv-ai").hidden && $("cv-ai").classList.contains("show-side") && !XL) return toggleSide();
            if (!$("cv-ai").hidden) return closeAI();
            return;
          }
          if (e.key === "Enter" && e.target.matches && e.target.matches("[data-ed-v], [data-ed-v2]")) {
            e.preventDefault();
            return applyEd(e.target.closest("[data-ed]"));
          }
          var menu = e.target.closest && e.target.closest(".cv-menu");
          if (menu && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
            e.preventDefault();
            var items = Array.prototype.slice.call(menu.querySelectorAll("button"));
            var i = items.indexOf(e.target);
            var n = items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length];
            if (n) n.focus();
          }
          if (e.target.closest && e.target.closest("#cv-cat-items") && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
            e.preventDefault();
            var its = Array.prototype.slice.call(document.querySelectorAll(".cv-cat-it"));
            var j = its.indexOf(e.target);
            var nx = its[Math.max(0, Math.min(its.length - 1, j + (e.key === "ArrowDown" ? 1 : -1)))];
            if (nx) selectCat(nx.getAttribute("data-cat"), true);
          }
          if (e.key === "Tab" && !$("cv-cat").hidden) trap(e, $("cv-cat"));
          else if (e.key === "Tab" && !$("cv-drawer").hidden) trap(e, $("cv-drawer"));
          else if (e.key === "Tab" && !$("cv-ai").hidden && $("cv-ai").getAttribute("aria-modal") === "true") trap(e, $("cv-ai"));
        }
        function trap(e, box) {
          var f = Array.prototype.slice.call(box.querySelectorAll("button:not([disabled]), a[href], input, select, textarea, [tabindex]:not([tabindex='-1'])")).filter(function (x) { return x.offsetParent !== null; });
          if (!f.length) return;
          if (e.shiftKey && document.activeElement === f[0]) {
            e.preventDefault();
            f[f.length - 1].focus();
          } else if (!e.shiftKey && document.activeElement === f[f.length - 1]) {
            e.preventDefault();
            f[0].focus();
          }
        }

        function init() {
          var p = document.body.getAttribute("data-profil");
          PROFIL = p === "cac" || p === "mixte" ? p : "ec";
          load();
          loadConvs();
          renderAll();
          renderJournal();
          syncModeUI();
          document.addEventListener("click", onClick);
          document.addEventListener("keydown", onKey);
          $("cv-ai-form").addEventListener("submit", function (e) {
            e.preventDefault();
            var v = $("cv-ai-input").value;
            $("cv-ai-input").value = "";
            autosize();
            ask(v);
          });
          $("cv-ai-input").addEventListener("input", autosize);
          $("cv-ask").addEventListener("submit", function (e) {
            e.preventDefault();
            var inp = $("cv-ask-input");
            var v = inp.value.trim();
            inp.value = "";
            openAI(null, inp);
            if (v) ask(v);
          });
          $("cv-ai-input").addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              $("cv-ai-form").requestSubmit();
            }
          });
          $("cv-cat-q").addEventListener("input", renderCatItems);
          window.addEventListener("resize", syncAIMode);
          document.addEventListener("change", function (e) {
            if (e.target.id === "cv-rename") cur().title = e.target.value.trim().slice(0, 60) || "Nouveau tableau";
            if (e.target.matches("[data-rsort]")) {
              var rm2 = findMsg(e.target.getAttribute("data-rsort"));
              var rf = DX.FIELD[e.target.value];
              if (rm2 && rf) {
                rm2.q.sort = { field: e.target.value, dir: rf.type === "nombre" || rf.type === "pourcentage" ? "desc" : "asc" };
                updMsg(rm2);
                var rs2 = $("cv-ai-body").querySelector('[data-rsort="' + rm2.id + '"]');
                if (rs2) rs2.focus();
              }
            }
            if (e.target.matches("[data-ed-op]")) {
              var box = e.target.closest("[data-ed]");
              var op = e.target.value;
              box.querySelector("[data-ed-l1]").hidden = op === "est_vide" || op === "non_vide";
              box.querySelector("[data-ed-l2]").hidden = op !== "entre";
            }
          });
          var grid = $("cv-grid");
          grid.addEventListener("dragstart", function (e) {
            var c = e.target.closest && e.target.closest(".cv-w");
            if (!ST.edit || !c) return;
            dragU = c.getAttribute("data-uid");
            e.dataTransfer.effectAllowed = "move";
            try {
              e.dataTransfer.setData("text/plain", dragU);
            } catch (err) {}
            c.classList.add("is-drag");
          });
          grid.addEventListener("dragover", function (e) {
            if (!dragU) return;
            var c = e.target.closest(".cv-w");
            if (!c || c.getAttribute("data-uid") === dragU) return;
            e.preventDefault();
            document.querySelectorAll(".cv-w.is-over").forEach(function (x) { if (x !== c) x.classList.remove("is-over"); });
            c.classList.add("is-over");
          });
          grid.addEventListener("drop", function (e) {
            if (!dragU) return;
            var c = e.target.closest(".cv-w");
            e.preventDefault();
            if (c && c.getAttribute("data-uid") !== dragU) moveW(dragU, idxW(c.getAttribute("data-uid")));
            var u = dragU;
            dragU = null;
            renderGrid();
            highlight([u]);
          });
          grid.addEventListener("dragend", function () {
            dragU = null;
            document.querySelectorAll(".cv-w.is-drag, .cv-w.is-over").forEach(function (x) { x.classList.remove("is-drag", "is-over"); });
          });
        }
        document.addEventListener("DOMContentLoaded", init);
      })();
    </script>
