<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mission ponctuelle CAC · Missions et conformité · Express Juridique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/ej-app.css?v=20" />
    <link rel="stylesheet" href="assets/ej-missions.css?v=24" />
    <style>
      /* ---- En-tête entité (repris de cac-mandat.html) ---- */
      .soc-head {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 22px 24px 22px 64px;
        margin-bottom: 16px;
      }
      .soc-motif {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 40px;
        overflow: hidden;
        border-radius: calc(var(--ej-radius-lg) - 1px) 0 0 calc(var(--ej-radius-lg) - 1px);
      }
      .soc-motif i {
        position: absolute;
        left: 0;
        height: 8px;
        border-radius: 0 var(--ej-radius-full) var(--ej-radius-full) 0;
      }
      .soc-motif .m1 {
        top: 24px;
        width: 40px;
        background: var(--ej-logo-mint);
      }
      .soc-motif .m2 {
        top: 38px;
        width: 24px;
        background: var(--ej-action-600);
      }
      .soc-head > div:nth-child(2) {
        min-width: 0;
      }
      .soc-name {
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
        font-weight: 700;
        color: var(--ej-primary-900);
        word-break: break-word;
      }
      .soc-form {
        margin-top: 2px;
        font-size: 14px;
        color: var(--ej-neutral-500);
      }
      .soc-op {
        margin-top: 8px;
        font-size: 14.5px;
        font-weight: 500;
        color: var(--ej-neutral-800);
      }
      .soc-greffe {
        margin-top: 2px;
        font-size: 14px;
        color: var(--ej-neutral-600);
      }
      .soc-greffe strong {
        font-weight: 700;
        color: var(--ej-primary-900);
      }
      .soc-ids {
        flex-shrink: 0;
      }

      /* ---- Bandeau d'état : documents de la mission ---- */
      .band {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px 20px;
        padding: 14px 20px;
        margin-bottom: 16px;
      }
      .band-docs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        font-size: 13.5px;
        color: var(--ej-neutral-700);
      }
      .band-docs > span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .band-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      /* ---- Bloc « À faire » (repris de lab-dossier.html) ---- */
      .afaire {
        margin-bottom: 16px;
        outline: none;
      }
      .afaire:focus-visible {
        box-shadow: 0 0 0 2px var(--ej-action-600);
      }
      .afaire-head {
        padding: 14px 20px 4px;
      }
      .afaire-head h2 {
        font-size: 15px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .afaire-list {
        list-style: none;
        padding: 0 20px 6px;
      }
      .afaire-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px 0;
      }
      .afaire-ico {
        flex-shrink: 0;
        margin-top: 1px;
        font-size: 18px;
        color: var(--ej-info-600);
      }
      .afaire-item.warn .afaire-ico {
        color: var(--ej-warning-600);
      }
      .afaire-txt {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--ej-neutral-700);
      }
      .afaire-txt strong {
        font-weight: 600;
        color: var(--ej-neutral-900);
      }
      .afaire-act {
        flex-shrink: 0;
      }
      .afaire-btns {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      .afaire-btns .btn {
        white-space: nowrap;
      }
      .afaire-ech {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 10px;
        margin-top: 8px;
        font-size: 13px;
        color: var(--ej-neutral-600);
      }
      .afaire.afaire-ok {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 20px;
      }
      .badge.badge-ech {
        color: var(--ej-warning-600);
        border-color: var(--ej-warning-600);
      }
      .afaire-ok .afaire-ico {
        color: var(--ej-success-600);
      }

      /* ---- Cartes ---- */
      #retour {
        margin-bottom: 16px;
      }
      #retour:empty {
        display: none;
      }
      #absent {
        margin-top: 8px;
      }
      .vide {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 22px;
        border: 1px dashed var(--ej-neutral-300);
        border-radius: var(--ej-radius-lg);
        background: var(--ej-neutral-50);
      }
      .vide strong {
        font-family: var(--ej-font-display);
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .vide p {
        font-size: 14px;
        color: var(--ej-neutral-600);
      }
      .d-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .d-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        align-items: start;
      }
      .d-card {
        min-width: 0;
      }
      .d-card .block-head {
        padding-bottom: 14px;
        border-bottom: 1px solid var(--ej-neutral-100);
        align-items: center;
      }
      .d-card .block-head h2 {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .d-card .block-head h2 .ms {
        font-size: 20px;
        color: var(--ej-action-600);
      }
      .d-body {
        padding: 18px 22px 20px;
      }
      .d-grid .kv {
        grid-template-columns: 150px minmax(0, 1fr);
      }
      .kv dd {
        min-width: 0;
        word-break: break-word;
      }
      .val-sub {
        display: block;
        margin-top: 2px;
        font-size: 12.5px;
        font-weight: 400;
        color: var(--ej-neutral-500);
      }
      .val-act {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }
      .puce-l {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
      }
      .ej-puce {
        display: inline-flex;
        align-items: flex-start;
        gap: 6px;
        min-width: 0;
        padding: 4px 10px;
        border-radius: var(--ej-radius-lg);
        background: var(--ej-action-100);
        color: var(--ej-action-700);
        font-size: 12.5px;
        font-weight: 500;
      }
      .ej-puce .ms {
        flex-shrink: 0;
        margin-top: 2px;
        font-size: 14px;
      }
      .oui-non {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 500;
      }
      .oui-non .ms {
        flex-shrink: 0;
        font-size: 16px;
      }
      .oui-non.ok {
        color: var(--ej-success-600);
      }
      .oui-non.warn {
        color: var(--ej-warning-600);
      }
      .lien-lab {
        display: inline-block;
        margin-top: 4px;
        font-size: 13px;
        font-weight: 600;
        color: var(--ej-action-700);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      /* Listes pièces et documents */
      .rows {
        list-style: none;
      }
      .rows li {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 12px;
        padding: 11px 0;
        border-top: 1px solid var(--ej-neutral-100);
      }
      .rows li:first-child {
        padding-top: 0;
        border-top: none;
      }
      .rows li:last-child {
        padding-bottom: 0;
      }
      .r-ico {
        flex-shrink: 0;
        font-size: 18px;
        color: var(--ej-neutral-500);
      }
      .r-ico.ok {
        color: var(--ej-success-600);
      }
      .r-ico.ej {
        color: var(--ej-action-600);
      }
      .r-lib {
        flex: 1 1 220px;
        min-width: 0;
        font-size: 14px;
        color: var(--ej-neutral-900);
      }
      .r-lib strong {
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .r-lib .val-sub {
        margin-top: 1px;
      }
      .r-act .btn {
        white-space: nowrap;
      }
      .compte {
        font-weight: 600;
        color: var(--ej-neutral-700);
      }

      /* Journal */
      .journal {
        list-style: none;
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .journal::before {
        content: "";
        position: absolute;
        left: 15px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: var(--ej-neutral-200);
      }
      .journal li {
        position: relative;
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }
      .journal li[hidden] {
        display: none;
      }
      .journal li > div {
        min-width: 0;
      }
      .j-ico {
        position: relative;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--ej-white);
        border: 1px solid var(--ej-hairline);
        color: var(--ej-action-600);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .j-ico .ms {
        font-size: 16px;
      }
      .j-date {
        font-size: 12.5px;
        font-style: italic;
        color: var(--ej-action-600);
      }
      .j-txt {
        font-size: 14px;
        color: var(--ej-neutral-900);
        word-break: break-word;
      }
      .j-who {
        font-size: 12.5px;
        color: var(--ej-neutral-500);
      }
      .j-plus {
        margin-top: 16px;
      }

      /* ---- Aperçu d'un document (fenêtre) ---- */
      body.apercu-ouvert {
        overflow: hidden;
      }
      .apercu {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: color-mix(in srgb, var(--ej-primary-900) 32%, transparent);
      }
      .apercu[hidden] {
        display: none;
      }
      .apercu-box {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 760px;
        max-height: calc(100vh - 48px);
        background: var(--ej-white);
        border-radius: var(--ej-radius-xl);
        box-shadow: var(--ej-shadow-xl);
        overflow: hidden;
      }
      .apercu-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 22px 14px;
        border-bottom: 1px solid var(--ej-hairline);
      }
      .apercu-head h2 {
        font-size: 18px;
        font-weight: 600;
        color: var(--ej-primary-900);
        outline: none;
      }
      .apercu-head h2:focus-visible {
        outline: 2px solid var(--ej-action-600);
        outline-offset: 3px;
        border-radius: var(--ej-radius-sm);
      }
      .apercu-head p {
        margin-top: 2px;
        font-size: 13px;
        color: var(--ej-neutral-500);
      }
      .apercu-desk {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 18px;
        background: var(--ej-neutral-100);
      }
      .apercu-sheet {
        max-width: 640px;
        margin: 0 auto;
        padding: 28px 26px 26px;
        background: var(--ej-white);
        border: 1px solid var(--ej-neutral-200);
        border-radius: var(--ej-radius-sm);
        box-shadow: var(--ej-shadow-md);
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--ej-neutral-800);
      }
      .apercu-sheet + .apercu-sheet {
        margin-top: 18px;
      }
      .sh-top {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--ej-primary-900);
      }
      .sh-cab {
        font-family: var(--ej-font-display);
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ej-primary-900);
      }
      .sh-mut {
        color: var(--ej-neutral-500);
      }
      .sh-meta {
        text-align: right;
        color: var(--ej-neutral-600);
        font-variant-numeric: tabular-nums;
      }
      .sh-title {
        margin-top: 18px;
        font-family: var(--ej-font-display);
        font-size: 16px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .apercu-sheet h4 {
        margin-top: 14px;
        font-family: var(--ej-font-display);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .apercu-sheet p {
        margin-top: 6px;
      }
      .apercu-sheet ul {
        margin: 4px 0 0 18px;
      }
      .sh-kv {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: 4px 12px;
        margin-top: 10px;
      }
      .sh-kv dt {
        color: var(--ej-neutral-500);
      }
      .sh-kv dd {
        min-width: 0;
        color: var(--ej-neutral-900);
      }
      .sh-note {
        display: inline-block;
        margin-top: 10px;
        padding: 2px 8px;
        border-radius: var(--ej-radius-full);
        background: var(--ej-neutral-100);
        color: var(--ej-neutral-700);
        font-size: 12px;
        font-weight: 500;
      }
      .hon-field {
        margin-top: 8px;
      }
      .hon-field label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ej-neutral-700);
      }
      .hon-field input {
        width: 100%;
        max-width: 200px;
        height: 36px;
        margin-top: 4px;
        padding: 0 10px;
        border: 1px solid var(--ej-neutral-400);
        border-radius: var(--ej-radius-md);
        font: inherit;
        font-size: 14px;
        color: var(--ej-neutral-900);
      }
      .hon-field input:focus-visible {
        outline: 2px solid var(--ej-action-600);
        outline-offset: 1px;
      }
      .hon-field input[aria-invalid="true"] {
        border-color: var(--ej-error-600);
      }
      .concl-field label {
        display: block;
        margin-top: 6px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ej-neutral-700);
      }
      .concl-field textarea {
        display: block;
        width: 100%;
        min-height: 110px;
        margin-top: 4px;
        padding: 10px 12px;
        border: 1px solid var(--ej-neutral-400);
        border-radius: var(--ej-radius-md);
        font: inherit;
        font-size: 13.5px;
        color: var(--ej-neutral-900);
        resize: vertical;
      }
      .concl-field textarea:focus-visible {
        outline: 2px solid var(--ej-action-600);
        outline-offset: 1px;
      }
      .concl-field textarea[aria-invalid="true"] {
        border-color: var(--ej-error-600);
      }
      .concl-err {
        margin-top: 4px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ej-error-600);
      }
      .concl-print {
        display: none;
        white-space: pre-wrap;
      }
      .concl-texte {
        white-space: pre-wrap;
      }
      .sh-sign {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 18px;
      }
      .sh-sign > div {
        padding-top: 8px;
        border-top: 1px solid var(--ej-neutral-300);
        color: var(--ej-neutral-600);
      }
      .sh-sign strong {
        display: block;
        font-weight: 600;
        color: var(--ej-neutral-900);
      }
      .apercu-msg:empty {
        display: none;
      }
      .apercu-msg {
        padding: 10px 22px 0;
        font-size: 13px;
        font-weight: 500;
        color: var(--ej-success-600);
      }
      .apercu-foot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 10px;
        padding: 14px 22px 18px;
        border-top: 1px solid var(--ej-hairline);
      }

      @media (max-width: 1180px) {
        .d-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 760px) {
        .soc-head {
          flex-direction: column;
          align-items: flex-start;
          padding: 20px 16px 18px 44px;
          gap: 14px;
        }
        .soc-motif {
          width: 24px;
        }
        .soc-motif .m1 {
          width: 24px;
        }
        .soc-motif .m2 {
          width: 14px;
        }
        .soc-name {
          font-size: 21px;
        }
        .band {
          padding: 14px 16px;
        }
        .band-btns,
        .band-btns .btn {
          width: 100%;
          justify-content: center;
        }
        .frise-etapes {
          padding: 16px;
        }
        .afaire-list {
          padding: 0 16px 6px;
        }
        .afaire-item {
          flex-wrap: wrap;
        }
        .afaire-txt {
          flex-basis: calc(100% - 30px);
        }
        .afaire-act {
          width: 100%;
          padding-left: 30px;
        }
        .afaire-btns {
          align-items: stretch;
        }
        .afaire-btns .btn {
          width: 100%;
          justify-content: center;
          white-space: normal;
          text-align: center;
        }
        .afaire-head {
          padding: 14px 16px 4px;
        }
        .afaire.afaire-ok {
          padding: 14px 16px;
        }
        .d-body {
          padding: 16px 16px 18px;
        }
        .d-card .block-head {
          padding: 16px 16px 12px;
          flex-wrap: wrap;
          align-items: flex-start;
        }
        .rows li .badge {
          margin-left: 30px;
        }
        .r-act {
          width: 100%;
          padding-left: 30px;
        }
        .r-act .btn {
          width: 100%;
          justify-content: center;
          white-space: normal;
        }
        .apercu {
          align-items: flex-end;
          padding: 0;
        }
        .apercu-box {
          max-width: none;
          max-height: 94vh;
          border-radius: var(--ej-radius-xl) var(--ej-radius-xl) 0 0;
        }
        .apercu-desk {
          padding: 10px;
        }
        .apercu-sheet {
          padding: 20px 16px 18px;
        }
        .sh-meta {
          text-align: left;
        }
        .sh-kv,
        .sh-sign {
          grid-template-columns: 1fr;
        }
        .apercu-foot .btn {
          flex: 1 1 100%;
          justify-content: center;
        }
      }

      /* Impression : seul le document de l'aperçu */
      @media print {
        body.apercu-ouvert {
          overflow: visible;
          background: none;
        }
        body.apercu-ouvert > *:not(.apercu) {
          display: none !important;
        }
        body.apercu-ouvert .apercu {
          position: static;
          display: block;
          padding: 0;
          background: none;
        }
        .apercu-box {
          display: block;
          max-width: none;
          max-height: none;
          overflow: visible;
          box-shadow: none;
          border-radius: 0;
        }
        .apercu-head,
        .apercu-msg,
        .apercu-foot,
        .concl-field {
          display: none !important;
        }
        .apercu-desk {
          overflow: visible;
          padding: 0;
          background: none;
        }
        .apercu-sheet {
          max-width: none;
          border: none;
          box-shadow: none;
          padding: 0;
          break-after: page;
        }
        .apercu-sheet:last-child {
          break-after: auto;
        }
        .concl-print {
          display: block;
        }
      }
    </style>
  </head>
  <body class="m-resp" data-active="cac">
    <div id="ej-header"></div>
    <div class="app">
      <div id="ej-sidebar"></div>
      <div class="main">
        <div class="page">
          <a class="back-link" href="cac.html?vue=ponctuelles"><span class="ms">chevron_left</span>Missions CAC</a>

          <div class="card d-card" id="absent" hidden>
            <div class="d-body">
              <div class="vide">
                <strong>Mission introuvable</strong>
                <p>Aucune mission ponctuelle ne correspond à l'identifiant « <span id="absent-id"></span> ».</p>
                <a class="btn btn-secondary btn-sm" href="cac.html?vue=ponctuelles"><span class="ms">chevron_left</span>Retour aux missions CAC</a>
              </div>
            </div>
          </div>

          <div id="contenu">
            <div class="card soc-head" id="head"></div>
            <section class="card band" id="band" aria-label="Documents de la mission" hidden></section>
            <section class="card frise-etapes" id="frise" aria-labelledby="fe-titre"></section>
            <div id="retour" aria-live="polite"></div>
            <section class="card afaire" id="afaire" tabindex="-1"></section>
            <div class="d-stack" id="sections"></div>
          </div>
        </div>
        <div id="ej-footer"></div>
      </div>

    <div class="apercu" id="apercu" role="dialog" aria-modal="true" aria-labelledby="ap-titre" hidden>
      <div class="apercu-box">
        <div class="apercu-head">
          <div><h2 id="ap-titre" tabindex="-1"></h2><p id="ap-sous"></p></div>
          <button class="icon-btn" type="button" data-act="ap-fermer" aria-label="Fermer l'aperçu"><span class="ms">close</span></button>
