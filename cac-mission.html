<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mission ponctuelle CAC · Missions et conformité · Express Juridique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/ej-app.css?v=20" />
    <link rel="stylesheet" href="assets/ej-missions.css?v=24" />
    <style>
      /* ---- En-tête entité (repris de cac-mandat.html) ---- */
      .soc-head {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 22px 24px 22px 64px;
        margin-bottom: 16px;
      }
      .soc-motif {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 40px;
        overflow: hidden;
        border-radius: calc(var(--ej-radius-lg) - 1px) 0 0 calc(var(--ej-radius-lg) - 1px);
      }
      .soc-motif i {
        position: absolute;
        left: 0;
        height: 8px;
        border-radius: 0 var(--ej-radius-full) var(--ej-radius-full) 0;
      }
      .soc-motif .m1 {
        top: 24px;
        width: 40px;
        background: var(--ej-logo-mint);
      }
      .soc-motif .m2 {
        top: 38px;
        width: 24px;
        background: var(--ej-action-600);
      }
      .soc-head > div:nth-child(2) {
        min-width: 0;
      }
      .soc-name {
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
        font-weight: 700;
        color: var(--ej-primary-900);
        word-break: break-word;
      }
      .soc-name a {
        color: inherit;
        text-decoration: none;
      }
      .soc-name a:hover,
      .soc-name a:focus-visible {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .soc-form {
        margin-top: 2px;
        font-size: 14px;
        color: var(--ej-neutral-500);
      }
      .soc-op {
        margin-top: 8px;
        font-size: 14.5px;
        font-weight: 500;
        color: var(--ej-neutral-800);
      }
      .soc-greffe {
        margin-top: 2px;
        font-size: 14px;
        color: var(--ej-neutral-600);
      }
      .soc-greffe strong {
        font-weight: 700;
        color: var(--ej-primary-900);
      }
      .soc-ids {
        flex-shrink: 0;
      }

      /* ---- Bandeau d'état : documents de la mission ---- */
      .band {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px 20px;
        padding: 14px 20px;
        margin-bottom: 16px;
      }
      .band-docs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        font-size: 13.5px;
        color: var(--ej-neutral-700);
      }
      .band-docs > span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .band-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      /* ---- Bloc « À faire » (repris de lab-dossier.html) ---- */
      .afaire {
        margin-bottom: 16px;
        outline: none;
      }
      .afaire:focus-visible {
        box-shadow: 0 0 0 2px var(--ej-action-600);
      }
      .afaire-head {
        padding: 14px 20px 4px;
      }
      .afaire-head h2 {
        font-size: 15px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .afaire-list {
        list-style: none;
        padding: 0 20px 6px;
      }
      .afaire-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px 0;
      }
      .afaire-ico {
        flex-shrink: 0;
        margin-top: 1px;
        font-size: 18px;
        color: var(--ej-info-600);
      }
      .afaire-item.warn .afaire-ico {
        color: var(--ej-warning-600);
      }
      .afaire-txt {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--ej-neutral-700);
      }
      .afaire-txt strong {
        font-weight: 600;
        color: var(--ej-neutral-900);
      }
      .afaire-act {
        flex-shrink: 0;
      }
      .afaire-btns {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      .afaire-btns .btn {
        white-space: nowrap;
      }
      .afaire-ech {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 10px;
        margin-top: 8px;
        font-size: 13px;
        color: var(--ej-neutral-600);
      }
      .afaire.afaire-ok {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 20px;
      }
      .badge.badge-ech {
        color: var(--ej-warning-600);
        border-color: var(--ej-warning-600);
      }
      .afaire-ok .afaire-ico {
        color: var(--ej-success-600);
      }

      /* ---- Cartes ---- */
      #retour {
        margin-bottom: 16px;
      }
      #retour:empty {
        display: none;
      }
      #absent {
        margin-top: 8px;
      }
      .vide {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 22px;
        border: 1px dashed var(--ej-neutral-300);
        border-radius: var(--ej-radius-lg);
        background: var(--ej-neutral-50);
      }
      .vide strong {
        font-family: var(--ej-font-display);
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .vide p {
        font-size: 14px;
        color: var(--ej-neutral-600);
      }
      .d-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .d-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        align-items: start;
      }
      .d-card {
        min-width: 0;
      }
      .d-card .block-head {
        padding-bottom: 14px;
        border-bottom: 1px solid var(--ej-neutral-100);
        align-items: center;
      }
      .d-card .block-head h2 {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .d-card .block-head h2 .ms {
        font-size: 20px;
        color: var(--ej-action-600);
      }
      .d-body {
        padding: 18px 22px 20px;
      }
      .d-grid .kv {
        grid-template-columns: 150px minmax(0, 1fr);
      }
      .kv dd {
        min-width: 0;
        word-break: break-word;
      }
      .val-sub {
        display: block;
        margin-top: 2px;
        font-size: 12.5px;
        font-weight: 400;
        color: var(--ej-neutral-500);
      }
      .val-act {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }
      .puce-l {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
      }
      .ej-puce {
        display: inline-flex;
        align-items: flex-start;
        gap: 6px;
        min-width: 0;
        padding: 4px 10px;
        border-radius: var(--ej-radius-lg);
        background: var(--ej-action-100);
        color: var(--ej-action-700);
        font-size: 12.5px;
        font-weight: 500;
      }
      .ej-puce .ms {
        flex-shrink: 0;
        margin-top: 2px;
        font-size: 14px;
      }
      .oui-non {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 500;
      }
      .oui-non .ms {
        flex-shrink: 0;
        font-size: 16px;
      }
      .oui-non.ok {
        color: var(--ej-success-600);
      }
      .oui-non.warn {
        color: var(--ej-warning-600);
      }
      .lien-lab {
        display: inline-block;
        margin-top: 4px;
        font-size: 13px;
        font-weight: 600;
        color: var(--ej-action-700);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      /* Listes pièces et documents */
      .rows {
        list-style: none;
      }
      .rows li {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 12px;
        padding: 11px 0;
        border-top: 1px solid var(--ej-neutral-100);
      }
      .rows li:first-child {
        padding-top: 0;
        border-top: none;
      }
      .rows li:last-child {
        padding-bottom: 0;
      }
      .r-ico {
        flex-shrink: 0;
        font-size: 18px;
        color: var(--ej-neutral-500);
      }
      .r-ico.ok {
        color: var(--ej-success-600);
      }
      .r-ico.ej {
        color: var(--ej-action-600);
      }
      .r-lib {
        flex: 1 1 220px;
        min-width: 0;
        font-size: 14px;
        color: var(--ej-neutral-900);
      }
      .r-lib strong {
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .r-lib .val-sub {
        margin-top: 1px;
      }
      .r-act .btn {
        white-space: nowrap;
      }
      .compte {
        font-weight: 600;
        color: var(--ej-neutral-700);
      }

      /* Journal */
      .journal {
        list-style: none;
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .journal::before {
        content: "";
        position: absolute;
        left: 15px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: var(--ej-neutral-200);
      }
      .journal li {
        position: relative;
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }
      .journal li[hidden] {
        display: none;
      }
      .journal li > div {
        min-width: 0;
      }
      .j-ico {
        position: relative;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--ej-white);
        border: 1px solid var(--ej-hairline);
        color: var(--ej-action-600);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .j-ico .ms {
        font-size: 16px;
      }
      .j-date {
        font-size: 12.5px;
        font-style: italic;
        color: var(--ej-action-600);
      }
      .j-txt {
        font-size: 14px;
        color: var(--ej-neutral-900);
        word-break: break-word;
      }
      .j-who {
        font-size: 12.5px;
        color: var(--ej-neutral-500);
      }
      .j-plus {
        margin-top: 16px;
      }

      /* ---- Aperçu d'un document (fenêtre) ---- */
      body.apercu-ouvert {
        overflow: hidden;
      }
      .apercu {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: color-mix(in srgb, var(--ej-primary-900) 32%, transparent);
      }
      .apercu[hidden] {
        display: none;
      }
      .apercu-box {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 760px;
        max-height: calc(100vh - 48px);
        background: var(--ej-white);
        border-radius: var(--ej-radius-xl);
        box-shadow: var(--ej-shadow-xl);
        overflow: hidden;
      }
      .apercu-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 22px 14px;
        border-bottom: 1px solid var(--ej-hairline);
      }
      .apercu-head h2 {
        font-size: 18px;
        font-weight: 600;
        color: var(--ej-primary-900);
        outline: none;
      }
      .apercu-head h2:focus-visible {
        outline: 2px solid var(--ej-action-600);
        outline-offset: 3px;
        border-radius: var(--ej-radius-sm);
      }
      .apercu-head p {
        margin-top: 2px;
        font-size: 13px;
        color: var(--ej-neutral-500);
      }
      .apercu-desk {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 18px;
        background: var(--ej-neutral-100);
      }
      .apercu-sheet {
        max-width: 640px;
        margin: 0 auto;
        padding: 28px 26px 26px;
        background: var(--ej-white);
        border: 1px solid var(--ej-neutral-200);
        border-radius: var(--ej-radius-sm);
        box-shadow: var(--ej-shadow-md);
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--ej-neutral-800);
      }
      .apercu-sheet + .apercu-sheet {
        margin-top: 18px;
      }
      .sh-top {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--ej-primary-900);
      }
      .sh-cab {
        font-family: var(--ej-font-display);
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--ej-primary-900);
      }
      .sh-mut {
        color: var(--ej-neutral-500);
      }
      .sh-meta {
        text-align: right;
        color: var(--ej-neutral-600);
        font-variant-numeric: tabular-nums;
      }
      .sh-title {
        margin-top: 18px;
        font-family: var(--ej-font-display);
        font-size: 16px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .apercu-sheet h4 {
        margin-top: 14px;
        font-family: var(--ej-font-display);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .apercu-sheet p {
        margin-top: 6px;
      }
      .apercu-sheet ul {
        margin: 4px 0 0 18px;
      }
      .sh-kv {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: 4px 12px;
        margin-top: 10px;
      }
      .sh-kv dt {
        color: var(--ej-neutral-500);
      }
      .sh-kv dd {
        min-width: 0;
        color: var(--ej-neutral-900);
      }
      .sh-note {
        display: inline-block;
        margin-top: 10px;
        padding: 2px 8px;
        border-radius: var(--ej-radius-full);
        background: var(--ej-neutral-100);
        color: var(--ej-neutral-700);
        font-size: 12px;
        font-weight: 500;
      }
      .hon-field {
        margin-top: 8px;
      }
      .hon-field label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ej-neutral-700);
      }
      .hon-field input {
        width: 100%;
        max-width: 200px;
        height: 36px;
        margin-top: 4px;
        padding: 0 10px;
        border: 1px solid var(--ej-neutral-400);
        border-radius: var(--ej-radius-md);
        font: inherit;
        font-size: 14px;
        color: var(--ej-neutral-900);
      }
      .hon-field input:focus-visible {
        outline: 2px solid var(--ej-action-600);
        outline-offset: 1px;
      }
      .hon-field input[aria-invalid="true"] {
        border-color: var(--ej-error-600);
      }
      .concl-field label {
        display: block;
        margin-top: 6px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ej-neutral-700);
      }
      .concl-field textarea {
        display: block;
        width: 100%;
        min-height: 110px;
        margin-top: 4px;
        padding: 10px 12px;
        border: 1px solid var(--ej-neutral-400);
        border-radius: var(--ej-radius-md);
        font: inherit;
        font-size: 13.5px;
        color: var(--ej-neutral-900);
        resize: vertical;
      }
      .concl-field textarea:focus-visible {
        outline: 2px solid var(--ej-action-600);
        outline-offset: 1px;
      }
      .concl-field textarea[aria-invalid="true"] {
        border-color: var(--ej-error-600);
      }
      .concl-err {
        margin-top: 4px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ej-error-600);
      }
      .concl-print {
        display: none;
        white-space: pre-wrap;
      }
      .concl-texte {
        white-space: pre-wrap;
      }
      .sh-sign {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 18px;
      }
      .sh-sign > div {
        padding-top: 8px;
        border-top: 1px solid var(--ej-neutral-300);
        color: var(--ej-neutral-600);
      }
      .sh-sign strong {
        display: block;
        font-weight: 600;
        color: var(--ej-neutral-900);
      }
      .apercu-msg:empty {
        display: none;
      }
      .apercu-msg {
        padding: 10px 22px 0;
        font-size: 13px;
        font-weight: 500;
        color: var(--ej-success-600);
      }
      .apercu-foot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 10px;
        padding: 14px 22px 18px;
        border-top: 1px solid var(--ej-hairline);
      }

      /* ---- Pièces : provenance, versions, facultatives, périmètre du partage ---- */
      .r-act {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .p-src {
        display: inline-flex;
        align-items: center;
        max-width: 100%;
        height: 20px;
        padding: 0 8px;
        margin-right: 6px;
        border: 1px solid var(--ej-neutral-200);
        border-radius: var(--ej-radius-full);
        background: var(--ej-neutral-50);
        font-size: 11.5px;
        font-weight: 500;
        color: var(--ej-neutral-600);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: 1px;
      }
      .p-opt-t {
        margin-top: 18px;
        padding-top: 12px;
        border-top: 1px solid var(--ej-neutral-100);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ej-neutral-600);
      }
      .rows.p-opt {
        margin-top: 8px;
      }
      .rows.p-opt li {
        padding: 8px 0;
      }
      .rows.p-opt .r-lib {
        font-size: 13px;
        color: var(--ej-neutral-700);
      }
      .p-partage {
        display: flex;
        gap: 10px;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--ej-neutral-100);
        font-size: 13px;
        line-height: 1.5;
        color: var(--ej-neutral-600);
      }
      .p-partage .ms {
        flex-shrink: 0;
        margin-top: 2px;
        font-size: 16px;
        color: var(--ej-neutral-500);
      }
      .p-partage > div {
        min-width: 0;
        word-break: break-word;
      }
      .p-partage strong {
        font-weight: 600;
        color: var(--ej-neutral-800);
      }
      /* Versions d'un rapport, sous sa ligne */
      .r-vers {
        flex: 1 1 100%;
        min-width: 0;
        padding-left: 30px;
      }
      .rows .vers li {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 12px;
        padding: 5px 0;
        border-top: none;
        font-size: 13px;
        color: var(--ej-neutral-700);
      }
      .vers .v-txt {
        flex: 1 1 220px;
        min-width: 0;
        word-break: break-word;
      }
      .vers .v-cur {
        font-weight: 600;
        color: var(--ej-neutral-900);
      }
      .v-act {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .v-act .btn {
        white-space: nowrap;
      }
      .v-ret {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
        font-size: 13px;
        font-weight: 500;
        color: var(--ej-success-600);
      }
      .v-ret .ms {
        flex-shrink: 0;
        font-size: 15px;
      }

      /* ---- Fenêtres courtes (joindre un rapport, remise d'une version) ---- */
      .apercu.apercu-sm .apercu-box {
        max-width: 540px;
      }
      .apercu.apercu-sm .apercu-desk {
        padding: 18px 22px 8px;
        background: var(--ej-white);
      }
      .dlg-body > p {
        font-size: 14px;
        line-height: 1.5;
        color: var(--ej-neutral-700);
      }
      .dlg-field {
        margin-top: 14px;
      }
      .dlg-field label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--ej-neutral-700);
      }
      .dlg-field input[type="file"] {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 8px 10px;
        border: 1px solid var(--ej-neutral-400);
        border-radius: var(--ej-radius-md);
        background: var(--ej-white);
        font: inherit;
        font-size: 13.5px;
        color: var(--ej-neutral-900);
      }
      .dlg-field input:focus-visible,
      .dlg-check input:focus-visible {
        outline: 2px solid var(--ej-action-600);
        outline-offset: 2px;
      }
      .dlg-field input[aria-invalid="true"] {
        border-color: var(--ej-error-600);
      }
      .dlg-check {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 16px;
        font-size: 14px;
        font-weight: 500;
        color: var(--ej-neutral-900);
        cursor: pointer;
      }
      .dlg-check input {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        margin-top: 1px;

    <script>
      /* Fiche d'une mission ponctuelle du commissaire aux comptes (apports, transformation, fusion).
         Rendu au DOMContentLoaded : ej-shell.js (chargé après) pose data-profil sur le body avant cet événement.
         L'avancement est écrit dans sessionStorage « ej-cac-ponctuelles » et appliqué par ej-missions-data.js
         à toutes les pages ; m._origine garde les données d'avant la session. */
      document.addEventListener("DOMContentLoaded", function () {
        var E = window.EJM,
          esc = E.esc;

        /* ---------- Mission affichée (sans paramètre : orvane ; id inconnu : état « introuvable ») ---------- */
        var id = new URLSearchParams(location.search).get("id");
        var m0 = id === null ? E.findPonctuelle("orvane") : E.findPonctuelle(id);
        if (!m0) {
          document.title = "Mission introuvable · Missions CAC · Express Juridique";
          document.getElementById("contenu").hidden = true;
          document.getElementById("absent").hidden = false;
          document.getElementById("absent-id").textContent = id;
          return;
        }
        document.title = (m0.nom || "Mission") + " · Mission ponctuelle CAC · Express Juridique";
        /* Fiche société du portefeuille CAC (societe.html?cac=<SIREN en chiffres>) : lien du nom et retour from=societe */
        var cleSoc = String(m0.siren || "").replace(/\D/g, "");
        var urlSoc = cleSoc.length === 9 ? "societe.html?cac=" + cleSoc : "";
        if (urlSoc && new URLSearchParams(location.search).get("from") === "societe") {
          var bl = document.querySelector(".back-link");
          if (bl) {
            bl.setAttribute("href", urlSoc);
            bl.innerHTML = '<span class="ms">chevron_left</span>' + esc(m0.nom || "Société");
          }
        }
        /* Données d'avant la session (journal dérivé, état initial) */
        var M = m0._origine || m0;

        /* ---------- Dates ---------- */
        function ok(x) {
          return typeof x === "string" && /^\d\d\/\d\d\/\d{4}$/.test(x);
        }
        function dt(x) {
          var p = x.split("/");
          return new Date(+p[2], +p[1] - 1, +p[0]);
        }
        function fmt(date) {
          function z(n) { return (n < 10 ? "0" : "") + n; }
          return z(date.getDate()) + "/" + z(date.getMonth() + 1) + "/" + date.getFullYear();
        }
        function plusJours(x, n) {
          var date = dt(x);
          date.setDate(date.getDate() + n);
          return fmt(date);
        }
        /* Ramène un samedi ou un dimanche au vendredi précédent */
        function ouvre(x) {
          var date = dt(x);
          while (date.getDay() === 0 || date.getDay() === 6) date.setDate(date.getDate() - 1);
          return fmt(date);
        }
        var TODAY = dt(E.today);
        function jours(x) {
          return Math.round((dt(x) - TODAY) / 86400000);
        }

        /* ---------- Référentiels ---------- */
        var ORDRE = ["designation", "acceptation", "pieces", "rapport", "signature", "depot", "termine"];
        var FRISE = ["designation", "acceptation", "pieces", "rapport", "signature", "depot"];
        var QUALITE = { apport: "commissaire aux apports", transformation: "commissaire à la transformation", fusion: "commissaire à la fusion" };
        var PIECES = {
          apport: ["Décision de désignation", "Projet de traité d'apport", "Statuts à jour", "Derniers comptes approuvés",
            "Rapport d'évaluation des titres ou du bien apporté", "Extrait Kbis", "État des inscriptions et nantissements",
            "Inventaire des éléments d'actif et de passif apportés"],
          transformation: ["Décision de désignation", "Statuts à jour", "Derniers comptes approuvés", "Situation intermédiaire",
            "Projet de statuts de SAS", "Extrait Kbis"],
          fusion: ["Décision de désignation", "Projet de traité de fusion", "Comptes des deux sociétés", "Situations intermédiaires",
            "Méthodes d'évaluation", "Statuts", "Extraits Kbis", "Rapport des dirigeants", "État des engagements hors bilan"],
        };
        var RAPPORTS = {
          apport: ["Rapport du commissaire aux apports"],
          transformation: ["Rapport sur la valeur des biens et la situation nette"],
          fusion: ["Rapport sur la valeur des apports", "Rapport sur la rémunération des apports"],
        };
        var DILIGENCES = {
          apport: ["Vérification de la réalité et de la description des apports dans le projet de traité",
            "Appréciation des méthodes d'évaluation et de la valeur attribuée aux apports",
            "Recherche de faits ou d'engagements susceptibles d'affecter cette valeur"],
          transformation: ["Appréciation de la valeur des biens composant l'actif",
            "Examen de la situation intermédiaire et des passifs",
            "Vérification que les capitaux propres sont au moins égaux au capital social"],
          fusion: ["Vérification de la réalité des apports",
            "Appréciation des méthodes d'évaluation et de la valeur des apports",
            "Recherche de faits susceptibles d'affecter cette valeur"],
          remuneration: ["Examen des méthodes d'évaluation des deux sociétés",
            "Appréciation de la pertinence des valeurs relatives retenues",
            "Appréciation du caractère équitable du rapport d'échange"],
        };
        var DOC_BADGE = { a_produire: "badge-neutral", brouillon: "badge-progress", a_signer: "badge-action", signe: "badge-success", depose: "badge-success" };
        var LM_LIB = { signee: "Signée", envoyee: "Envoyée pour signature", brouillon: "Brouillon", a_etablir: "À établir" };
        var LAB_LIB = { a_jour: "Dossier à jour", a_revoir: "Revue échue", incomplet: "Pièces manquantes", a_ouvrir: "Dossier à ouvrir", fin_relation: "Relation terminée" };
        /* Seuil d'alerte de l'échéance (jours restants) */
        var ALERTE_JOURS = 10;

        /* ---------- Mission normalisée (les missions créées en session peuvent avoir des champs vides) ---------- */
        var nature = PIECES[m0.nature] ? m0.nature : "apport";
        var conseil = m0.conseil || { nom: "", ej: false };
        /* Le conseil utilise EJ ET une formalité est identifiée : seul cas de transmission dans la formalité */
        var conseilEJ = !!(conseil.ej && conseil.formalite);
        var desig = m0.designation || {};
        var D = ok(desig.date) ? desig.date : E.today;
        var signataire = E.equipe[m0.signataire] || E.equipe.CD;
        var qualite = QUALITE[nature];
        var etape0 = ORDRE.indexOf(M.etape) >= 0 ? M.etape : "designation";
        var docs0 = M.documents && M.documents.length ? M.documents
          : [["Lettre de mission", "a_produire"]].concat(RAPPORTS[nature].map(function (l) { return [l, "a_produire"]; })).concat([["Lettre d'affirmation", "a_produire"]]);
        var pieces0 = M.pieces && M.pieces.length === 2 ? M.pieces : [0, PIECES[nature].length];
        var dirigeant = m0.dirigeant || "";
        var absorbee = nature === "fusion" ? ((m0.operation || "").match(/Fusion-absorption de (.+?) par /) || [])[1] || "la société absorbée" : "";
        var echeance = ok(m0.depotAvant) ? m0.depotAvant : null;
        var reste = echeance ? jours(echeance) : null;

        /* Le dossier LAB appartient au module LAB (lab.html, lab-dossier.html) : cette page le lit seulement.
           ej-lab.js applique au chargement les revues validées dans la session. */
        var LAB = ((window.EJLAB && window.EJLAB.trouver(m0.id)) || m0).lab || { statut: "a_ouvrir", risque: null };
        function labAJour() {
          return LAB.statut === "a_jour";
        }
        /* Identification faite (dossier ouvert) : la lettre de mission peut être établie, pas encore envoyée */
        function labOuvert() {
          return LAB.statut !== "a_ouvrir";
        }
        var URL_LAB = "lab-dossier.html?id=" + encodeURIComponent(m0.id) + "&from=mission";

        function idx(e) { return ORDRE.indexOf(e); }
        function estRapport(d) { return /^Rapport/.test(d[0]); }
        function estLA(d) { return d[0] === "Lettre d'affirmation"; }
        function estLM(d) { return d[0] === "Lettre de mission"; }
        function libs(arr) { return arr.map(function (d) { return d[0]; }).join(", "); }
        function lower1(s) { return s ? s.charAt(0).toLowerCase() + s.slice(1) : ""; }
        function nomCourt(s) { return (s || "").split(",")[0]; }
        function copie(x) { return JSON.parse(JSON.stringify(x)); }
        function tip(key, texte, label) {
          return '<span class="info-tip">' +
            '<button type="button" class="info-tip-btn" aria-describedby="note-cp-' + key + '" aria-label="' + esc(label || "Information") + '"><span class="ms">info</span></button>' +
            '<span class="info-tip-pop" role="tooltip" id="note-cp-' + key + '">' + esc(texte) + "</span></span>";
        }
        var NOTE_DELAI = m0.delai && m0.delai.texte
          ? "Mise à disposition du rapport au siège social : " + m0.delai.texte + (m0.delai.ref ? " (" + m0.delai.ref + ")." : ".")
          : "";
        var NOTE_ACCORD = "Le rapport rejoint la formalité du conseil seulement avec l'accord de la société.";
        var nomDirigeant = nomCourt(dirigeant) || "la société";
        function signatairesLA() {
          var l = [dirigeant ? dirigeant + (nature === "fusion" ? " de " + (m0.nom || "") : "") : "Dirigeant de " + (m0.nom || "la société")];
          if (nature === "fusion") l.push(m0.dirigeantAbsorbee ? m0.dirigeantAbsorbee + " de " + absorbee : "Dirigeant de " + absorbee);
          return l;
        }
        function nomsLA() {
          return signatairesLA().map(nomCourt).join(" et ");
        }

        /* ---------- Journal de base et dates d'étape, dérivés des données d'avant la session ---------- */
        var BASE = [];
        var BASE_DATES = { designation: D };
        var BASE_SIGNATURE = null, BASE_LA_SIGNEE = null;
        (function () {
          var i0 = idx(etape0);
          var fin = etape0 === "termine" && ok(M.transmis) ? M.transmis : E.today;
          var duree = Math.max(0, Math.round((dt(fin) - dt(D)) / 86400000));
          function a(f) {
            var d = ouvre(plusJours(D, Math.round(duree * f)));
            return dt(d) < dt(D) ? D : d;
          }
          function add(d, i, t, w) { BASE.push({ d: d, i: i, t: t, w: w }); }
          var liste = PIECES[nature].slice(0, pieces0[1]);
          var accord0 = M.accord;
          var lm0 = M.lm || {};
          add(D, "stamp", "Désignation reçue : " + (desig.mode ? lower1(desig.mode) : "désignation") + ".", signataire.nom);
          if (conseilEJ) add(D, "link", "Mission rattachée à la formalité EJ " + conseil.formalite + " du conseil.", conseil.nom);
          if (i0 >= 1) add(a(0.05), "clipboard-check", "Acceptation engagée.", signataire.nom);
          if (accord0 && ok(accord0.date)) add(accord0.date, "handshake", "Accord de la société signé par " + nomCourt(accord0.par) + ".", accord0.par);
          if (i0 >= 2) {
            add(a(0.12), "shield-check", "Déclaration d'indépendance signée par " + signataire.nom + ".", signataire.nom);
            if (lm0.ref) {
              add(a(0.15), "send", "Lettre de mission envoyée pour signature (réf. " + lm0.ref + ").", signataire.nom);
              add(a(0.22), "file-pen-line", "Lettre de mission signée par " + nomDirigeant + ".", dirigeant || nomDirigeant);
            }
            add(a(0.25), "badge-check", "Mission acceptée.", signataire.nom);
            BASE_DATES.acceptation = a(0.25);
            add(a(0.25), "file-text", "Brouillons créés depuis le modèle du cabinet : rapport et lettre d'affirmation.", signataire.nom);
            add(a(0.27), "send", "Lien de dépôt sécurisé envoyé au conseil.", signataire.nom);
            if (liste.some(function (l) { return /Kbis/.test(l); })) add(a(0.27), "database", "Extrait RNE repris par le connecteur INPI.", "Express Juridique");
            if (accord0 && conseilEJ) add(a(0.27), "database", "Statuts et décision de désignation repris de la formalité EJ " + conseil.formalite + ".", "Express Juridique");
            if (i0 === 2 && pieces0[0] > 1) add(a(0.6), "folder-up", "Pièces déposées par le conseil.", conseil.nom);
            if (i0 >= 3) {
              add(a(0.55), "folder-check", "Pièces complètes : " + pieces0[1] + " sur " + pieces0[1] + ".", conseil.nom);
              BASE_DATES.pieces = a(0.55);
            }
          }
          if (i0 >= 4) {
            add(a(0.8), "pencil-line", "Conclusion saisie par " + signataire.nom + ".", signataire.nom);
            add(a(0.85), "file-check", "Rapport finalisé.", signataire.nom);
            BASE_DATES.rapport = a(0.85);
            var la0 = docs0.filter(estLA)[0];
            if (ok(M.laEnvoi)) add(M.laEnvoi, "send", "Lettre d'affirmation envoyée en signature électronique à " + nomsLA() + ".", signataire.nom);
            else if (la0 && la0[1] === "signe") add(a(0.9), "send", "Lettre d'affirmation envoyée en signature électronique à " + nomsLA() + ".", signataire.nom);
            if (la0 && la0[1] === "signe" && i0 >= 5) {
              BASE_LA_SIGNEE = a(0.95);
              add(BASE_LA_SIGNEE, "signature", "Lettre d'affirmation signée par " + nomsLA() + ".", nomsLA());
            }
          }
          if (i0 >= 5) {
            BASE_DATES.signature = BASE_SIGNATURE = a(0.95);
            add(BASE_SIGNATURE, "signature", "Rapport signé électroniquement par " + signataire.nom + ".", signataire.nom);
          }
          if (i0 >= 6) {
            add(fin, "send", conseilEJ && accord0
              ? "Rapport transmis dans la formalité EJ " + conseil.formalite + ", avec l'accord de la société."
              : "Rapport transmis au conseil par lien de téléchargement.", signataire.nom);
            BASE_DATES.depot = fin;
            if (ok(M.miseADisposition)) add(M.miseADisposition, "building-2", "Mise à disposition au siège confirmée par le conseil.", conseil.nom);
          }
        })();

        /* ---------- État de session (sessionStorage « ej-cac-ponctuelles », objet par id) ---------- */
        var CLE = "ej-cac-ponctuelles";
        var MEM = {};
        function lireTout() {
          try {
            var v = sessionStorage.getItem(CLE);
            return v ? JSON.parse(v) || {} : MEM;
          } catch (e) {
            return MEM;
          }
        }
        var st = lireTout()[m0.id];
        if (!st || st.v !== 3) {
          st = {
            v: 3,
            etape: etape0,
            pieces: pieces0.slice(),
            recues: null,
            relances: copie(M.relances || []),
            documents: copie(docs0),
            lm: copie(M.lm || { statut: "a_etablir", ref: null }),
            independance: copie(M.independance || { statut: "a_faire" }),
            honoraires: M.honoraires || null,
            accord: M.accord ? copie(M.accord) : null,
            accordDemande: null,
            conclusions: copie(M.conclusions || {}),
            dates: copie(BASE_DATES),
            dateRapport: BASE_SIGNATURE,
            laEnvoi: ok(M.laEnvoi) ? M.laEnvoi : null,
            laSignee: BASE_LA_SIGNEE,
            transmis: ok(M.transmis) ? M.transmis : null,
            miseADisposition: ok(M.miseADisposition) ? M.miseADisposition : null,
            journal: [],
          };
        }
        if (st.lm.statut === "absente") st.lm.statut = "a_etablir";

        /* ---------- Pièces : reprises d'EJ, déposées par le conseil, attendues ---------- */
        function listePieces() {
          var base = PIECES[nature];
          var out = [];
          for (var i = 0; i < st.pieces[1]; i++) out.push(base[i] || "Pièce complémentaire " + (i + 1));
          return out;

        /* Source de reprise : extrait RNE public (connecteur INPI) ; statuts et décision de désignation
           seulement depuis la formalité EJ du conseil, avec l'accord de la société. */
        function sourceReprise(lib) {
          if (/Kbis/.test(lib)) return "Extrait RNE · INPI";
          if ((/^Statuts( à jour)?$/.test(lib) || /^Décision de désignation/.test(lib)) && conseilEJ && st.accord) return "Formalité EJ " + conseil.formalite;
          return null;
        }
        function collecte() {
          return idx(st.etape) >= idx("pieces");
        }
        if (!st.recues) {
          var l0 = listePieces();
          var nRep0 = collecte() ? l0.filter(sourceReprise).length : 0;
          var nDep = Math.max(0, st.pieces[0] - nRep0);
          st.recues = l0.filter(function (l) { return !(collecte() && sourceReprise(l)); }).slice(0, nDep);
        }
        /* Ancien état des pièces (reprise, déposée, attendue) : sert seulement à dériver le détail des pièces */
        function etatPiecesAncien() {
          return listePieces().map(function (lib) {
            var src = sourceReprise(lib);
            if (src) return { lib: lib, etat: collecte() ? "reprise" : "prevue", src: src };
            return { lib: lib, etat: st.recues.indexOf(lib) !== -1 ? "deposee" : "attendue" };
          });
        }
        /* Détail des pièces (contrat EJM : piecesDetail). Données initiales de la mission si présentes, sinon dérivé :
           reprise → registre ou formalité ; déposée → lien de dépôt ; reçue = contrôlée à partir de l'étape Rapport. */
        function deriverPieces() {
          var avance = idx(st.etape) >= idx("rapport");
          var dRep = st.dates.acceptation || D;
          return etatPiecesAncien().map(function (p) {
            var x = { lib: p.lib, source: null, origine: null, dateDoc: null, version: null, recuperee: null, etat: "attendue", historique: [], motif: null, optionnelle: false };
            if (p.etat === "reprise" || p.etat === "prevue") {
              var reg = /INPI/.test(p.src);
              x.source = reg ? "registre" : "operation";
              x.origine = p.src;
              if (p.etat === "reprise") {
                x.recuperee = dRep;
                x.version = (reg ? "Récupéré le " : "Repris le ") + dRep;
                x.etat = avance ? "controlee" : "recue";
              } else x.etat = "disponible";
            } else if (p.etat === "deposee") {
              x.source = "depot";
              x.origine = "Lien de dépôt du conseil";
              x.etat = avance ? "controlee" : "recue";
            }
            return x;
          });
        }
        if (!st.piecesDetail || !st.piecesDetail.length) {
          st.piecesDetail = M.piecesDetail && M.piecesDetail.length ? copie(M.piecesDetail) : deriverPieces();
        }
        st.piecesDetail.forEach(function (p) { if (!p.historique) p.historique = []; });
        var RECU = { recue: 1, controlee: 1, retenue: 1 };
        /* Pièce comptée dans le total : ni facultative encore disponible, ni sans objet */
        function compte(p) {
          return !(p.optionnelle && p.etat === "disponible") && p.etat !== "sans_objet";
        }
        function pieces() { return st.piecesDetail; }
        function nbRecues() {
          return pieces().filter(function (p) { return compte(p) && RECU[p.etat]; }).length;
        }
        function nbAttendues() {
          return pieces().filter(compte).length;
        }
        function piecesCompletes() {
          return nbRecues() >= nbAttendues();
        }
        /* Pièces demandées au conseil : attendues ou à remplacer (jamais une pièce disponible dans une source) */
        function enAttente() {
          return pieces().filter(function (p) { return compte(p) && (p.etat === "attendue" || p.etat === "a_remplacer"); });
        }
        /* Pièces qui bloquent la signature du rapport */
        function bloquantes() {
          return pieces().filter(function (p) { return compte(p) && (p.etat === "recue" || p.etat === "a_remplacer"); });
        }
        function ecrire() {
          /* « pieces » partagé avec les autres pages : [reçues (reçue, contrôlée, retenue), attendues (hors facultatives disponibles et sans objet)] */
          st.pieces = [nbRecues(), nbAttendues()];
          syncVersions();
          var tout = lireTout();
          tout[m0.id] = st;
          MEM = tout;
          try {
            sessionStorage.setItem(CLE, JSON.stringify(tout));
          } catch (e) {}
        }
        function rapports() { return st.documents.filter(estRapport); }
        function la() { return st.documents.filter(estLA)[0] || null; }
        function transmettreDansEJ() { return !!(conseilEJ && st.accord); }

        /* ---------- Versions des rapports et remises (contrat EJM : versions, remises) ----------
           Version courante = la plus récente. Brouillon, finalisée, signée et remise sont des états distincts.
           État initial dérivé du statut du document ; d[1] reste le jalon de la mission (jamais en recul). */
        function versionsDe(lib) {
          st.versions = st.versions || {};
          return st.versions[lib] || (st.versions[lib] = []);
        }
        function courante(lib) {
          var vs = versionsDe(lib);
          return vs[vs.length - 1] || null;
        }
        function syncVersions() {
          st.versions = st.versions || {};
          rapports().forEach(function (d) {
            var vs = versionsDe(d[0]);
            if (vs.length || d[1] === "a_produire") return;
            var s = d[1];
            vs.push({
              n: 1, origine: "modele", fichier: null,
              etat: s === "brouillon" ? "brouillon" : s === "a_signer" ? "finalise" : "signe",
              creee: st.dates.acceptation || D,
              finalisee: s !== "brouillon" ? st.dates.rapport || null : null,
              signee: s === "signe" || s === "depose" ? st.dateRapport || null : null,
              remise: s === "depose" ? st.transmis || null : null,
            });
          });
          if (!st.remises) {
            st.remises = [];
            rapports().forEach(function (d) {
              if (d[1] === "depose" && st.transmis)
                st.remises.push({ doc: d[0], n: 1, date: st.transmis, operation: transmettreDansEJ() ? conseil.formalite : null, destinataire: conseil.nom || null });
            });
          }
        }
        syncVersions();
        function nouvelleVersion(lib, origine, fichier, finalisee) {
          var vs = versionsDe(lib);
          var v = { n: vs.length + 1, origine: origine, fichier: fichier || null, etat: finalisee ? "finalise" : "brouillon",
            creee: E.today, finalisee: finalisee ? E.today : null, signee: null, remise: null };
          vs.push(v);
          return v;
        }
        /* Rapports dont une version signée plus récente que la dernière remise reste à remettre */
        function aRemettre() {
          return rapports().map(function (d) {
            var sig = versionsDe(d[0]).filter(function (v) { return v.etat === "signe"; });
            var der = sig[sig.length - 1];
            var rem = (st.remises || []).filter(function (r) { return r.doc === d[0]; });
            var prev = rem[rem.length - 1] || null;
            if (!der || der.remise || (prev && prev.n >= der.n)) return null;
            return { d: d, v: der, prev: prev };
          }).filter(Boolean);
        }
        function nomRapport(lib) { return rapports().length > 1 ? lib : "Rapport"; }
        function origineVersion(v) {
          return v.origine === "joint" ? "jointe : " + (v.fichier || "fichier joint") : "préparée depuis le modèle du cabinet";
        }
        /* Version retenue par le conseil pour son dossier de dépôt (lecture seule, compte du conseil) */
        function retenueConseil(lib) {
          if (!conseilEJ) return null;
          try {
            var r = JSON.parse(sessionStorage.getItem("ej-conseil-retenues") || "{}") || {};

            return null;
          }
        }
        var DOC_FEM = { signe: "Signée", depose: "Remise" };
        function badgeDoc(d) {
          if (!d) return "";
          var lib = /^Lettre/.test(d[0]) && DOC_FEM[d[1]] ? DOC_FEM[d[1]] : E.DOC_STATUT[d[1]];

        function badgeEcheance() {

            (reste === 0 ? "Aujourd'hui" : reste + " jour" + (reste > 1 ? "s" : "") + " restant" + (reste > 1 ? "s" : "")) + "</span>";
        }
        /* Verbe canonique (EJM.verbePonctuelle), partagé avec la liste des missions */
        function verbe() {
          var vue = { id: m0.id, etape: st.etape, independance: st.independance, lm: st.lm, documents: st.documents,
            laEnvoi: st.laEnvoi, transmis: st.transmis, conseil: conseil, accord: st.accord };
          return E.verbePonctuelle ? E.verbePonctuelle(vue, labAJour()) : { lib: E.ETAPE[st.etape], ancre: "" };
        }

        /* ---------- Rendu ---------- */
        var journalOuvert = false;
        function rendre() {
          var e = st.etape;
          var ie = idx(e);
          var termine = e === "termine";
          var transmis = !!st.transmis;
          var recues = nbRecues();
          var etapeRapport = e === "rapport";

          /* En-tête */
          document.getElementById("head").innerHTML =

            '<h1 class="soc-name">' + (urlSoc ? '<a href="' + esc(urlSoc) + '">' + esc(m0.nom || "Mission") + "</a>" : esc(m0.nom || "Mission")) + "</h1>" +

            '<div class="soc-ids"><span class="badge badge-brand">' + esc(E.NATURE[nature]) + "</span></div>";

          var band = document.getElementById("band");
          if (ie >= 1) {
            var r0 = rapports()[0];
            band.hidden = false;
            band.innerHTML =
              '<div class="band-docs"><span>' + (rapports().length > 1 ? "Rapports" : "Rapport") + " " + badgeDoc(r0) + "</span>" +
              "<span>Lettre d'affirmation " + badgeDoc(la()) + "</span></div>" +
              '<div class="band-btns">' +
              '<button class="btn ' + (etapeRapport ? "btn-primary" : "btn-secondary") + ' btn-sm" type="button" data-act="apercu" data-doc="rapport" aria-haspopup="dialog"><span class="ms">file-text</span>Rapport</button>' +

          var DATE_LIB = { designation: "Reçue le ", depot: "Transmis le " };
          var items = FRISE.map(function (p, i) {
            var cls, ico = "", sub, sr;

            } else if (i === cur) {
              cls = "is-current";
              sub = "En cours";
              sr = ", en cours";

                cls += " is-blocked";

          var n = Math.min(cur + 1, FRISE.length);

            '<h2 class="fe-titre" id="fe-titre">Progression · Étape ' + n + " sur " + FRISE.length + (termine ? " · mission terminée" : "") + "</h2>" +
            '<ol class="fe-list" style="--fe-n: ' + FRISE.length + '">' + items + "</ol>";

              '<div class="afaire-txt"><strong>' + A.phrase + "</strong>" + (A.detail ? " " + A.detail : "") +
              (echeance ? '<div class="afaire-ech"><span>À disposition au siège au plus tard le <strong>' + esc(echeance) + "</strong>" + (ok(m0.assemblee) ? " · assemblée le " + esc(m0.assemblee) : "") + "</span>" +

          }
          function kv(k, v, sub) {

          }

          /* Opération */
          var op = "";

          if (m0.operation) op += kv("Opération", esc(m0.operation));
          if (m0.valeur != null) op += kv("Valeur des apports", esc(E.euros(m0.valeur)));

          if (ok(m0.assemblee)) op += kv("Assemblée", "Le " + esc(m0.assemblee),

                '<span class="val-sub">Signature électronique de ' + esc(nomDirigeant) + " " + tip("accord", NOTE_ACCORD, "Accord de la société") + "</span>" +

                '<span class="val-sub">Partage des pièces et transmission dans la formalité ' + tip("accord", NOTE_ACCORD, "Accord de la société") + "</span>" +
                '<span class="val-act"><button class="btn btn-secondary btn-sm" type="button" data-act="accord-demande"><span class="ms">send</span>Demander l\'accord</button></span>');

          }

          var ac = "";
          ac += kv("Indépendance", '<span class="oui-non ' + (ind ? "ok" : "warn") + '"><span class="ms">' + (ind ? "circle-check" : "circle-dashed") + "</span>" + esc(E.INDEP[st.independance.statut] || "Déclaration à faire") + "</span>",

          ac += kv("Vigilance LAB", '<span class="oui-non ' + (labOk ? "ok" : "warn") + '"><span class="ms">' + (labOk ? "circle-check" : "circle-dashed") + "</span>" + esc(LAB_LIB[LAB.statut] || LAB.statut) + "</span>",
            '<span class="val-sub"><span class="risk ' + (LAB.risque ? "risk-" + LAB.risque : "risk-na") + '">' + esc(LAB.risque ? E.RISQUE[LAB.risque] : "Risque non évalué") + "</span></span>" +

              '<div class="concl-err" id="hon-err"></div></div>' +

          } else {

                '<span class="val-act"><button class="btn btn-secondary btn-sm" type="button" data-act="lm-signee"><span class="ms">check</span>Marquer comme signée par la société</button></span>';

          var grille = '<div class="d-grid">' +
            carte("briefcase", "Opération", "", "", '<dl class="kv">' + op + "</dl>", "operation") +

            "</div>";

          /* Pièces : provenance, date du document, version, un seul état par ligne.

          var PI = {

            recue: ["file-search", "", "badge-ech", "Reçue, à contrôler"],
            controlee: ["file-check", "ok", "badge-success", "Contrôlée"],
            a_remplacer: ["file-warning", "", "badge-error", "À remplacer"],

          };
          var actifP = collecte() && !termine;
          function btnP(act, i, ico, lib, nom) {
            return '<button class="btn btn-secondary btn-sm" type="button" data-act="' + act + '" data-piece="' + i + '"><span class="ms">' + ico + "</span>" + lib +
              '<span class="sr-only"> : ' + esc(nom) + "</span></button>";
          }
          function lignePiece(p, i) {
            var c = PI[p.etat] || PI.attendue;
            var det = [];
            if (p.dateDoc) det.push("Document du " + p.dateDoc);

          AP.hidden = false;
          document.body.classList.add("apercu-ouvert");
          (focusId && document.getElementById(focusId) || document.getElementById("ap-titre")).focus();
        }
        function ouvrirJoindre(k, origine) {
          var d = rapports()[k];
          if (!d) return;
          joindreLib = d[0];
          var n = versionsDe(d[0]).length + 1;
          ouvrirFenetre("joindre", origine, "Joindre un rapport", d[0] + " · version " + n,
            '<div class="dlg-body"><p>Rapport préparé dans votre outil habituel. Il devient la version ' + n + " de ce rapport, sans modifier les versions précédentes.</p>" +
            '<div class="dlg-field"><label for="j-fichier">Fichier du rapport (PDF ou Word)</label>' +
            '<input id="j-fichier" type="file" accept=".pdf,.docx" aria-describedby="j-err" /><div class="concl-err" id="j-err"></div></div>' +
            '<label class="dlg-check"><input type="checkbox" id="j-final" aria-describedby="j-aide" />Version finalisée par le commissaire</label>' +
            '<p class="dlg-aide" id="j-aide">Sinon, la version reste un brouillon. La conclusion figure dans le fichier joint.</p></div>',
            '<button class="btn btn-tertiary" type="button" data-act="ap-fermer">Annuler</button>' +
            '<button class="btn btn-primary" type="button" data-act="ap-joindre"><span class="ms">paperclip</span>Joindre cette version</button>', "j-fichier");
        }
        function confirmerJoindre() {
          var f = document.getElementById("j-fichier");
          var fichier = f && f.files && f.files[0];
          if (!fichier || !/\.(pdf|docx)$/i.test(fichier.name)) {
            f.setAttribute("aria-invalid", "true");
            document.getElementById("j-err").textContent = "Choisissez un fichier PDF ou Word (.docx).";
            f.focus();
            return;
          }
          var fin = document.getElementById("j-final").checked;
          var lib = joindreLib;
          var v = nouvelleVersion(lib, "joint", fichier.name, fin);
          setDocs("brouillon", function (d) { return d[0] === lib && d[1] === "a_produire"; });
          log("paperclip", nomRapport(lib) + " version " + v.n + " joint : " + fichier.name + (fin ? ", finalisé par le commissaire." : ", en brouillon."));
          apOrigine = null;
          AP.hidden = true;
          document.body.classList.remove("apercu-ouvert");
          apres("Version " + v.n + " jointe" + (fin ? " et finalisée." : ", en brouillon."));
          var b = document.querySelector('#documents [data-act="joindre"][data-r="' + rapports().map(function (d) { return d[0]; }).indexOf(lib) + '"]');
          if (b && st.etape !== "rapport") b.focus();
        }
        function ouvrirRemise(origine) {
          var L = aRemettre();
          if (!L.length) return annoncer("Aucune version signée à remettre.", false);
          var dansEJ = transmettreDansEJ();
          function kvr(k, v) { return "<dt>" + esc(k) + "</dt><dd>" + esc(v) + "</dd>"; }
          var corps = L.map(function (x) {
            return '<div class="rm-doc"><strong>' + esc(x.d[0]) + '</strong><dl class="rm-kv">' +
              kvr("Version", "Version " + x.v.n + " · " + origineVersion(x.v)) +
              kvr("Signature", "Signé électroniquement par " + signataire.nom + " le " + (x.v.signee || "")) + "</dl>" +
              (x.prev ? '<p class="rm-note">Remplace la version ' + esc(x.prev.n) + " remise le " + esc(x.prev.date) + " pour le conseil, qui choisit la version retenue pour le dépôt.</p>" : "") +
              "</div>";
          }).join("") +
            '<div class="rm-dest"><dl class="rm-kv">' +
            kvr("Opération", dansEJ ? "Formalité " + conseil.formalite + (conseil.libelle ? " · " + conseil.libelle : "") : "Hors Express Juridique, lien de téléchargement") +
            kvr("Destinataire", conseil.nom || "Conseil de la société") + "</dl>" +
            (conseilEJ && !st.accord ? '<p class="rm-note">' + esc(NOTE_ACCORD) + "</p>" : "") + "</div>";
          ouvrirFenetre("remise", origine, L.length > 1 ? "Remettre les rapports signés" : "Remettre le rapport signé", m0.nom || "", corps,
            '<button class="btn btn-tertiary" type="button" data-act="ap-fermer">Annuler</button>' +
            '<button class="btn btn-primary" type="button" data-act="ap-remettre"><span class="ms">send</span>' + (L.length > 1 ? "Remettre ces versions" : "Remettre cette version") + "</button>");
        }
        function confirmerRemise() {
          var L = aRemettre();
          if (!L.length) return fermerApercu();
          var dansEJ = transmettreDansEJ();
          L.forEach(function (x) {
            x.v.remise = E.today;
            st.remises.push({ doc: x.d[0], n: x.v.n, date: E.today, operation: dansEJ ? conseil.formalite : null, destinataire: conseil.nom || null });
            x.d[1] = "depose";
            log("send", nomRapport(x.d[0]) + " version " + x.v.n + (dansEJ ? " remis dans la formalité EJ " + conseil.formalite + "." : " transmis au conseil par lien de téléchargement."));
          });
          if (!st.transmis) st.transmis = E.today;
          apOrigine = null;
          AP.hidden = true;
          document.body.classList.remove("apercu-ouvert");
          apres((L.length > 1 ? "Rapports signés remis" : "Version " + L[0].v.n + " remise") +
            (dansEJ ? " dans la formalité " + conseil.formalite + "." : (conseil.nom ? " à " + conseil.nom : " au conseil") + " par lien de téléchargement."));
        }
        function fermerApercu() {
          AP.hidden = true;
          document.body.classList.remove("apercu-ouvert");
          if (apOrigine && document.body.contains(apOrigine)) apOrigine.focus();
          else {
            var b = document.querySelector('#band [data-doc="' + apType + '"]') || document.getElementById("afaire");
            b.focus();
          }
        }
        function enregistrerApercu() {
          var msg = "";
          if (apType === "rapport") {
            var nouv = false;
            AP.querySelectorAll("textarea").forEach(function (t) {
              var lib = t.getAttribute("data-lib"), v = t.value.trim();
              if (v && v !== (st.conclusions[lib] || "")) nouv = true;
              st.conclusions[lib] = v;
              t.removeAttribute("aria-invalid");
              t.parentNode.querySelector(".concl-err").textContent = "";
            });
            setDocs("brouillon", function (d) { return estRapport(d) && d[1] === "a_produire"; });
            /* Voie modèle : met à jour la version brouillon du modèle, sinon crée une nouvelle version */
            var nv = [];
            rapports().forEach(function (d) {
              var c = courante(d[0]);
              if (!c || !(c.origine === "modele" && c.etat === "brouillon")) nv.push(nouvelleVersion(d[0], "modele", null, false).n);
            });
            log("file-text", "Brouillon " + (rapports().length > 1 ? "des rapports" : "du rapport") + " enregistré" +
              (nv.length ? " (version " + nv.join(" et ") + ", préparée depuis le modèle du cabinet)" : "") + ".");
            if (nouv) log("pencil-line", "Conclusion saisie par " + signataire.nom + ".");
            msg = "Brouillon enregistré.";
          } else if (apType === "la") {
            setDocs("brouillon", function (d) { return estLA(d) && d[1] === "a_produire"; });
            log("file-text", "Brouillon de la lettre d'affirmation enregistré.");
            msg = "Brouillon enregistré.";
          }
          ecrire();
          rendre();
          document.getElementById("ap-msg").textContent = msg;
        }
        AP.addEventListener("input", function (ev) {
          var t = ev.target;
          if (t.tagName === "TEXTAREA") {
            var p = document.getElementById("concl-print-" + t.id.split("-")[1]);
            if (p) p.textContent = t.value;
          }
        });
        AP.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape") {
            ev.preventDefault();
            fermerApercu();
          } else if (ev.key === "Tab") {
            var f = focusables();
            if (!f.length) return;
            var first = f[0], last = f[f.length - 1];
            if (ev.shiftKey && (document.activeElement === first || document.activeElement === document.getElementById("ap-titre"))) {
              ev.preventDefault();
              last.focus();
            } else if (!ev.shiftKey && document.activeElement === last) {
              ev.preventDefault();
              first.focus();
            }
          }
        });
        AP.addEventListener("click", function (ev) {
          if (ev.target === AP) return fermerApercu();
          var b = ev.target.closest("[data-act]");
          if (!b) return;
          var a = b.getAttribute("data-act");
          if (a === "ap-fermer") fermerApercu();
          else if (a === "ap-imprimer") window.print();
          else if (a === "ap-enregistrer") enregistrerApercu();
          else if (a === "ap-joindre") confirmerJoindre();
          else if (a === "ap-remettre") confirmerRemise();
        });
        AP.addEventListener("change", function (ev) {
          if (ev.target.id === "j-fichier") {
            ev.target.removeAttribute("aria-invalid");
            document.getElementById("j-err").textContent = "";
          }
        });

        /* ---------- Délégation des clics et saisies de la page ---------- */
        var contenu = document.getElementById("contenu");
        contenu.addEventListener("input", function (ev) {
          if (ev.target.id === "hon") {
            var v = +ev.target.value;
            st.honoraires = v > 0 ? v : null;
            ev.target.removeAttribute("aria-invalid");
            document.getElementById("hon-err").textContent = "";
            ecrire();
          }
        });
        contenu.addEventListener("click", function (ev) {
          var b = ev.target.closest("[data-act]");
          if (!b || b.disabled) return;
          var a = b.getAttribute("data-act");
          if (a === "apercu") return ouvrirApercu(b.getAttribute("data-doc"), b);
          if (a === "recue" || /^p-/.test(a)) return actionPiece(a, +b.getAttribute("data-piece"));
          if (a === "joindre") return ouvrirJoindre(+b.getAttribute("data-r"), b);
          if (/^v-/.test(a)) return actionVersion(a, +b.getAttribute("data-r"));
          if (ACTIONS[a]) ACTIONS[a]();
        });

        rendre();
      });
    </script>
    <script src="assets/ej-shell.js?v=29"></script>
  </body>
