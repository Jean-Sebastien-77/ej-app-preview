<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mes sociétés · Express Juridique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/ej-app.css?v=13" />
    <style>
      .s-count {
        font-size: 14px;
        color: var(--ej-neutral-500);
        white-space: nowrap;
      }
      .s-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .s-info .row-meta {
        display: flex;
        align-items: center;
        min-height: 24px;
      }
      .s-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        color: var(--ej-neutral-500);
        white-space: nowrap;
      }
      .s-right .chev {
        margin-left: 0;
      }
      .s-more {
        display: flex;
        justify-content: center;
        margin-top: 24px;
      }
    </style>
  </head>
  <body data-active="societes">
    <div id="ej-header"></div>
    <div class="app">
      <div id="ej-sidebar"></div>
      <div class="main">
        <div class="page page-narrow">
          <div class="page-head">
            <h1 class="page-title">Mes sociétés</h1>
          </div>

          <div class="toolbar">
            <label class="search">
              <span class="ms">search</span>
              <input type="text" placeholder="Rechercher par dénomination" />
            </label>
            <span class="s-count">135 sociétés</span>
          </div>

          <div class="list-card" id="societes"></div>

          <div class="s-more">
            <button class="btn btn-secondary" type="button"><span class="ms">downloading</span>Voir plus</button>
          </div>
        </div>
        <div id="ej-footer"></div>
      </div>
    </div>
