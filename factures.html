<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mes factures · Express Juridique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/ej-app.css?v=20" />
    <style>
      .inv-main {
        flex: 1;
        min-width: 0;
        line-height: 1.5;
      }
      .inv-amount {
        font-weight: 500;
        color: var(--ej-primary-900);
      }
      .empty {
        padding: 48px 20px;
        text-align: center;
        color: var(--ej-neutral-500);
        font-size: 14px;
      }
      .empty .ms {
        font-size: 32px;
        color: var(--ej-neutral-300);
        display: block;
        margin: 0 auto 8px;
      }
    </style>
  </head>
  <body data-active="">
    <div id="ej-header"></div>
    <div class="app">
      <div id="ej-sidebar"></div>
      <div class="main">
        <div class="page page-narrow">
          <a class="back-link" href="formalites.html"><span class="ms">arrow_back</span>Retour</a>
          <div class="page-head">
            <h1 class="page-title">Mes Factures</h1>
          </div>

          <div class="tabs" role="tablist">
            <button class="tab" type="button" role="tab" data-year="2022">2022</button>
            <button class="tab" type="button" role="tab" data-year="2023">2023</button>
            <button class="tab" type="button" role="tab" data-year="2024">2024</button>
            <button class="tab" type="button" role="tab" data-year="2025">2025</button>
            <button class="tab active" type="button" role="tab" data-year="2026">2026</button>
          </div>

          <p class="muted small mb-16" id="inv-sum"></p>
          <div class="list-card" id="invoices"></div>
        </div>
        <div id="ej-footer"></div>
      </div>
    </div>

    <script>
      var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
      // Par année : mois de la première facture (0 = janvier), numéros et montants en euros, du plus ancien au plus récent.
      var RAW = {
        2022: { from: 2, n: [4, 7, 10, 12, 15, 18, 20, 22, 25, 27], a: [12, 12, 24, 12, 24, 36, 12, 24, 12, 24] },
        2023: { from: 0, n: [29, 31, 34, 36, 39, 42, 44, 47, 50, 52, 55, 57], a: [12, 12, 24, 12, 36, 24, 12, 24, 36, 12, 24, 48] },
        2024: { from: 0, n: [60, 63, 66, 69, 72, 75, 77, 80, 83, 85, 88, 90], a: [12, 24, 24, 36, 12, 48, 36, 24, 60, 36, 48, 24] },
        2025: { from: 0, n: [93, 96, 99, 103, 106, 109, 112, 116, 119, 122, 126, 129], a: [24, 36, 12, 48, 36, 60, 24, 48, 72, 36, 24, 96] },
        2026: { from: 0, n: [132, 135, 139, 142, 146, 149, 153, 156, 160, 163], a: [36, 24, 48, 36, 60, 24, 72, 24, 48, 12] },
      };
      function pad(n) {
        return ("0000" + n).slice(-4);
      }
      function euros(v) {
        var parts = v.toFixed(2).split(".");
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0");
        return parts[0] + "," + parts[1] + "\u00a0\u20ac";
      }
      // INV[année] = liste [date, numéro, montant affiché, montant], du plus récent au plus ancien.
      var INV = {};
      Object.keys(RAW).forEach(function (y) {
        var d = RAW[y];
        INV[y] = d.n.map(function (num, k) {
          return ["01 " + MOIS[d.from + k] + " " + y, "EJ-" + pad(num), euros(d.a[k]), d.a[k]];
        }).reverse();
      });
      var box = document.getElementById("invoices");
      var sum = document.getElementById("inv-sum");
      function show(year) {
        var rows = INV[year];
        if (!rows || !rows.length) {
          sum.textContent = "0 facture · " + euros(0);
          box.innerHTML = '<div class="empty"><span class="ms">receipt_long</span>Aucune facture pour cette année.</div>';
          return;
        }
        var total = rows.reduce(function (acc, r) {
          return acc + r[3];
        }, 0);
        sum.textContent = rows.length + (rows.length > 1 ? " factures" : " facture") + " · " + euros(total);
        box.innerHTML = rows.map(function (r) {
          return (
            '<div class="list-row">' +
            '<span class="list-icon"><span class="ms">receipt_long</span></span>' +
            '<div class="inv-main">' +
            '<div class="row-title">' + r[0] + "</div>" +
            '<div class="row-meta">Num. : ' + r[1] + "</div>" +
            '<div class="row-meta">Montant : <span class="inv-amount">' + r[2] + "</span></div>" +
            "</div>" +
            '<button class="btn btn-secondary btn-sm" type="button"><span class="ms">picture_as_pdf</span>Télécharger en PDF</button>' +
            "</div>"
          );
        }).join("");
      }
      var tabs = document.querySelectorAll(".tab");
      tabs.forEach(function (t) {
        t.addEventListener("click", function () {
          tabs.forEach(function (x) {
            x.classList.toggle("active", x === t);
          });
          show(t.getAttribute("data-year"));
        });
      });
      show("2026");
    </script>
    <script src="assets/ej-shell.js?v=29"></script>
  </body>
</html>
