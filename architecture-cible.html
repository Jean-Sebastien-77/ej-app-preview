<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Architecture cible EJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f7f6fc;--surface:#fff;--ink:#221c55;--muted:#57537b;--line:#cdc9e2;--navy:#312782;--accent:#5d58d7;--err:#c22f28;}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;}
main{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:16px;}
img{height:40px;align-self:flex-start;}
h1{font-family:'Sora','Inter',sans-serif;font-size:22px;line-height:1.2;margin:0;color:var(--navy);}
p{margin:0;color:var(--muted);}
form{display:flex;flex-direction:column;gap:10px;}
label{font-size:13px;font-weight:600;color:var(--ink);}
.champ{display:flex;gap:8px;}
input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
button{font:inherit;font-weight:600;border-radius:8px;cursor:pointer;}
#voir{padding:10px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:500;font-size:13px;}
#ouvrir{padding:11px 14px;border:none;background:var(--accent);color:#fff;}
#ouvrir[disabled]{opacity:.6;cursor:progress;}
#etat{min-height:1.5em;font-size:13.5px;color:var(--err);}
a{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}
</style>
</head>
<body>
<main>
  <img src="assets/ej-logo.svg" alt="Express Juridique" />
  <h1>Architecture cible</h1>
  <p>Page réservée. Saisissez le mot de passe qui vous a été transmis.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Mot de passe</label>
    <div class="champ">
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required />
      <button type="button" id="voir" aria-pressed="false">Afficher</button>
    </div>
    <button type="submit" id="ouvrir">Ouvrir</button>
    <div id="etat" role="alert"></div>
  </form>
  <a href="index.html">Retour au sommaire</a>
</main>

  }
  function deriver(mot){
    return crypto.subtle.importKey("raw",new TextEncoder().encode(mot),"PBKDF2",false,["deriveBits"])
      .then(function(m){return crypto.subtle.deriveBits({name:"PBKDF2",salt:oct(P.s),iterations:P.n,hash:"SHA-256"},m,256);})
      .then(function(bits){return new Uint8Array(bits);});
  }
  function dechiffrer(brut){
    return crypto.subtle.importKey("raw",brut,"AES-GCM",false,["decrypt"])
      .then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:oct(P.i)},k,oct(P.c));})
      .then(function(clair){return new TextDecoder().decode(clair);});
  }
  var f=document.getElementById("f"),pw=document.getElementById("pw"),voir=document.getElementById("voir"),
      ouvrir=document.getElementById("ouvrir"),etat=document.getElementById("etat");
  if(!window.crypto||!crypto.subtle){etat.textContent="Ce navigateur ne permet pas d'ouvrir cette page.";ouvrir.disabled=true;return;}
  /* Déjà ouvert dans cet onglet : on ne redemande pas le mot de passe */
  try{
    var gardee=sessionStorage.getItem(CLE);
    if(gardee){dechiffrer(oct(gardee)).then(afficher).catch(function(){try{sessionStorage.removeItem(CLE);}catch(e){}});}
  }catch(e){}
  voir.addEventListener("click",function(){
    var clair=pw.type==="password";
    pw.type=clair?"text":"password";
    voir.textContent=clair?"Masquer":"Afficher";
    voir.setAttribute("aria-pressed",clair?"true":"false");
  });
  f.addEventListener("submit",function(ev){
    ev.preventDefault();
    var mot=pw.value.trim();
    if(!mot){return;}
    ouvrir.disabled=true;etat.style.color="var(--muted)";etat.textContent="Vérification en cours.";
    deriver(mot).then(function(brut){
      return dechiffrer(brut).then(function(html){
        try{sessionStorage.setItem(CLE,b64(brut));}catch(e){}
        afficher(html);
      });
    }).catch(function(){
      ouvrir.disabled=false;etat.style.color="var(--err)";etat.textContent="Mot de passe incorrect.";
      pw.select();
    });
  });
})();
</script>
</body>
</html>
