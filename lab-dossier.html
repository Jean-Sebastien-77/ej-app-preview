<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Vigilance LAB · Missions et conformité · Express Juridique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/ej-app.css?v=20" />
    <link rel="stylesheet" href="assets/ej-missions.css?v=24" />
    <style>
      /* ---- En-tête société (repris de societe.html ; en-tête entité pour une mission CAC) ---- */
      .soc-head {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 22px 24px 22px 64px;
        margin-bottom: 24px;
      }
      .soc-motif {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 40px;
        overflow: hidden;
        border-radius: calc(var(--ej-radius-lg) - 1px) 0 0 calc(var(--ej-radius-lg) - 1px);
      }
      .soc-motif i {
        position: absolute;
        left: 0;
        height: 8px;
        border-radius: 0 var(--ej-radius-full) var(--ej-radius-full) 0;
      }
      .soc-motif .m1 {
        top: 24px;
        width: 40px;
        background: var(--ej-logo-mint);
      }
      .soc-motif .m2 {
        top: 38px;
        width: 24px;
        background: var(--ej-action-600);
      }
      .soc-name {
        font-size: 24px;
        line-height: 1.25;
        font-weight: 700;
        color: var(--ej-primary-900);
      }
      .soc-form {
        font-size: 14px;
        font-style: italic;
        color: var(--ej-neutral-500);
        margin-top: 2px;
      }
      .soc-greffe {
        font-size: 14px;
        color: var(--ej-neutral-600);
        margin-top: 2px;
      }
      .soc-greffe strong {
        font-weight: 700;
        color: var(--ej-primary-900);
      }
      .soc-ids {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        text-align: right;
        font-size: 13px;
        color: var(--ej-neutral-600);
      }

      /* Société cliente (expertise comptable) : mêmes identifiants que dans societe.html */
      .soc-head.soc-societe .soc-ids {
        display: block;
        text-align: right;
        line-height: 1.7;
        white-space: nowrap;
      }
      .soc-societe .soc-ids strong {
        font-weight: 700;
        color: var(--ej-primary-900);
      }
      .soc-societe .soc-ids .soc-siren {
        font-size: 14px;
      }
      .soc-societe .soc-ids .soc-siren strong {
        font-size: 18px;
      }

      /* ---- Résumé du statut LAB, en tête de l'onglet ---- */
      .lab-resume {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 14px;
        padding: 14px 20px;
        margin-bottom: 16px;
        font-size: 14px;
        color: var(--ej-neutral-700);
      }
      .lab-resume strong {
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .lab-resume .resp {
        margin-left: auto;
        font-size: 13px;
        color: var(--ej-neutral-600);
      }

      /* ---- Fiche LAB : styles locaux (à mutualiser si besoin) ---- */
      .d-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .d-alerts {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 16px;
      }
      .d-alerts .alert a {
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .lm-link {
        margin-bottom: 16px;
      }
      .lm-link .list-row {
        flex-wrap: wrap;
      }
      .lm-main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .lm-right {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: auto;
      }
      .lm-right .chev {
        margin-left: 0;
      }
      .lm-block {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 12px 20px;
        border-top: 1px solid var(--ej-neutral-100);
        background: var(--ej-neutral-50);
        font-size: 13px;
        color: var(--ej-neutral-700);
      }
      .lm-block .ms {
        font-size: 16px;
        margin-top: 2px;
        color: var(--ej-warning-600);
      }
      /* ---- Bloc « À faire » : les alertes, chacune avec l'action qui la règle ---- */
      .afaire {
        margin-bottom: 16px;
        outline: none;
      }
      .afaire:focus-visible {
        box-shadow: 0 0 0 2px var(--ej-action-600);
      }
      .afaire-head {
        padding: 14px 20px 4px;
      }
      .afaire-head h2 {
        font-size: 15px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .afaire-list {
        list-style: none;
        padding: 0 20px 6px;
      }
      .afaire-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px 0;
        border-top: 1px solid var(--ej-neutral-100);
      }
      .afaire-item:first-child {
        border-top: none;
      }
      .afaire-ico {
        flex-shrink: 0;
        margin-top: 1px;
        font-size: 18px;
        color: var(--ej-info-600);
      }
      .afaire-item.ok .afaire-ico {
        color: var(--ej-success-600);
      }
      .afaire-item.warn .afaire-ico {
        color: var(--ej-attention-500);
      }
      .afaire-txt {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--ej-neutral-700);
      }
      .afaire-txt strong {
        font-weight: 600;
        color: var(--ej-neutral-900);
      }
      .afaire-act {
        flex-shrink: 0;
      }
      .afaire-act .btn {
        white-space: nowrap;
      }
      .afaire-aide,
      .afaire-confirm {
        margin-top: 10px;
        padding: 12px 14px;
        border-radius: var(--ej-radius-md);
        background: var(--ej-neutral-50);
        font-size: 13.5px;
      }
      .afaire-note {
        margin-top: 4px;
        font-size: 12.5px;
        color: var(--ej-neutral-500);
      }
      .afaire-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .afaire.afaire-ok {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 20px;
      }
      .afaire-ok .afaire-ico {
        color: var(--ej-success-600);
      }
      .vide-titre {
        font-family: var(--ej-font-display);
        font-size: 15px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .lab-resume .resume-tip {
        margin-left: auto;
      }
      .lab-resume .resp + .resume-tip {
        margin-left: 0;
      }
      .d-card .block-head {
        padding-bottom: 14px;
        border-bottom: 1px solid var(--ej-neutral-100);
        align-items: center;
      }
      .d-card .block-head h2 {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .d-card .block-head h2 .ms {
        font-size: 20px;
        color: var(--ej-action-600);
      }
      .d-body {
        padding: 20px 22px 22px;
      }
      .kv-item dd {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .kv-item dd span.v {
        word-break: break-word;
      }
      .rtable {
        width: 100%;
        border-collapse: collapse;
      }
      .rtable th {
        background: var(--ej-neutral-50);
        padding: 10px 16px;
        text-align: left;
        font-family: var(--ej-font-display);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ej-neutral-500);
        border-bottom: 1px solid var(--ej-hairline);
        white-space: nowrap;
      }
      .rtable td {
        padding: 12px 16px;
        font-size: 14px;
        border-bottom: 1px solid var(--ej-neutral-100);
        vertical-align: middle;
      }
      .rtable tr:last-child td {
        border-bottom: none;
      }
      .rtable .sub {
        display: block;
        font-size: 12.5px;
        color: var(--ej-neutral-500);
        margin-top: 1px;
      }
      .rtable .nom {
        font-weight: 600;
        color: var(--ej-primary-900);
        font-family: var(--ej-font-display);
      }
      .oui-non {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13.5px;
        font-weight: 500;
      }
      .oui-non .ms {
        font-size: 16px;
      }
      .oui-non.ok {
        color: var(--ej-success-600);
      }
      .oui-non.ppe {
        color: var(--ej-action-700);
      }
      .oui-non.warn {
        color: var(--ej-warning-600);
      }
      .oui-non.muted {
        color: var(--ej-neutral-500);
      }
      .val-sub {
        display: block;
        margin-top: 2px;
        font-size: 12.5px;
        font-weight: 400;
        color: var(--ej-neutral-500);
      }
      .oblig {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--ej-neutral-100);
      }
      .oblig h3 {
        font-family: var(--ej-font-display);
        font-size: 14px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .oblig-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 6px 16px;
        padding: 10px 0;
        border-bottom: 1px solid var(--ej-neutral-100);
      }
      .oblig-row:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .oblig-txt {
        min-width: 0;
        flex: 1 1 260px;
      }
      .oblig-lib {
        font-size: 14.5px;
        font-weight: 500;
        color: var(--ej-neutral-900);
      }
      .oblig-det {
        font-size: 12.5px;
        color: var(--ej-neutral-500);
      }
      #absent {
        margin-top: 8px;
      }
      .vide {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 22px;
        border: 1px dashed var(--ej-neutral-300);
        border-radius: var(--ej-radius-lg);
        background: var(--ej-neutral-50);
      }
      .vide strong {
        font-family: var(--ej-font-display);
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .vide p {
        font-size: 14px;
        color: var(--ej-neutral-600);
      }
      .resultat {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-top: 18px;
        padding: 16px 18px;
        border: 1px solid var(--ej-action-200);
        border-radius: var(--ej-radius-lg);
        background: var(--ej-action-50);
      }
      .resultat .overline {
        display: block;
        margin-bottom: 4px;
      }
      .resultat .val {
        font-size: 14.5px;
        font-weight: 500;
        color: var(--ej-neutral-900);
      }
      .resultat .val .risk {
        font-size: 15px;
        font-weight: 600;
      }
      .pieces {
        display: flex;
        flex-direction: column;
      }
      .piece {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 0;
        border-bottom: 1px solid var(--ej-neutral-100);
      }
      .piece:first-child {
        padding-top: 0;
      }
      .piece .etat {
        width: 24px;
        height: 24px;
        font-size: 22px;
      }
      .piece .etat.recu {
        color: var(--ej-success-600);
      }
      .piece .etat.manque {
        color: var(--ej-neutral-400);
      }
      .piece .txt {
        min-width: 0;
        flex: 1;
      }
      .piece .lib {
        font-size: 14.5px;
        font-weight: 500;
        color: var(--ej-neutral-900);
      }
      .piece .det {
        font-size: 12.5px;
        color: var(--ej-neutral-500);
      }
      .piece .det.warn {
        color: var(--ej-warning-600);
      }
      .piece .badge {
        flex-shrink: 0;
      }
      .lab-resume .resume-par {
        font-size: 13px;
        color: var(--ej-neutral-600);
      }
      /* ---- Gel des avoirs et PPE : deux lignes distinctes ---- */
      .crib-row:first-child {
        padding-top: 0;
      }
      .crib-row .oblig-det + .oblig-det {
        margin-top: 2px;
      }
      .crib-row .oui-non {
        flex-wrap: wrap;
        max-width: 100%;
      }
      .crib-row .oui-non .val-sub {
        flex-basis: 100%;
        padding-left: 22px;
      }

      /* ---- Panneau de revue (dans la fiche, sous « À faire ») ---- */
      .rv {
        margin-bottom: 16px;
      }
      .rv-head {
        padding: 18px 22px 12px;
        border-bottom: 1px solid var(--ej-neutral-100);
      }
      .rv-head h2 {
        font-size: 17px;
        font-weight: 600;
        color: var(--ej-primary-900);
        outline: none;
      }
      .rv-head h2:focus-visible {
        outline: 2px solid var(--ej-action-600);
        outline-offset: 3px;
        border-radius: var(--ej-radius-sm);
      }
      .rv-head p {
        margin-top: 2px;
        font-size: 13px;
        color: var(--ej-neutral-500);
      }
      .rv-part {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--ej-neutral-100);
      }
      .rv-h {
        font-family: var(--ej-font-display);
        font-size: 14px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .rv-chg {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .rv-chg li {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 2px 12px;
        font-size: 14px;
      }
      .rv-date {
        padding-top: 1px;
        font-size: 12.5px;
        font-style: italic;
        color: var(--ej-action-600);
      }
      .rv-evt {
        color: var(--ej-neutral-900);
      }
      .rv-src {
        grid-column: 2;
        justify-self: start;
        font-size: 12.5px;
        color: var(--ej-neutral-500);
      }
      a.rv-src {
        color: var(--ej-primary-600);
      }
      .rv-vide,
      .rv-sum {
        font-size: 14px;
        color: var(--ej-neutral-700);
      }
      .rv-gel {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font-size: 13.5px;
        color: var(--ej-neutral-700);
      }
      .rv-gel .ms {
        flex-shrink: 0;
        margin-top: 2px;
        font-size: 16px;
        color: var(--ej-success-600);
      }
      .rv-lien {
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        font-weight: 600;
        color: var(--ej-action-600);
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .rv-lien:focus-visible,
      .radio input:focus-visible {
        outline: 2px solid var(--ej-action-600);
        outline-offset: 2px;
        border-radius: var(--ej-radius-sm);
      }
      .radio input:focus-visible {
        border-radius: 50%;
      }
      .rv-crits {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .rv-crits[hidden] {
        display: none;
      }
      .rv-crit {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .rv-crit select,
      .rv textarea,
      .lv select {
        width: 100%;
        min-width: 0;
      }
      .rv textarea {
        resize: vertical;
      }
      .rv-lbl {
        font-family: var(--ej-font-display);
        font-size: 13px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .rv-poids {
        font-family: var(--ej-font-body);
        font-size: 12px;
        font-weight: 400;
        color: var(--ej-neutral-500);
      }
      .rv-choix,
      .lv-el {
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      .rv-choix legend,
      .lv-el legend {
        margin-bottom: 8px;
        padding: 0;
      }
      .rv-radios {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 22px;
      }
      .rv-radios.rv-col {
        flex-direction: column;
      }
      .rv-note {
        font-size: 13px;
        color: var(--ej-neutral-600);
      }
      .rv-sign {
        font-size: 12.5px;
        font-style: italic;
        color: var(--ej-neutral-500);
      }
      .rv-live {
        font-size: 13px;
        font-weight: 500;
        color: var(--ej-warning-600);
      }
      .rv-foot {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px 22px 18px;
      }
      .rv-bloc {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font-size: 13.5px;
        color: var(--ej-warning-600);
      }
      .rv-bloc .ms {
        flex-shrink: 0;
        margin-top: 2px;
        font-size: 16px;
      }
      .rv .check {
        font-size: 13.5px;
      }
      .rv-dv {
        background: var(--ej-neutral-50);
      }
      .afaire-fin .afaire-ico {
        color: var(--ej-neutral-500);
      }
      .piece .btn-tertiary {
        flex-shrink: 0;
      }
      .dropzone .dz-champ {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        text-align: left;
      }
      .dropzone select {
        max-width: 100%;
      }
      .dz-file {
        position: relative;
        cursor: pointer;
      }
      .dz-input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      .dz-file:focus-within {
        outline: 2px solid var(--ej-action-600);
        outline-offset: 3px;
        border-radius: var(--ej-radius-sm);
      }
      .dropzone.dz-on {
        border-color: var(--ej-action-600);
        background: var(--ej-action-50);
      }
      .rv-opt {
        display: inline-flex;
        align-items: flex-start;
        gap: 4px;
      }
      .rv-ppe {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid var(--ej-hairline);
        border-radius: var(--ej-radius-md);
        background: var(--ej-neutral-50);
      }
      .rv-ppe legend {
        float: left;
        width: 100%;
        margin-bottom: 0;
      }
      abbr[title] {
        text-decoration: underline dotted;
        text-underline-offset: 2px;
        cursor: help;
      }
      .rv-btns {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      /* ---- Levée d'homonymie (dans le bloc « À faire ») ---- */
      .lv {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 10px;
        padding: 14px 16px;
        border: 1px solid var(--ej-hairline);
        border-radius: var(--ej-radius-md);
        background: var(--ej-neutral-50);
        font-size: 13.5px;
      }
      .lv-titre,
      .lv-el legend {
        font-family: var(--ej-font-display);
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ej-primary-900);
      }
      .lv-pers {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 16px;
      }
      .lv-pers dt {
        font-size: 12px;
        color: var(--ej-neutral-500);
      }
      .lv-pers dd {
        font-weight: 500;
        color: var(--ej-neutral-900);
      }
      .lv-vals {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
        margin-bottom: 8px;
        color: var(--ej-neutral-600);
      }
      .lv-vals strong {
        font-weight: 500;
        color: var(--ej-neutral-900);
      }
      .lv-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 380px;
      }
      .lv .afaire-btns {
        margin-top: 0;
      }
      .afaire-txt .lv-alerte {
        margin-top: 10px;
      }
      .lv .lv-alerte {
        margin-top: 0;
      }
      .dropzone {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 18px;
        padding: 22px 20px;
        border: 2px dashed var(--ej-neutral-300);
        border-radius: var(--ej-radius-lg);
        background: var(--ej-white);
        font-size: 14px;
        color: var(--ej-neutral-600);
        text-align: center;
        transition: border-color var(--ej-transition-fast), background var(--ej-transition-fast);
      }
      .dropzone:hover {
        border-color: var(--ej-action-600);
        background: var(--ej-action-50);
      }
      .dropzone .ms {
        color: var(--ej-action-600);
      }
      .dropzone u {
        text-decoration-color: var(--ej-action-300);
        text-underline-offset: 2px;
        color: var(--ej-action-600);
        font-weight: 500;
      }
      .revues {

    <script src="assets/ej-missions-data.js?v=28"></script>
    <script src="assets/ej-cockpit-data.js?v=10"></script>
    <script src="assets/ej-dpj-data.js?v=2"></script>
    <script src="assets/ej-lab.js?v=7"></script>
    <script>
      (function () {
        var E = window.EJM,
          DP = window.EJDPJ,
          X = window.EJLAB,
          esc = E.esc;
        function $(i) {
          return document.getElementById(i);
        }
        /* Note secondaire derrière un « i » cerclé (survol, focus clavier, toucher) */
        function tip(id, texte, label, cls) {
          return '<span class="info-tip' + (cls ? " " + cls : "") + '">' +
            '<button type="button" class="info-tip-btn" aria-describedby="note-ld-' + id + '" aria-label="' + esc(label || "Information") + '"><span class="ms">info</span></button>' +
            '<span class="info-tip-pop" role="tooltip" id="note-ld-' + id + '">' + esc(texte) + "</span></span>";
        }

        /* ---------- Profil de cabinet (ec, cac, mixte) ----------
           Le shell pose body[data-profil] et window.EJ_USER après ce script : on lit donc la même clé du navigateur,
           et l'utilisateur connecté est lu au DOMContentLoaded. */
        var PROFIL = "ec";
        try {
          var sv = localStorage.getItem("ej-profil");
          if (sv === "ec" || sv === "cac" || sv === "mixte") PROFIL = sv;
        } catch (e) {}
        /* Élision : « d'AXIOME », « de KPL3D » (le h de HELIOS et d'HÔTEL est muet) */
        function de(nom) {
          return /^[aeiouyhàâäéèêëîïôöùûü]/i.test(nom) ? "d'" + nom : "de " + nom;
        }
        /* Sigle développé à sa première occurrence visible (les textes sont générés dans l'ordre de la page) */
        var SIGLES = {
          DPJ: "Dossier permanent juridique (DPJ)",
          RNE: "registre national des entreprises (RNE)",
          RBE: "registre des bénéficiaires effectifs (RBE)",
          RNA: "répertoire national des associations (RNA)",
          PPE: "personne politiquement exposée (PPE)",
        };
        var vus = {};
        function sg(k, forme) {
          if (vus[k]) return k;
          vus[k] = true;
          return forme || SIGLES[k];
        }
        /* ---------- Dossier affiché (sans paramètre : PAPRIKA en ec et mixte, comme societe.html ; VERTALIS en cac ; id inconnu : « introuvable ») ---------- */
        var params = new URLSearchParams(location.search);
        var id = params.get("id");
        var depuisFile = params.get("from") === "lab";
        function parId(liste, k) {
          return liste.filter(function (x) { return x.id === k; })[0];
        }
        /* Cherche parmi les sociétés clientes (expertise comptable), les entités contrôlées et les missions ponctuelles (CAC) */
        var s = id === null
          ? PROFIL === "cac" ? parId(E.mandats, "vertalis") : parId(E.societes, "paprika")
          : X.trouver(id);
        var cac = !!s && X.estCAC(s);
        /* Société du DPJ sans dossier LAB (hors des clients du dispositif) */
        var fDpj = !s && id !== null ? DP.byId(id) : null;
        /* Dossier du dispositif pas encore ouvert : même rendu qu'une société sans dossier LAB */
        var aOuvrir = !!s && s.lab.statut === "a_ouvrir";
        /* Entrée de menu : Sociétés pour une société cliente, Missions CAC pour une entité contrôlée.
           Posée ici, avant ej-shell.js (chargé en fin de page), qui lit data-active à son exécution. */
        if (depuisFile && (s || fDpj)) document.body.setAttribute("data-active", "lab");
        else if (cac) document.body.setAttribute("data-active", "cac");
        else if (s || fDpj) document.body.setAttribute("data-active", "societes");
        if (s ? !cac : !!fDpj) $("page").classList.add("page-narrow");
        /* Dossier d'une mission que le profil n'exerce pas (ouvert par un lien direct) */
        var horsProfil = (PROFIL === "cac" && !cac) || (PROFIL === "ec" && cac);
        /* Sigles : le premier usage visible de la page porte une abréviation accessible (sauf s'il est déjà développé) */
        var ABBR = { LAB: "lutte anti-blanchiment", PPE: "personne politiquement exposée", RBE: "registre des bénéficiaires effectifs", RNE: "registre national des entreprises", DPJ: "dossier permanent juridique" };
        function abreger() {
          var root = $("page"), faits = {};
          Array.prototype.forEach.call(root.querySelectorAll("abbr"), function (a) { faits[a.textContent] = true; });
          var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
          var noeuds = [], n;
          while ((n = w.nextNode())) noeuds.push(n);
          noeuds.forEach(function (t) {
            var par = t.parentNode;
            if (!par || par.closest(".info-tip-pop, [hidden], option, select, textarea, abbr, script, style, .ms, .oui-non, .badge, .risk")) return;
            Object.keys(ABBR).forEach(function (k) {
              if (faits[k] || !t.parentNode) return;
              var v = t.nodeValue;
              if (v.indexOf("(" + k + ")") !== -1) {
                faits[k] = true;
                return;
              }
              var m = new RegExp("\\b" + k + "\\b").exec(v);
              if (!m) return;
              faits[k] = true;
              var apres = t.splitText(m.index);
              apres.splitText(k.length);
              var ab = document.createElement("abbr");
              ab.title = ABBR[k];
              ab.textContent = k;
              apres.parentNode.replaceChild(ab, apres);
              t = ab.nextSibling || t;
            });
          });
        }
        function neutraliser() {
          document.querySelectorAll('a[href="#"]').forEach(function (a) {
            if (a.dataset.neutre) return;
            a.dataset.neutre = "1";
            a.addEventListener("click", function (e) { e.preventDefault(); });
          });
          abreger();
        }

        /* Lien retour : vers la file LAB (même filtre, même recherche) quand on en vient, sinon vers la liste d'origine */
        function lienRetour(lib, href) {
          var b = $("back");
          if (depuisFile) {
            var qs = "";
            var pf = params.get("f"), pq = params.get("q");
            if (pf !== null || pq !== null) {
              var u = new URLSearchParams();
              if (pf && /^[a-z]+$/.test(pf)) u.set("f", pf);
              if (pq && pq.trim()) u.set("q", pq.trim());
              qs = u.toString() ? "?" + u.toString() : "";
            } else {
              try {
                qs = sessionStorage.getItem("ej-lab-file") || "";
              } catch (e) {}
              if (!/^(\?[\w%.+=&-]*)?$/.test(qs)) qs = "";
            }
            lib = "Dispositif LAB";
            href = "lab.html" + qs;
          }
          /* Venu de la fiche de mission CAC : retour vers elle */
          if (!depuisFile && params.get("from") === "mission" && s && cac) {
            if (X.estPonctuelle(s)) {
              lib = (E.NATURE[s.nature] || "Mission") + " · " + s.nom;
              href = "cac-mission.html?id=" + encodeURIComponent(s.id);
            } else {
              lib = "Mission · " + s.nom;
              href = "cac-mandat.html?id=" + encodeURIComponent(s.id);
            }
          }
          b.innerHTML = '<span class="ms">chevron_left</span>' + esc(lib);
          b.href = href;
        }

        /* ---------- En-têtes et onglets (mêmes que societe.html et cac-mandat.html) ---------- */
        var FORMES_LONG = {
          SAS: "SAS, société par actions simplifiée",
          SARL: "SARL, société à responsabilité limitée",
          SA: "SA, société anonyme",
          SCI: "SCI, société civile immobilière",
          SCP: "SCP, société civile professionnelle",
          SCCV: "SCCV, société civile de construction vente",
          SELARL: "SELARL, société d'exercice libéral à responsabilité limitée",
        };
        /* Villes du siège sans greffe de tribunal de commerce propre : greffe du ressort */
        var GREFFES = { "Boulogne-Billancourt": "Nanterre", Cergy: "Pontoise", "Saint-Raphaël": "Fréjus" };
        function enteteSociete(f) {
          var ville = f.siege && f.siege.ville ? f.siege.ville : "";
          var greffe = ville ? (GREFFES[ville] || ville).toUpperCase() : "";
          return (
            '<div class="soc-motif" aria-hidden="true"><i class="m1"></i><i class="m2"></i></div>' +
            "<div>" +
            '<h1 class="soc-name">' + esc(f.nom) + "</h1>" +
            '<div class="soc-form">' + esc(FORMES_LONG[f.forme] || f.forme) + "</div>" +
            '<div class="soc-greffe">' + (greffe ? "Greffe : <strong>" + esc(greffe) + "</strong>" : "") + "</div>" +
            "</div>" +
            '<div class="soc-ids">' +
            '<div class="soc-siren">SIREN : <strong>' + esc(f.siren || "En cours de création") + "</strong></div>" +
            "<div>Date d'immatriculation : <strong>" + esc(f.immatriculation || "En attente") + "</strong></div></div>"
          );
        }
        function ongletsSociete(sid) {
          var q = "?id=" + encodeURIComponent(sid);
          return (
            '<a class="tab" href="societe.html' + q + '">Formalités</a>' +
            '<a class="tab" href="societe-registres.html' + q + '">Registres</a>' +
            '<a class="tab active" aria-current="page" href="lab-dossier.html' + q + '">Vigilance LAB</a>' +
            '<a class="tab tab-spacer" href="#"><span class="ms">settings</span>Paramètres</a>'
          );
        }
        function afficherSociete(f) {
          lienRetour("Mes sociétés", "societes.html");
          var h = $("head");
          h.className = "card soc-head soc-societe";
          h.innerHTML = enteteSociete(f);
          $("tabs").innerHTML = ongletsSociete(f.id);
        }
        function afficherEntite(m) {
          var FORMES_CAC = { SA: ", société anonyme", SAS: ", société par actions simplifiée", SARL: ", société à responsabilité limitée", Association: "" };
          if (X.estPonctuelle(m)) {
            /* Mission ponctuelle : en-tête de la fiche mission (cac-mission.html), onglets Mission · Vigilance LAB */
            lienRetour("Missions CAC", "cac.html?vue=ponctuelles");
            var fin = m.etape === "termine";
            $("head").innerHTML =
              '<div class="soc-motif" aria-hidden="true"><i class="m1"></i><i class="m2"></i></div>' +
              "<div>" +
              '<h1 class="soc-name">' + esc(m.nom) + "</h1>" +
              '<div class="soc-form">' + esc(m.forme) + esc(FORMES_CAC[m.forme] || "") + " · " + esc(X.activite(m)) + "</div>" +
              '<div class="soc-greffe">SIREN : <strong>' + esc(m.siren) + "</strong> · Signataire : <strong>" + esc(E.equipe[m.signataire].nom) + "</strong></div>" +
              "</div>" +
              '<div class="soc-ids"><span class="badge badge-brand">' + esc(E.NATURE[m.nature]) + "</span>" +
              '<span class="badge ' + (fin ? "badge-success" : "badge-progress") + '">' + (fin ? "Terminée" : "Étape : " + esc(E.ETAPE[m.etape])) + "</span></div>";
            $("tabs").innerHTML =
              '<a class="tab" href="cac-mission.html?id=' + encodeURIComponent(m.id) + '">Mission</a>' +
              '<a class="tab active" aria-current="page" href="lab-dossier.html?id=' + encodeURIComponent(m.id) + '">Vigilance LAB</a>';
            return;
          }
          /* Entité contrôlée : en-tête de la fiche mission (cac-mandat.html), onglets Mission · Vigilance LAB */
          lienRetour("Missions CAC", "cac.html");
          var cls = m.ex.phase === "acceptation" ? "badge-action" : m.ex.phase === "emis" ? "badge-success" : "badge-progress";
          $("head").innerHTML =
            '<div class="soc-motif" aria-hidden="true"><i class="m1"></i><i class="m2"></i></div>' +
            "<div>" +
            '<h1 class="soc-name">' + esc(m.nom) + "</h1>" +
            '<div class="soc-form">' + esc(m.forme) + esc(FORMES_CAC[m.forme] || "") + " · " + esc(m.activite) + "</div>" +
            '<div class="soc-greffe">SIREN : <strong>' + esc(m.siren) + "</strong> · Signataire : <strong>" + esc(E.equipe[m.signataire].nom) + "</strong></div>" +
            "</div>" +
            '<div class="soc-ids"><span class="type">' + esc(E.TYPE_MANDAT[m.type]) + "</span>" +
            "<span>Exercice clos le " + m.ex.clos + '</span><span class="badge ' + cls + '">' + E.PHASE[m.ex.phase] + "</span></div>";
          $("tabs").innerHTML =
            '<a class="tab" href="cac-mandat.html?id=' + encodeURIComponent(m.id) + '">Mission</a>' +
            '<a class="tab active" aria-current="page" href="lab-dossier.html?id=' + encodeURIComponent(m.id) + '">Vigilance LAB</a>';
        }

        /* ---------- Pas de dossier LAB (société du DPJ hors dispositif, ou dossier à ouvrir) ---------- */
        function rendreSansDossier(f, entite) {
          document.title = f.nom + " · Vigilance LAB · Express Juridique";
          if (entite) afficherEntite(entite);
          else afficherSociete(f);
          $("lab-corps").hidden = true;
          var nl = $("nolab");
          nl.hidden = false;
          var dvus = {};
          function sgd(k, forme) {
            if (dvus[k]) return k;
            dvus[k] = true;
            return forme;
          }
          function pct(v) { return String(v).replace(".", ",") + " %"; }
          function srcD() {
            return entite
              ? '<span class="source"><span class="ms">briefcase</span>RNE · INPI, dossier de la mission CAC</span>'
              : '<span class="source"><span class="ms">database</span>DPJ · mis à jour le ' + esc(DP.maj) + "</span>";
          }
          var ponct = !!entite && X.estPonctuelle(entite);
          var assocs = f.associes || [];
          var probables = assocs.filter(function (a) { return a.pct > 25 || a.indirect; });
          var sousSeuil = assocs.filter(function (a) { return !(a.pct > 25 || a.indirect); });
          var morales = assocs.filter(function (a) { return a.morale; });
          var dirs = f.dirigeants || [];
          var corpsDir = dirs.length
            ? dirs.map(function (d) { return '<span class="v">' + esc(d.nom) + ", " + esc(String(d.fonction || "").toLowerCase()) + "</span>"; }).join("")
            : '<span class="v muted">Aucun dirigeant renseigné au DPJ</span>';
          var corpsBE;
          if (!assocs.length) {
            corpsBE = entite
              ? '<p class="xs muted">Les bénéficiaires effectifs sont repris du ' + sgd("RBE", "registre des bénéficiaires effectifs (RBE)") + " à l'ouverture, puis confirmés par l'attestation signée du dirigeant.</p>"
              : '<p class="xs muted">Aucun associé renseigné au ' + sgd("DPJ", "Dossier permanent juridique (DPJ)") + ". Les bénéficiaires effectifs sont à rechercher dans le " + sgd("RBE", "registre des bénéficiaires effectifs (RBE)") + ".</p>";
          } else {
            corpsBE =
              (probables.length
                ? '<div class="table-scroll"><table class="rtable"><thead><tr><th>Nom</th><th>Détention ou contrôle</th><th>Source</th></tr></thead><tbody>' +
                  probables.map(function (a) {
                    return "<tr>" +
                      '<td class="cell-main" data-label="Nom"><span class="nom">' + esc(a.nom) + "</span></td>" +
                      '<td data-label="Détention">' + esc(pct(a.pct)) + " du capital et des droits de vote" + (a.indirect ? " (détention indirecte, via une société)" : "") + "</td>" +
                      '<td data-label="Source">' + srcD() + "</td></tr>";
                  }).join("") + "</tbody></table></div>"
                : '<p class="xs muted">Aucun associé au-dessus du seuil : à défaut, le représentant légal est retenu.</p>') +

            out.push(carte("scan-search", "Gel des avoirs et personnes politiquement exposées", "", "", corpsCrib, "criblage"));

            /* 3. Évaluation du risque : critères de la grille (proposition), niveau retenu par le professionnel */

            /* Périodicité : affichée ici seulement */
            var perVal;

            else if (L.risque) perVal = chaque(GRILLE_MOIS[L.risque]) + " " + tip("periodicite", "Selon la grille du cabinet, fixée à la validation.", "Périodicité de revue");

                (L.ppe && L.risque === "eleve" ? '<span class="val-sub">Motif : personne politiquement exposée (' + esc(BE.length ? BE[0][0] : dirNom) + ")</span>" : "") + "</div></div>" +
                '<div><span class="overline">Vigilance</span><div class="val">' + VIG[L.risque] + (L.risque === "faible" ? " " + tip("vigilance-faible", "Faculté sous conditions, à justifier au dossier.", "Vigilance simplifiée") : "") + "</div></div>" +

              : '<div class="resultat"><div style="grid-column:1/-1"><span class="overline">Niveau de risque</span><div class="val">Non évalué. Évaluation possible après identification des bénéficiaires effectifs.</div></div></div>';
            out.push(carte("scale", "Évaluation du risque", "", "",
              '<div class="table-scroll"><table class="rtable"><thead><tr><th>Critère</th><th>Valeur retenue</th><th>Poids</th><th>Niveau</th></tr></thead><tbody>' + ligneCrit + "</tbody></table></div>" +
              resultat, "evaluation", "Critères de la grille du " + E.cabinet + " : une proposition. Le niveau de risque est retenu par le professionnel à chaque revue."));

            /* 4. Pièces justificatives : reprises d'EJ (cochées), puis pièces demandées au client (assets/ej-lab.js) */
            var REP = X.piecesReprises(s), DEM = X.etatDemandees(s);
            var peutRecevoir = !!L.ouverture && !fin;
            var piecesHtml = REP.map(function (p, i) {
              return '<div class="piece"><span class="ms etat recu" aria-hidden="true">circle-check</span>' +
                '<div class="txt"><div class="lib">' + esc(p[0]) + "</div>" +

                '<span class="badge badge-brand">Repris d\'EJ</span></div>';
            }).join("") + DEM.map(function (e) {
              var recue = e.recue;
              var det = e.det ? esc(e.det) : "";

              var etat = e.marquee
                ? (e.marquee.fichier ? "Déposée le " + dE + " · " + esc(e.marquee.fichier) : "Reçue le " + dE + " · marquée par " + esc(e.marquee.par))
                : recue
                ? (e.lib === X.ATTESTATION ? "Signée électroniquement le " + dE + (e.renouvelee ? " · renouvelée pour la revue" : "") : "Reçue le " + dE + (det ? " · " + det : ""))

              : "";
            out.push(carte("file-check", "Pièces justificatives",
              nRec + " pièce" + (nRec > 1 ? "s" : "") + " reçue" + (nRec > 1 ? "s" : "") + " sur " + P[1] + " attendues" + (REP.length ? ", dont " + REP.length + " reprise" + (REP.length > 1 ? "s" : "") + " d'EJ" : ""),

            /* 5. Diligences et historique (validations passées attribuées de façon stable) */
            var J = [];

            function ajoute(d, i, t, w, warn) { J.push({ d: d, i: i, t: t, w: w, warn: !!warn, n: J.length }); }
            if (!L.ouverture) {

            } else {
              var OUV = X.ouvertureSession(s.id);
              ajoute(L.ouverture, "folder-open", cac ? "Ouverture du dossier et pré-remplissage depuis les registres et le dossier de la mission CAC." : "Ouverture du dossier et pré-remplissage depuis le DPJ.", esc(OUV && OUV.par ? OUV.par : resp.nom));
              if (REP.length) ajoute(L.ouverture, "database", "Pièces reprises d'EJ : " + REP.map(function (p) { return p[0]; }).join(", ") + ".", "Express Juridique");
              if (rAvant) {

                } else ajoute(L.ouverture, "scale", "Niveau de risque proposé : " + E.RISQUE[rAvant].toLowerCase() + ".", esc(resp.nom));

              var di = X.demandeInitiale(s);
              if (di) ajoute(di.date, "mail", "Demande de pièces envoyée au client (" + di.n + " manquante" + (di.n > 1 ? "s" : "") + ").", esc(resp.nom));
              if (att && (att.date || att.ancienne)) ajoute(att.date || att.ancienne, "file-signature", "Attestation PPE et bénéficiaires effectifs " + (att.renouvelee ? "renouvelée pour la revue, " : "") + "signée par " + dirNom + (L.ppe ? " : PPE déclarée (" + (ppeNom || dirNom) + ")." : " : aucune PPE déclarée."), "Signature électronique · jesignexpert.com");
              if (criblee) {
                if (homonymie || confirme || levee) ajoute(L.criblage, "shield-alert", "Gel des avoirs : correspondance possible sur " + homNom + " au contrôle quotidien, à lever.", "Registre national des gels · DG Trésor", true);
                else if (!BE.length) ajoute(L.criblage, "shield-check", "Gel des avoirs : société et dirigeant contrôlés, aucune correspondance. Bénéficiaires effectifs contrôlés dès leur identification.", "Registre national des gels · DG Trésor", true);
                else ajoute(L.criblage, "shield-check", "Gel des avoirs : contrôle quotidien, aucune correspondance (dernier contrôle).", "Registre national des gels · DG Trésor");
              }

              if (H.prochaineRevue && dt(H.prochaineRevue) < TODAY)
                ajoute(H.prochaineRevue, "history", "Revue échue : notification envoyée au responsable du dossier.", "Automatique", true);
              /* Actions de la session */
              X.collectesDe(s.id).forEach(function (c) {
                ajoute(c.date, "send", "Collecte envoyée à " + c.destinataire + " : " + c.pieces.length + " pièce" + (c.pieces.length > 1 ? "s" : "") + " demandée" + (c.pieces.length > 1 ? "s" : "") + " (" + c.pieces.join(", ") + ").", esc(c.par || "Cabinet"));
              });
              var MQ = X.piecesMarquees(s.id);
              Object.keys(MQ).forEach(function (lib) {
                var m = MQ[lib];
                ajoute(m.date, "file-check", m.fichier ? "Pièce déposée : " + lib + " (" + m.fichier + ")." : "Pièce reçue : " + lib + ".", esc(m.par || "Cabinet"));
              });
              X.relancesDe(s.id).forEach(function (r) {
                ajoute(r.date, "bell-ring", "Relance du client pour la collecte de pièces (aucune pièce ajoutée).", esc(r.par || "Cabinet"));
              });
              if (DV) ajoute(DV.date, "send", "Revue préparée (" + X.libConclusion(DV.conclusion).toLowerCase() + ", " + E.RISQUE[DV.risque].toLowerCase() + "), validation demandée à " + DV.a + "." + (DV.commentaire ? " Commentaire : " + DV.commentaire : ""), esc(DV.par));
              if (DV && DV.renvoi) ajoute(DV.renvoi.date, "undo-2", "Revue renvoyée à " + DV.par + " : " + DV.renvoi.commentaire, esc(DV.renvoi.par), true);
              if (RS) {

                ajoute(RS.date, RS.conclusion === "fin" ? "circle-off" : "badge-check", "Revue validée : " + X.libConclusion(RS.conclusion).toLowerCase() + ", " + E.RISQUE[RS.risque || L.risque].toLowerCase() + " retenu." +
                  (mods.length ? " Critères modifiés : " + mods.join(", ").toLowerCase() + "." : "") +
                  (RS.ajustement ? " Périodicité de " + libPeriode(RS.mois) + " reconduite (" + RS.ajustement + ")." : "") +
                  (RS.verifPPE ? " Vérification PPE par le cabinet : " + libVerif(RS.verifPPE) + "." : "") +
                  (RS.commentaire ? " Commentaire : " + RS.commentaire : "") +
                  (RS.prochaine ? " Prochaine revue le " + RS.prochaine + "." : " Relation terminée : aucune prochaine revue."), esc(RS.par));
              }
            }
            J.sort(function (x, y) { return dt(y.d) - dt(x.d) || y.n - x.n; });
            var parDerniere = RS ? RS.par : L.derniereRevue ? HV.nom : "";
            var revueHtml = '<div class="revues">' +
              '<div><span class="overline">Dernière revue</span><div class="val">' + (L.derniereRevue ? L.derniereRevue + (parDerniere ? '<span class="norm">par ' + esc(parDerniere) + "</span>" : "") : '<span class="muted">Jamais validée</span>') + "</div></div>" +
              '<div><span class="overline">Prochaine revue</span><div class="val">' + (fin ? '<span class="muted">Aucune, relation terminée</span>' : L.prochaineRevue ? L.prochaineRevue + (enRetard ? '<span class="late">En retard de ' + retardJ + " jours</span>" : "") : '<span class="muted">Fixée à la validation</span>') + "</div></div>" +
              '<div><span class="overline">Validation</span><div class="val">' + esc(V.nom) + tipValideur(V, "revue-rlab") +
              '<span class="norm">' + (V.responsableLab ? libRLAB() : esc(E.equipe[V.code].role)) + "</span></div></div></div>";
            out.push(carte("history", "Diligences et historique", "", "",
              revueHtml +
              '<ul class="journal" id="journal">' + J.map(function (j) {
                return '<li><span class="j-ico' + (j.warn ? " warn" : "") + '"><span class="ms">' + j.i + "</span></span>" +
                  '<div><div class="j-date">' + j.d + '</div><div class="j-txt">' + esc(j.t) + '</div><div class="j-who">' + j.w + "</div></div></li>";
              }).join("") + "</ul>", "historique", "Journal daté des actions menées sur ce dossier."));

            $("sections").innerHTML = out.join("");
            rendreRevue();
            neutraliser();
          }

          rendre();

          /* ---------- Interactions (délégation : le contenu est redessiné après chaque action) ---------- */
          function focusApres(sel) {
            var el = document.querySelector(sel);
            if (el) el.focus();
          }
          function ouvrirRevue() {
            var DV = X.demandeValidation(s.id);
            /* Périodicité ajustée lors de la dernière revue (écart avec la grille) : reconduite par défaut */
            var moisAct = X.periodiciteMois(L);
            var adj = !!(L.risque && moisAct && GRILLE_MOIS[L.risque] !== moisAct);
            ui.rv = {
              crit: false,
              criteres: DV && DV.criteres ? JSON.parse(JSON.stringify(DV.criteres)) : {},
              risque: (DV && DV.risque) || L.risque || "standard",
              conclusion: (DV && DV.conclusion) || X.conclusions(s)[0][0],
              ppeSrc: DV && DV.verifPPE ? DV.verifPPE.source : SOURCES_PPE[0],
              /* Option Pappers KYC active : résultat pré-rempli ; sinon, le professionnel le renseigne */
              ppeRes: DV && DV.verifPPE ? DV.verifPPE.resultat || "confirmee" : X.kycPappers ? (L.ppe ? "confirmee" : "aucune") : null,
              commentaire: (DV && DV.commentaire) || "",
              moisAdj: adj ? moisAct : 0,
              motifAdj: adj ? MOTIFS[s.id] || "décision du professionnel" : "",
              reconduire: adj && (!DV || !!DV.mois),
            };
          }
          function optionsRevue() {
            return {
              code: USER_CODE,
              risque: ui.rv.risque,
              conclusion: ui.rv.conclusion,
              commentaire: ui.rv.commentaire.trim(),
              criteres: criteresModifies(),
              mois: ui.rv.reconduire ? ui.rv.moisAdj : 0,
              ajustement: ui.rv.reconduire ? ui.rv.motifAdj : "",
              verifPPE: ui.rv.ppeRes ? { resultat: ui.rv.ppeRes, source: ui.rv.ppeSrc, date: E.today, par: USER.nom } : null,
            };
          }
          /* PPE : la vérification du cabinet est requise avant de valider ou de transmettre la revue */
          function verifPPEManquante() {
            if (ui.rv.ppeRes) return false;
            var r = document.querySelectorAll('input[name="rv-ppe-res"]');
            Array.prototype.forEach.call(r, function (x) {
              x.setAttribute("aria-invalid", "true");
              x.setAttribute("aria-describedby", "rv-live");
            });
            $("rv-live").textContent = "Indiquez le résultat de la vérification PPE par le cabinet et la source consultée.";
            if (r[0]) r[0].focus();
            return true;
          }
          /* Critères réellement modifiés (par rapport à la dernière revue) */
          function criteresModifies() {
            var o = {};
            CRITERES.forEach(function (c) {
              var v = ui.rv.criteres[c.k];
              if (v != null && v !== niveauCrit(c.k)) o[c.k] = v;
            });
            return o;
          }
          /* Pièce reçue (marquée ou déposée) : enregistrée au dossier, la validation se débloque quand tout est reçu */
          function recevoir(lib, fichier) {
            if (!lib) return;
            X.marquerRecue(s, lib, USER.nom, fichier);
            rendre();
            focusApres(document.getElementById("dz-piece") ? "#dz-piece" : "#pieces");
            X.toast(esc(lib) + " : pièce " + (fichier ? "déposée" : "reçue") + ".");
          }
          var corps = $("lab-corps");
          corps.addEventListener("dragover", function (e) {
            var z = e.target.closest && e.target.closest("#dz");
            if (!z) return;
            e.preventDefault();
            z.classList.add("dz-on");
          });
          corps.addEventListener("dragleave", function (e) {
            var z = e.target.closest && e.target.closest("#dz");
            if (z) z.classList.remove("dz-on");
          });
          corps.addEventListener("drop", function (e) {
            var z = e.target.closest && e.target.closest("#dz");
            if (!z) return;
            e.preventDefault();
            var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if (f) recevoir($("dz-piece").value, f.name);
          });
          corps.addEventListener("click", function (e) {
            var b = e.target.closest("button");
            if (!b || b.disabled) return;
            if (b.hasAttribute("data-collecte")) {
              var loc = b.getAttribute("data-loc");
              X.collecte.ouvrir(s, {
                declencheur: b,
                onEnvoi: function () {
                  rendre();
                  focusApres('[data-collecte][data-loc="' + loc + '"]');
                  if (!document.querySelector('[data-collecte][data-loc="' + loc + '"]')) focusApres("#afaire");
                },
              });
              return;
            }
            if (b.id === "faire-revue") {
              if (ui.rv) ui.rv = null;
              else ouvrirRevue();
              rendre();
              focusApres(ui.rv ? "#rv-titre" : "#faire-revue");
              return;
            }
            if (b.id === "rv-crit") {
              ui.rv.crit = !ui.rv.crit;
              rendreRevue();
              focusApres("#rv-crit");
              return;
            }
            if (b.id === "rv-annuler") {
              ui.rv = null;
              rendre();
              focusApres("#faire-revue");
              return;
            }
            if (b.id === "rv-valider") {
              if (blocages().length || verifPPEManquante()) return;
              var r = X.validerRevue(s, USER.nom, optionsRevue());
              ui.rv = null;
              rendre();
              focusApres("#afaire");
              X.toast("Revue " + esc(de(s.nom)) + " validée. " + (r.prochaine ? "Prochaine revue le " + esc(r.prochaine) + "." : "Relation terminée."));
              return;
            }
            if (b.id === "rv-renvoyer") {
              var com = ui.rv.commentaire.trim(), ta = $("rv-com");
              if (!com) {
                ta.setAttribute("aria-invalid", "true");
                $("rv-live").textContent = "Ajoutez un commentaire pour renvoyer la revue.";
                ta.focus();
                return;
              }
              var DVr = X.renvoyerRevue(s, USER.nom, com);
              ui.rv = null;
              rendre();
              focusApres("#afaire");
              X.toast("Revue renvoyée à " + esc(DVr.par) + ".");
              return;
            }
            if (b.id === "retirer-demande") {
              X.retirerDemande(s);
              rendre();
              focusApres("#faire-revue");
              X.toast("Demande de validation retirée.");
              return;
            }
            if (b.id === "rv-demander") {
              if (blocages().length || verifPPEManquante()) return;
              var V = valideur();
              var o = optionsRevue();
              o.aCode = V.code;
              X.demanderValidation(s, USER.nom, V.nom, o);
              ui.rv = null;
              rendre();
              focusApres("#afaire");
              X.toast("Revue transmise à " + esc(V.nom) + " pour validation.");
              return;
            }
            if (b.hasAttribute("data-recue")) {
              recevoir(b.getAttribute("data-recue"), "");
              return;
            }
            if (b.id === "lever") {
              ui.hom = ui.hom ? null : { elements: {}, piece: PIECES_LEVEE[0], conclusion: null };
              rendre();
              focusApres(ui.hom ? 'input[name="lv-naissance"]' : "#lever");
              return;
            }
            if (b.id === "lv-annuler") {
              ui.hom = null;
              rendre();
              focusApres("#lever");
              return;
            }
            if (b.id === "lv-ok") {
              var h = ui.hom, live = $("lv-live");
              var manque = ELEMENTS.filter(function (x) { return !h.elements[x[0]]; });
              var msg = "", invalides = [];
              if (manque.length) {
                msg = "Indiquez si chaque élément concorde : " + manque.map(function (x) { return x[1].toLowerCase(); }).join(", ") + ".";
                invalides = manque.map(function (x) { return "lv-" + x[0]; });
              } else if (!h.conclusion) {
                msg = "Choisissez une conclusion.";
                invalides = ["lv-concl"];
              } else if (h.conclusion === "levee" && !ELEMENTS.some(function (x) { return h.elements[x[0]] === "differe"; })) {
                msg = "Tous les éléments concordent : l'homonymie ne peut pas être levée.";
                invalides = ["lv-concl"];
              }
              if (msg) {
                live.textContent = msg;
                invalides.forEach(function (n) {
                  document.querySelectorAll('input[name="' + n + '"]').forEach(function (x) {
                    x.setAttribute("aria-invalid", "true");
                    x.setAttribute("aria-describedby", "lv-live");
                  });
                });
                var prem = document.querySelector('input[name="' + invalides[0] + '"]');
                if (prem) prem.focus();
                return;
              }
              var HOM = X.homonymie(s);
              var g = X.enregistrerGel(s, { personne: HOM.personne, elements: h.elements, piece: h.piece, conclusion: h.conclusion, par: USER.nom, code: USER_CODE });
              ui.hom = null;
              rendre();
              focusApres("#afaire");
              X.toast(g.conclusion === "levee" ? "Homonymie levée sur " + esc(HOM.personne) + ", enregistrée au dossier." : "Correspondance confirmée sur " + esc(HOM.personne) + ", enregistrée au dossier.");
              return;
            }
          });
          /* Saisies : l'état est gardé sans redessiner (le focus reste en place) */
          corps.addEventListener("change", function (e) {
            var t = e.target;
            if (t.id === "dz-file") {
              if (t.files && t.files[0]) recevoir($("dz-piece").value, t.files[0].name);
              return;
            }
            if (ui.rv && t.hasAttribute("data-crit")) {
              ui.rv.criteres[t.getAttribute("data-crit")] = +t.value;
              $("rv-crit-etat").textContent = texteCrit();
              return;
            }
            if (ui.rv && t.name === "rv-risque") {
              ui.rv.risque = t.value;
              majRevue();
              return;
            }
            if (ui.rv && t.id === "rv-ppe-src") {
              ui.rv.ppeSrc = t.value;
              return;
            }
            if (ui.rv && t.name === "rv-ppe-res") {
              ui.rv.ppeRes = t.value;
              Array.prototype.forEach.call(document.querySelectorAll('input[name="rv-ppe-res"]'), function (x) { x.removeAttribute("aria-invalid"); });
              $("rv-live").textContent = "";
              return;
            }
            if (ui.rv && t.id === "rv-reconduire") {
              ui.rv.reconduire = t.checked;
              $("rv-per").textContent = texteProchaine(ui.rv.risque);
              return;
            }
            if (ui.rv && t.name === "rv-concl") {
              ui.rv.conclusion = t.value;
              return;
            }
            if (ui.hom && t.id === "lv-piece") {
              ui.hom.piece = t.value;
              return;
            }
            if (ui.hom && /^lv-/.test(t.name || ""))
              document.querySelectorAll('input[name="' + t.name + '"]').forEach(function (x) { x.removeAttribute("aria-invalid"); });
            if (ui.hom && t.name === "lv-concl") {
              ui.hom.conclusion = t.value;
              $("lv-alerte").innerHTML = t.value === "confirmee" ? alerteGel("gel-form") : "";
              $("lv-live").textContent = "";
              return;
            }
            if (ui.hom && /^lv-/.test(t.name || "")) {
              ui.hom.elements[t.name.slice(3)] = t.value;
              $("lv-live").textContent = "";
            }
          });
          corps.addEventListener("input", function (e) {
            if (ui.rv && e.target.id === "rv-com") {
              ui.rv.commentaire = e.target.value;
              e.target.removeAttribute("aria-invalid");
            }
          });
        }
      })();
    </script>
