    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      .f-card {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 24px;
        padding: 18px 20px;
      }
      .f-name {
        font-size: 16px;
        font-weight: 500;
        color: var(--ej-primary-900);
        letter-spacing: 0.01em;
      }
      .f-type {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 8px;
      }
      .f-type .list-icon {
        width: 32px;
        height: 32px;
      }
      .f-type .list-icon .ms {
        font-size: 18px;
      }
      .f-type .list-icon.biz {
        background: var(--ej-accent-100);
        color: var(--ej-accent-600);
      }
      .f-type-lines {
        font-size: 14px;
        color: var(--ej-neutral-800);
        line-height: 1.45;
        padding-top: 5px;
      }
      .f-tags {
        grid-column: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .f-right {
        grid-column: 2;
        grid-row: 1 / span 3;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        min-width: 210px;
      }
      .f-dates {
        font-size: 13px;
        color: var(--ej-neutral-600);
        text-align: right;
        line-height: 1.55;
      }
      .f-dates .undef {
        color: var(--ej-neutral-400);
        font-style: italic;
      }
      .f-author {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--ej-neutral-500);
        margin-top: auto;
      }
      .f-author .ms {
        font-size: 15px;
      }
    </style>
  </head>

        <div id="ej-footer"></div>
