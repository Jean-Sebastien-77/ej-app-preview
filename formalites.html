    <style>
      .f-card {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 24px;
        padding: 18px 20px;
      }
      .f-name {
        font-size: 16px;
        font-weight: 500;
        color: var(--ej-primary-900);
        letter-spacing: 0.01em;
      }
      .f-type {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 8px;
      }
      .f-type .list-icon {
        width: 32px;
        height: 32px;
      }
      .f-type .list-icon .ms {
        font-size: 18px;
      }
      .f-type .list-icon.biz {
        background: var(--ej-accent-100);
        color: var(--ej-accent-600);
      }
      .f-type-lines {
        font-size: 14px;
        color: var(--ej-neutral-800);
        line-height: 1.45;
        padding-top: 5px;
      }
      .f-tags {
        grid-column: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .f-right {
        grid-column: 2;
        grid-row: 1 / span 3;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        min-width: 210px;
      }
      .f-dates {
        font-size: 13px;
        color: var(--ej-neutral-600);
        text-align: right;
        line-height: 1.55;
      }
      .f-dates .undef {
        color: var(--ej-neutral-400);
        font-style: italic;
      }
      .f-author {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--ej-neutral-500);
        margin-top: auto;
      }
      .f-author .ms {
        font-size: 15px;
      }
      /* Écran étroit : l'état passe sous la formalité */
      @media (max-width: 760px) {
        .f-card {
          grid-template-columns: 1fr;
        }
        .f-right {
          grid-column: 1;
          grid-row: auto;
          align-items: flex-start;
        }
        .pager {
          flex-wrap: wrap;
          row-gap: 8px;
        }
      }
    </style>
  </head>

      function esc(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      }
      function date(s) {
        return esc(s).replace("(non-définie)", '<span class="undef">(non définie)</span>');
      }
      function renderStatique() {
      document.getElementById("cards").innerHTML = DATA.map(function (c) {
        var badge = c.s
          ? '<span class="badge badge-success"><span class="ms">check</span>Documents générés</span>'
          : '<span class="badge badge-progress"><span class="ms">edit_note</span>Formulaire en cours</span>';
        var tags = c.tags
          ? '<div class="f-tags">' +
            c.tags.map(function (t) {
              return '<span class="tag"><i class="dot" style="background:' + TAGC[t[0]] + '"></i><span>' + esc(t[1]) + "</span></span>";
            }).join("") +
            "</div>"
          : "";
        return (
          '<a class="card f-card" href="formalite.html">' +
          "<div>" +
          '<div class="f-name">' + esc(c.n) + "</div>" +
          '<div class="f-type"><span class="list-icon ' + c.i + '"><span class="ms">' + ICON[c.i] + "</span></span>" +
          '<div class="f-type-lines">' + c.t.map(esc).join("<br/>") + "</div></div>" +
          "</div>" +
          '<div class="f-right">' + badge +
          '<div class="f-dates">' + c.d.map(date).join("<br/>") + "</div>" +
          '<span class="f-author"><span class="ms">person</span>Créé par ' + esc(c.a) + "</span></div>" +
          tags +
          "</a>"
        );
      }).join("");
      }

      // Profil conseil (cabinet SELARL VASSEUR AVOCATS) : la liste affiche les formalités du conseil, issues de EJM.conseil.
      var CONSEIL_MODE = false;
      try { CONSEIL_MODE = localStorage.getItem("ej-cabinet") === "vasseur" && !!(window.EJM && window.EJM.conseil); } catch (e) {}

      function escC(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      var MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
      function dateLongue(s) {
        var m = /^(\d{1,2})\/(\d{2})\/(\d{4})$/.exec(String(s || ""));
        if (!m) return escC(s);
        return parseInt(m[1], 10) + " " + MOIS[parseInt(m[2], 10) - 1] + " " + m[3];
      }

      function renderConseil() {
        var C = window.EJM.conseil;
        var nomSociete = {};
        C.societes.forEach(function (x) { nomSociete[x.id] = x.nom; });
        var champ = document.getElementById("f-search");
        var cartes = document.getElementById("cards");

        function ligne(f) {
          var termine = f.statut === "termine";
          var badge = termine
            ? '<span class="badge badge-success"><span class="ms">check</span>Terminée</span>'
            : '<span class="badge badge-progress"><span class="ms">edit_note</span>En cours</span>';
          return (
            '<a class="card f-card" href="formalite.html?ref=' + encodeURIComponent(f.ref) + '">' +
            "<div>" +
            '<div class="f-name">' + escC(nomSociete[f.societe] || f.societe) + "</div>" +
            '<div class="f-type"><span class="list-icon cal"><span class="ms">event_available</span></span>' +
            '<div class="f-type-lines">' + escC(f.libelle) + "<br/>" + '<span class="muted small">' + escC(f.ref) + "</span></div></div>" +
            "</div>" +
            '<div class="f-right">' + badge +
            '<div class="f-dates">Mise à jour le ' + dateLongue(f.maj) + "</div>" +
            '<span class="f-author"><span class="ms">person</span>Créé par ' + escC(f.par) + "</span></div>" +
            "</a>"
          );
        }

        function afficher() {
          var q = champ ? champ.value.replace(/^\s+|\s+$/g, "").toLowerCase() : "";
          var liste = C.formalites.filter(function (f) {
            return !q || String(nomSociete[f.societe] || "").toLowerCase().indexOf(q) !== -1;
          });
          document.getElementById("f-count").textContent = "(" + liste.length + ")";
          cartes.innerHTML = liste.length
            ? liste.map(ligne).join("")
            : '<div class="card" style="padding:24px;text-align:center"><span class="muted">Aucune formalité ne correspond à cette recherche.</span></div>';
        }

        document.getElementById("f-pager").style.display = "none";
        if (champ) champ.addEventListener("input", afficher);
        afficher();
      }

      if (CONSEIL_MODE) renderConseil();
      else renderStatique();
