<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Dispositif LAB · Missions et conformité · Express Juridique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <style>
      /* ---- Dispositif LAB : file de travail (styles locaux) ---- */

      /* En-tête minimal : titre à gauche, Exporter et menu à droite */
      .lab-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        gap: 4px 16px;
        margin-bottom: 16px;
      }
      .lab-head .page-desc {
        grid-column: 1 / -1;
        margin-top: 0;
      }
      .lab-head-act {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-top: 18px;
      }
      .lab-head-act .icon-btn {
        border: 1px solid var(--ej-hairline);
        border-radius: var(--ej-radius-full);
        width: 34px;
        height: 34px;
      }
      .lab-head-act .dropdown-menu {
        min-width: 280px;
      }
      .lab-head-act .dropdown-item {
        cursor: pointer;
      }
      /* Menu « ⋯ » piloté par la page : fermé = hidden, donc aucun lien atteignable */
      .lab-head-act .dropdown-menu[hidden] {
        display: none;
      }

      /* Filtres-compteurs + recherche sur une ligne */
      .lab-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px 12px;
        margin-bottom: 14px;
      }
      .lab-pills {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 0 1 auto;
        min-width: 0;
        flex-wrap: wrap;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .lab-pills::-webkit-scrollbar {
        display: none;
      }
      .lab-pills .qf-pill {
        flex-shrink: 0;
        padding: 0 13px;
        white-space: nowrap;
      }
      .qf-pill .n {
        font-weight: 500;
        color: var(--ej-neutral-500);
        font-variant-numeric: tabular-nums;
      }
      .qf-pill.active .n,
      .qf-pill.active-warning .n {
        color: inherit;
      }
      .lab-sep {
        flex-shrink: 0;
        width: 1px;
        height: 22px;
        margin: 0 4px;
        background: var(--ej-neutral-200);
      }
      .lab-bar .search {
        flex: 0 1 220px;
        min-width: 180px;
        margin-left: auto;
        height: 34px;
        padding: 0 12px;
      }
      .lab-bar .search .ms {
        font-size: 16px;
      }
      .lab-bar .search input {
        font-size: 13px;
      }

      /* Liste */
      .lab-table {
        table-layout: auto;
      }
      .lab-table tbody tr {
        cursor: pointer;
      }
      .lab-table th,
      .lab-table td {
        padding-left: 12px;
        padding-right: 12px;
        vertical-align: middle;
      }
      .lab-table td {
        padding-top: 11px;
        padding-bottom: 11px;
      }
      .lab-table th:first-child,
      .lab-table td:first-child {
        padding-left: 18px;
      }
      .lab-table th:last-child,
      .lab-table td:last-child {
        padding-right: 18px;
        text-align: right;
      }
      .c-soc a {
        font-family: var(--ej-font-display);
        font-weight: 600;
        font-size: 14px;
        color: var(--ej-primary-900);
      }
      .c-soc a:hover {
        color: var(--ej-action-600);
      }
      .c-sub {
        display: block;
        margin-top: 2px;
        font-size: 12.5px;
        color: var(--ej-neutral-500);
      }
      .c-soc .c-sub {
        white-space: nowrap;
      }
      .c-sub.warn {
        color: var(--ej-warning-600);
        font-weight: 500;
      }
      .m-chip {
        display: inline-flex;
        align-items: center;
        height: 18px;
        padding: 0 6px;
        margin-right: 6px;
        border-radius: var(--ej-radius-sm);
        background: var(--ej-neutral-100);
        font-family: var(--ej-font-display);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--ej-neutral-600);
        vertical-align: 1px;
      }
      .motif {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        color: var(--ej-neutral-900);
      }
      .motif .ms {
        flex-shrink: 0;
        font-size: 16px;
      }
      .motif.k-homonymie .ms,
      .motif.k-revue .ms {
        color: var(--ej-attention-500);
      }
      .motif.k-pieces .ms {
        color: var(--ej-info-600);
      }
      .motif.k-ouvrir .ms {
        color: var(--ej-neutral-400);
      }
      .motif.k-ajour {
        font-weight: 500;
      }
      .motif.k-ajour .ms {
        color: var(--ej-success-600);
      }
      .c-motif .c-sub {
        padding-left: 24px;
      }
      .c-ech {
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .c-ech .warn {
        color: var(--ej-warning-600);
        font-weight: 500;
      }
      .verb {
        white-space: nowrap;
      }
      .verb.sent {
        color: var(--ej-success-600);
        border-color: transparent;
        cursor: default;
      }
      .verb.sent:hover {
        transform: none;
        background: transparent;
      }
      .open-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        font-weight: 600;
        color: var(--ej-action-600);
        white-space: nowrap;
      }
      .open-link .ms {
        font-size: 16px;
      }
      .lab-empty {
        padding: 36px 20px;
        text-align: center;
        color: var(--ej-neutral-500);
        font-size: 14px;
      }
      .lab-empty strong {
        display: block;
        margin-bottom: 4px;
        font-family: var(--ej-font-display);
        font-size: 15px;
        color: var(--ej-primary-900);
      }
      .lab-empty .ms {
        display: block;
        margin: 0 auto 8px;
        font-size: 26px;
        color: var(--ej-success-600);
      }
      .lab-empty button {
        margin-top: 8px;
        font-weight: 600;
        color: var(--ej-action-600);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      /* Pied de liste : source des données et couverture, une seule fois */
      .lab-foot {
        margin-top: 12px;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--ej-neutral-500);
      }
      .lab-foot p {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 6px;
      }
      .lab-foot p + p {
        margin-top: 4px;
      }
      .lab-foot .ms {
        font-size: 14px;
        color: var(--ej-neutral-400);
      }
      /* La bulle des sources contient un lien : style du lien seulement, l'atteignabilité est dans ej-missions.css */
      .lab-foot .info-tip-pop a {
        font-weight: 600;
        color: var(--ej-action-600);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      @media (max-width: 900px) {
        .lab-bar {
          flex-direction: column;
          flex-wrap: nowrap;
          align-items: stretch;
          gap: 10px;
        }
        .lab-bar .search {
          flex: 0 0 auto;
          max-width: none;
          margin-left: 0;
        }
        .lab-pills {
          flex-wrap: nowrap;
          overflow-x: auto;
          margin: 0 -16px;
          padding: 0 16px;
        }
      }

      /* Petit écran : une carte par dossier */
      @media (max-width: 760px) {
        .lab-head {
          margin-bottom: 14px;
        }
        .lab-head-act {
          padding-top: 14px;
        }
        .lab-head-act .lab-exp-lbl {
          display: none;
        }
        .lab-head-act .btn-sm {
          width: 34px;
          padding: 0;
        }
        .lab-table,
        .lab-table tbody,
        .lab-table tr,
        .lab-table td {
          display: block;
          width: 100%;
        }
        .lab-table thead {
          display: none;
        }
        .lab-table tr {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 6px 12px;
          padding: 14px 16px;
          border-bottom: 1px solid var(--ej-neutral-200);
        }
        .lab-table tr:last-child {
          border-bottom: none;
        }
        .lab-table td,
        .lab-table td:first-child,
        .lab-table td:last-child {
          padding: 0;
          border: none;
          text-align: left;
        }
        .lab-table td.c-soc,
        .lab-table td.c-motif,
        .lab-table td.c-act {
          grid-column: 1 / -1;
        }
        .lab-table td.c-ech {
          white-space: normal;
          font-size: 13px;
        }
        .lab-table td.c-ech .c-sub {
          display: inline;
        }
        .lab-table td.c-ech .c-sub::before {
          content: " · ";
        }
        .lab-table td.c-resp {
          justify-self: end;
          width: auto;
        }
        .lab-table td.c-act {
          padding-top: 6px;
        }
        .lab-table td.c-act .btn {
          width: 100%;
        }
        .lab-table td.c-act .open-link {
          display: none;
        }
        .lab-table tbody tr:hover td {
          background: transparent;
        }
      }
    </style>
  </head>
  <body class="m-resp" data-active="lab">
    <div id="ej-header"></div>
    <div class="app">
      <div id="ej-sidebar"></div>
      <div class="main">
        <div class="page page-wide">
          <div class="lab-head">
            <div>
              <div class="m-eyebrow">Missions &amp; conformité</div>
              <h1 class="page-title">Dispositif LAB</h1>
            </div>
            <div class="lab-head-act">
              <button class="btn btn-secondary btn-sm" type="button" id="exporter" aria-label="Exporter la liste affichée"><span class="ms">download</span><span class="lab-exp-lbl">Exporter</span></button>
              <div class="dropdown" id="plus">
                <button class="icon-btn" type="button" id="plus-btn" aria-haspopup="true" aria-expanded="false" aria-controls="plus-menu" aria-label="Autres actions"><span class="ms">ellipsis</span></button>
                <div class="dropdown-menu" id="plus-menu" hidden>
                  <a class="dropdown-item" href="#"><span class="ms">sliders-horizontal</span>Paramétrer la grille de risque</a>

    <script src="assets/ej-missions-data.js?v=20"></script>
    <script src="assets/ej-cockpit-data.js?v=4"></script>
    <script src="assets/ej-dpj-data.js?v=2"></script>
    <script src="assets/ej-lab.js?v=3"></script>
    <script>
      /* Le shell (chargé après ce script) pose body[data-profil] et window.EJ_USER : la page se construit au DOMContentLoaded. */
      document.addEventListener("DOMContentLoaded", function () {
        var E = window.EJM,
          X = window.EJLAB,
          esc = E.esc;
        function $(id) {
          return document.getElementById(id);
        }

        /* ---------- Profil de cabinet (ec, cac, mixte) ---------- */
        var PROFIL = document.body.getAttribute("data-profil");
        if (PROFIL !== "ec" && PROFIL !== "cac" && PROFIL !== "mixte") {
          PROFIL = "ec";
          try {
            var sv = localStorage.getItem("ej-profil");
            if (sv === "ec" || sv === "cac" || sv === "mixte") PROFIL = sv;
          } catch (e) {}
        }
        var MIXTE = PROFIL === "mixte";
        var S = PROFIL === "ec" ? E.societes : PROFIL === "cac" ? E.mandats : E.societes.concat(E.mandats);
        var estCAC = X.estCAC;
        function respId(s) {
          return estCAC(s) ? s.signataire : s.resp;
        }
        /* Responsable LAB du cabinet : valide les revues et lève les homonymies */
        var RLAB = E.equipe[E.responsableLab(PROFIL)];

        /* ---------- Dates ---------- */
        var d = X.dt;
        var TODAY = d(E.today);
        function jours(s) {
          return Math.round((TODAY - d(s)) / 86400000);
        }
        function nbj(n, unite) {
          return n + " " + unite + (n > 1 ? "s" : "");
        }

        /* Faculté sous conditions : le libellé reste local à la page (EJM n'est pas modifié) */
        var VIG = { faible: "vigilance simplifiée possible", standard: "vigilance standard", eleve: "vigilance renforcée" };

        /* Mission CAC en phase d'acceptation : la mission n'est pas acceptée tant que l'identification n'est pas complète */
        function acceptation(s) {
          return estCAC(s) && s.ex && s.ex.phase === "acceptation";
        }
        function finAcceptation(s) {
          var it = (s.interventions || []).filter(function (i) { return /^Acceptation/.test(i[0]) && i[3] !== "fait"; })[0];
          return it ? it[2] : null;
        }
        /* Date limite proche (moins de 15 jours) : fin de l'acceptation d'une mission CAC dont l'identification est incomplète */
        function limiteProche(s) {
          var f = acceptation(s) && s.lab.statut === "incomplet" && finAcceptation(s);
          if (!f) return null;
          var n = jours(f) * -1;
          return n < 15 ? f : null;
        }

        /* ---------- Motifs d'action (un dossier peut en cumuler plusieurs) ---------- */
        var MOTIFS = {
          homonymie: { label: "Homonymie à lever", warn: true, test: function (s) { return s.lab.gel === "a_verifier"; } },
          revue: { label: "Revues échues", warn: true, test: function (s) { return s.lab.statut === "a_revoir"; } },
          pieces: { label: "Pièces manquantes", test: function (s) { return s.lab.statut === "incomplet"; } },
          ouvrir: { label: "À ouvrir", test: function (s) { return s.lab.statut === "a_ouvrir"; } },
        };
        var CLES = ["homonymie", "revue", "pieces", "ouvrir"];
        function motifsDe(s) {
          return CLES.filter(function (k) { return MOTIFS[k].test(s); });
        }
        function aTraiter(s) {
          return motifsDe(s).length > 0;
        }
        var manquantes = X.nbManquantes;
        function nPieces(m) {
          return m + (m > 1 ? " pièces manquantes" : " pièce manquante");
        }
        function texteMotif(k, s) {
          if (k === "homonymie") return "Homonymie à lever sur le gel des avoirs";
          if (k === "revue") return "Revue échue depuis " + nbj(jours(s.lab.prochaineRevue), "jour");
          if (k === "pieces") {
            if (acceptation(s)) return "Mission en acceptation : identification à compléter";
            return nPieces(manquantes(s)) + " sur " + s.lab.pieces[1];
          }
          return "Dossier à ouvrir";
        }
        function texteCourt(k, s) {
          if (k === "pieces") return nPieces(manquantes(s)) + " sur " + s.lab.pieces[1];
          if (k === "homonymie") return "homonymie à lever";
          if (k === "revue") return "revue échue";
          return "dossier à ouvrir";
        }
        var ICONE = { homonymie: "shield-alert", revue: "history", pieces: "file-clock", ouvrir: "folder-open", ajour: "circle-check" };
        var VERBE = { homonymie: "Lever l'homonymie", revue: "Faire la revue", ouvrir: "Ouvrir le dossier" };
        var RANG_RISQUE = { eleve: 0, standard: 1, faible: 2 };

        /* Clé de tri d'urgence : homonymie ; toute date limite à moins de 15 jours (acceptation CAC) ;
           revues échues (risque élevé, standard, faible, puis de la plus ancienne à la plus récente) ;
           pièces (dossier ouvert depuis le plus longtemps d'abord) ; dossiers à ouvrir ; puis à jour */
        function cleTri(s, k) {
          if (k === "homonymie") return [0, s.lab.criblage ? d(s.lab.criblage).getTime() : 0];
          var lim = k !== "ajour" && limiteProche(s);
          if (lim) return [1, d(lim).getTime()];
          if (k === "revue") return [2, (RANG_RISQUE[s.lab.risque] != null ? RANG_RISQUE[s.lab.risque] : 3) * 1e13 + d(s.lab.prochaineRevue).getTime()];
          if (k === "pieces") return [3, s.lab.ouverture ? d(s.lab.ouverture).getTime() : 0];
          if (k === "ouvrir") return [4, 0];
          return [5, s.lab.prochaineRevue ? d(s.lab.prochaineRevue).getTime() : 0];
        }

        /* ---------- Filtres (gardés dans l'adresse : ?f=revue&q=...) ---------- */
        var FILTRES = ["traiter", "homonymie", "revue", "pieces", "ouvrir"];
        function testFiltre(f, s) {
          if (f === "tous") return true;
          if (f === "traiter") return aTraiter(s);
          return MOTIFS[f].test(s);
        }
        function compte(f) {
          return S.filter(function (s) { return testFiltre(f, s); }).length;
        }
        /* Motif affiché en premier : celui du filtre actif, sinon le plus urgent */
        function motifPrincipal(s) {
          if (MOTIFS[etat.f] && MOTIFS[etat.f].test(s)) return etat.f;
          return motifsDe(s)[0] || "ajour";
        }

        var etat = { f: "traiter", q: "" };
        (function () {
          var p = new URLSearchParams(location.search);
          var f = p.get("f");
          if (f && (f === "tous" || FILTRES.indexOf(f) !== -1)) etat.f = f;
          etat.q = p.get("q") || "";
          $("q").value = etat.q;
        })();
        function memoriserEtat() {
          var p = new URLSearchParams();
          if (etat.f !== "traiter") p.set("f", etat.f);
          if (etat.q.trim()) p.set("q", etat.q.trim());
          var qs = p.toString() ? "?" + p.toString() : "";
          try {
            history.replaceState(null, "", "lab.html" + qs);
          } catch (e) {}
          /* Lien retour de la fiche (« ‹ Dispositif LAB ») : même filtre, même recherche */
          try {
            sessionStorage.setItem("ej-lab-file", qs);
          } catch (e) {}
        }

        function dessinerPills() {
          var h = FILTRES.map(function (f) {
            var n = compte(f);
            if (!n && f !== "traiter") return "";
            var actif = etat.f === f;
            var warn = MOTIFS[f] && MOTIFS[f].warn;
            var cls = "qf-pill" + (warn ? " warning" : "") + (actif ? (warn ? " active-warning" : " active") : "");
            var lib = f === "traiter" ? "À traiter" : MOTIFS[f].label;
            return '<button type="button" class="' + cls + '" data-f="' + f + '" aria-pressed="' + actif + '">' + esc(lib) + ' <span class="n">' + n + "</span></button>";
          }).join("");
          var actifT = etat.f === "tous";
          h += '<span class="lab-sep" aria-hidden="true"></span>' +
            '<button type="button" class="qf-pill' + (actifT ? " active" : "") + '" data-f="tous" aria-pressed="' + actifT + '">Tous les dossiers <span class="n">' + S.length + "</span></button>";
          $("pills").innerHTML = h;
        }

        /* ---------- Cellules ---------- */
        function tag(id) {
          var m = E.equipe[id];
          return '<span class="tag" title="Responsable du dossier"><i class="dot" style="background:' + m.couleur + '"></i><span>' + esc(m.nom) + "</span></span>";
        }
        function profilRisque(s) {
          var t = s.lab.risque ? E.RISQUE[s.lab.risque] + ", " + VIG[s.lab.risque] : "Risque non évalué";
          if (s.lab.ppe) t += " · PPE";
          if (s.lab.beDefaut) t += " · bénéficiaire effectif : représentant légal, à défaut";
          return t;
        }
        function celluleMotif(s, k) {
          var lib = k === "ajour" ? "À jour jusqu'au " + s.lab.prochaineRevue : texteMotif(k, s);
          var sub = [];
          var autres = motifsDe(s).filter(function (x) { return x !== k; }).map(function (x) { return texteCourt(x, s); });
          /* Pièces manquantes d'un dossier dont le motif n'est pas « pièces » (revue échue, homonymie) */
          if (k !== "pieces" && k !== "ouvrir" && k !== "ajour" && !MOTIFS.pieces.test(s) && manquantes(s) > 0) autres.push(nPieces(manquantes(s)));
          if (autres.length) sub.push("Aussi : " + autres.join(", "));
          if (k === "pieces" && acceptation(s)) sub.push(texteCourt("pieces", s));
          var col = X.derniereCollecte(s.id);
          if (col && k !== "ajour") sub.push("Collecte envoyée le " + col.date);
          var rv = X.revueSession(s.id);
          if (rv && k === "ajour") sub.push("Revue validée le " + rv.date + " par " + rv.par);
          sub.push(profilRisque(s));
          return (
            '<span class="motif k-' + k + '"><span class="ms">' + ICONE[k] + "</span>" + esc(lib) + "</span>" +
            '<span class="c-sub">' + esc(sub.join(" · ")) + "</span>"
          );
        }
        function celluleEcheance(s, k) {
          var L = s.lab;
          if (k === "homonymie")
            return L.criblage ? "Criblage du " + L.criblage + '<span class="c-sub">il y a ' + nbj(jours(L.criblage), "jour") + "</span>" : "Criblage à relancer";
          if (k === "revue") return '<span class="warn">Échue le ' + L.prochaineRevue + "</span>";
          if (k === "pieces") {
            var f = acceptation(s) && finAcceptation(s);
            if (f) return '<span class="warn">Avant le ' + f + '</span><span class="c-sub">fin de l\'acceptation</span>';
            return L.ouverture ? "Ouvert le " + L.ouverture + '<span class="c-sub">il y a ' + nbj(jours(L.ouverture), "jour") + "</span>" : "";
          }
          if (k === "ouvrir") return '<span class="muted">Non ouvert</span><span class="c-sub">aucune diligence engagée</span>';
          return L.derniereRevue ? '<span class="muted">Revue validée le ' + L.derniereRevue + "</span>" : "";
        }
        function celluleAction(s, k, href, nom) {
          if (k === "ajour")
            return '<a class="open-link" href="' + esc(href) + '" aria-label="Ouvrir le dossier LAB ' + esc(nom) + '">Ouvrir<span class="ms">arrow_forward</span></a>';
          if (k === "pieces")
            return '<button class="btn btn-sm btn-secondary verb" type="button" data-collecte="' + esc(s.id) + '" aria-label="' + esc(X.verbePieces(s) + " : " + nom) + '">' + esc(X.verbePieces(s)) + "</button>";
          return '<a class="btn btn-sm btn-secondary verb" href="' + esc(href) + '" aria-label="' + esc(VERBE[k] + " : " + nom) + '">' + VERBE[k] + "</a>";
        }
        function ligne(s, avecResp) {
          var k = etat.f === "tous" && !aTraiter(s) ? "ajour" : motifPrincipal(s);
          var href = "lab-dossier.html?id=" + encodeURIComponent(s.id) + "&from=lab";
          return (
            '<tr data-href="' + esc(href) + '" data-id="' + esc(s.id) + '">' +
            '<td class="c-soc"><a href="' + esc(href) + '">' + esc(s.nom) + "</a>" +
            '<span class="c-sub">' +
            (MIXTE ? '<span class="m-chip" title="' + (estCAC(s) ? "Commissariat aux comptes" : "Expertise comptable") + '">' + (estCAC(s) ? "CAC" : "EC") + "</span>" : "") +
            esc(s.forme) + " · SIREN " + esc(s.siren) + "</span></td>" +
            '<td class="c-motif">' + celluleMotif(s, k) + "</td>" +
            '<td class="c-ech">' + celluleEcheance(s, k) + "</td>" +
            (avecResp ? '<td class="c-resp">' + tag(respId(s)) + "</td>" : "") +
            '<td class="c-act">' + celluleAction(s, k, href, s.nom) + "</td>" +
            "</tr>"
          );
        }

        /* ---------- Liste ---------- */
        function norm(t) {
          return String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
        }
        function trouve(s, q) {
          if (!q) return true;
          /* SIREN : avec ou sans espaces, complet ou partiel (« 412 386 », « 412386950 ») */
          var qn = q.replace(/\s/g, "");
          return norm(s.nom).indexOf(q) !== -1 || (/^\d+$/.test(qn) && s.siren.replace(/\s/g, "").indexOf(qn) !== -1);
        }
        function trier(a, b) {
          var ka = cleTri(a, etat.f === "tous" && !aTraiter(a) ? "ajour" : motifPrincipal(a));
          var kb = cleTri(b, etat.f === "tous" && !aTraiter(b) ? "ajour" : motifPrincipal(b));
          return ka[0] - kb[0] || ka[1] - kb[1] || a.nom.localeCompare(b.nom, "fr");
        }
        function dessiner() {
          var q = norm(etat.q.trim());
          var liste = S.filter(function (s) { return testFiltre(etat.f, s) && trouve(s, q); }).sort(trier);
          var tous = etat.f === "tous";
          /* Colonne Responsable masquée quand elle n'a qu'une valeur */
          var resps = {};
          liste.forEach(function (s) { resps[respId(s)] = true; });
          var avecResp = Object.keys(resps).length > 1;
          $("th-resp").hidden = !avecResp;
          $("th-motif").textContent = tous ? "État" : "À faire";
          $("rows").innerHTML = liste.map(function (s) { return ligne(s, avecResp); }).join("");
          $("table").style.display = liste.length ? "" : "none";
          var vide = $("empty");
          vide.hidden = liste.length > 0;
          if (!liste.length) {
            if (etat.f === "traiter" && !compte("traiter"))
              vide.innerHTML = '<span class="ms">circle-check</span><strong>Aucun dossier en attente.</strong>Tous les dossiers sont à jour.<br /><button type="button" data-f="tous">Tous les dossiers</button>';
            else if (q && !tous)
              vide.innerHTML = "Aucun dossier de ce filtre ne correspond à « " + esc(etat.q.trim()) + " ».<br /><button type=\"button\" data-f=\"tous\">Chercher dans tous les dossiers</button>";
            else vide.innerHTML = "Aucun dossier ne correspond à « " + esc(etat.q.trim()) + " ».";
          }
          dessinerPills();
          memoriserEtat();
        }

        /* ---------- Textes selon le profil ---------- */
        var NEC = E.societes.length, NCAC = E.mandats.length;
        $("th-soc").textContent = PROFIL === "ec" ? "Société" : PROFIL === "cac" ? "Entité" : "Société ou entité";
        var DPJ_MAJ = window.EJDPJ && window.EJDPJ.maj ? " (mis à jour le " + window.EJDPJ.maj + ")" : "";
        var SRC_TXT =
          PROFIL === "ec" ? "Identité, dirigeants et bénéficiaires effectifs repris du DPJ" + DPJ_MAJ + " · criblage PPE et gel des avoirs via le connecteur KYC" :
          PROFIL === "cac" ? "Identité, dirigeants et bénéficiaires effectifs repris du dossier de mission et des registres publics · criblage PPE et gel des avoirs via le connecteur KYC" :
          "Identité, dirigeants et bénéficiaires effectifs repris du DPJ" + DPJ_MAJ + " ou, pour les entités contrôlées, des registres publics · criblage PPE et gel des avoirs via le connecteur KYC";
        $("note-sources").innerHTML =
          esc(SRC_TXT) + ". " +
          (PROFIL === "ec" ? "DPJ : dossier permanent juridique. " :
           PROFIL === "cac" ? "Registres publics : registre national des entreprises (RNE), registre des bénéficiaires effectifs (RBE) et, pour les associations, répertoire national des associations (RNA). " :
           "DPJ : dossier permanent juridique, pour les clients en expertise comptable. Registres publics : RNE, RBE et, pour les associations, RNA. ") +
          "PPE : personne politiquement exposée. KYC : connaissance du client. " +
          "Les revues et les levées d'homonymie sont validées par " + esc(RLAB.nom) + ", responsable LAB du cabinet. " +
          '<a href="connecteurs.html">Voir les connecteurs</a>';
        $("couverture").textContent =
          PROFIL === "ec" ? NEC + " dossiers du périmètre missions, sur " + E.totalSocietes + " sociétés suivies." :
          PROFIL === "cac" ? NCAC + " entités contrôlées par le cabinet." :
          S.length + " dossiers : " + NEC + " sociétés du périmètre missions (sur " + E.totalSocietes + " suivies) et " + NCAC + " entités contrôlées.";

        /* ---------- Collecte de pièces : fenêtre commune (assets/ej-lab.js) ---------- */
        function ouvrirCollecte(s, btn) {
          X.collecte.ouvrir(s, {
            declencheur: btn,
            onEnvoi: function () {
              dessiner();
              var b = $("rows").querySelector('tr[data-id="' + s.id + '"] .c-act .btn') || $("q");
              b.focus();
            },
          });
        }

        /* ---------- Menu « ⋯ » ---------- */
        var mBtn = $("plus-btn"), mMenu = $("plus-menu");
        function menu(ouvrir, rendreFocus) {
          mMenu.hidden = !ouvrir;
          mBtn.setAttribute("aria-expanded", String(ouvrir));
          mBtn.parentNode.classList.toggle("open", ouvrir);
          if (ouvrir) mMenu.querySelector("a").focus();
          else if (rendreFocus) mBtn.focus();
        }
        mBtn.addEventListener("click", function () {
          menu(mMenu.hidden);
        });
        mMenu.addEventListener("keydown", function (e) {
          var items = Array.prototype.slice.call(mMenu.querySelectorAll("a"));
          var i = items.indexOf(document.activeElement);
          if (e.key === "Escape") {
            e.preventDefault();
            menu(false, true);
          } else if (e.key === "ArrowDown") {
            e.preventDefault();
            items[(i + 1) % items.length].focus();
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            items[(i - 1 + items.length) % items.length].focus();
          }
        });
        mMenu.addEventListener("focusout", function (e) {
          if (!mMenu.hidden && !mMenu.contains(e.relatedTarget) && e.relatedTarget !== mBtn) menu(false);
        });
        document.addEventListener("click", function (e) {
          if (!mMenu.hidden && !e.target.closest("#plus")) menu(false);
        });

        /* ---------- Événements ---------- */
        function choisir(e) {
          var b = e.target.closest("[data-f]");
          if (!b) return;
          etat.f = b.getAttribute("data-f");
          dessiner();
        }
        $("pills").addEventListener("click", choisir);
        $("empty").addEventListener("click", choisir);
        $("q").addEventListener("input", function (e) {
          etat.q = e.target.value;
          dessiner();
        });
        $("rows").addEventListener("click", function (e) {
          var c = e.target.closest("[data-collecte]");
          if (c) {
            var s = S.filter(function (x) { return x.id === c.getAttribute("data-collecte"); })[0];
            if (s) ouvrirCollecte(s, c);
            return;
          }
          if (e.target.closest("a, button")) return;
          var tr = e.target.closest("tr[data-href]");
          if (tr) location.href = tr.getAttribute("data-href");
        });
        $("exporter").addEventListener("click", function () {
          X.toast("Liste affichée exportée.");
        });
        document.querySelectorAll('a[href="#"]').forEach(function (a) {
          a.addEventListener("click", function (e) { e.preventDefault(); });
        });

        dessiner();
      });
    </script>
    <script src="assets/ej-shell.js?v=24"></script>
  </body>
</html>
